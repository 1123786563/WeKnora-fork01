# backend-modules.yaml — Server ownership inventory (Task F0, Pass A)
#
# Facts:
#   - Scope: cmd/server + internal/... ONLY (cmd/desktop, cmd/docreader, cmd/client,
#     cmd/connector-control, cmd/download, cmd/saas-migrate are OUT of scope).
#   - Authority for module boundaries: docs/specs/2026-09-21-backend-domain-module-reorganization-design.md §5.18.
#   - Every server package / route entry point / worker task type / container.Invoke hook /
#     migration file below has EXACTLY ONE owner. Duplicate or missing owners are defects.
#   - base_sha and baseline commands: see docs/architecture/backend-baseline.md.
#
# Owner categories:
#   - 16 business modules: identity, knowledge, conversation, agentcatalog, agentruntime,
#     workbench, craft, execution, datasource, appconnector, channels, airesource,
#     commercial, insights, system, policy.
#   - 2 non-business categories: platform (shared technical primitives),
#     bootstrap (process assembly / wiring / migration runner baseline schema).
#
# Conventions:
#   - "packages" are Go import paths under module github.com/Tencent/WeKnora.
#   - "routes" are HTTP registration entry points in internal/router (source file:line)
#     plus handler-side route-mounting functions; total gin route registrations = 633
#     (564 literal method calls + 69 g.apiKeyRoute helper calls, comment text excluded).
#   - "workers" are asynq task types (Redis mode: internal/router/task.go; Lite mode:
#     internal/router/sync_task.go registers the same 23 types on SyncTaskExecutor).
#   - "hooks" are container.Invoke lifecycle call sites (internal/container/container.go
#     unless another file is given).
#   - "migrations" pair each NNNNNN_name.up.sql with its .down.sql as ONE asset.
#   - Horizontal packages whose files span multiple modules carry a `split:` note and
#     the package-level owner is the plurality content owner (Pass B splits files).

meta:
  base_sha: 7b1d3cf017a50cc8061da166d67befc6b51773a0
  branch: backend-mod-passa
  go_module: github.com/Tencent/WeKnora
  scope: [cmd/server, internal/...]
  counts:
    server_packages: 128            # go list ./... filtered to cmd/server + internal/...
    route_registrations: 633        # ALL registration paths, non-test, comments excluded:
                                    # 564 literal .GET/.POST/.PUT/.DELETE/.PATCH/.HEAD calls
                                    # (router 535 + handler 29) + 69 g.apiKeyRoute helper
                                    # calls (rbac.go:398, registers via grp.Handle);
                                    # 0 direct .Handle call sites outside the helper itself.
    route_entry_points: 90          # 67 Register* + 16 serve*/embedFrame* in internal/router
                                    # + 7 handler-side route-mounting Register* functions
                                    # (craft sessions/interaction/scheduled, craft preview
                                    # ×2, artifact preview ×2)
    redis_worker_pools: 6           # asynq servers (core/postprocess/enrichment/maintenance/shared/wiki)
    redis_worker_task_types: 23     # mux.HandleFunc registrations in internal/router/task.go
    lite_worker_task_types: 23      # RegisterSyncHandlers in internal/router/sync_task.go (same set)
    container_invoke_hooks: 58      # container.Invoke call sites in internal/container/container.go
    migration_files: 537            # .sql files: mysql 1, paradedb 2, sqlite 188, versioned 346
    migration_assets: 270           # 94 sqlite pairs + 173 versioned pairs + 3 single files


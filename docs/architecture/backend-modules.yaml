      - cmd/server
      - internal/container
      - internal/router
      - internal/config
      - internal/runtime
      - internal/assets
    routes:
      - name: NewRouter (assembly entry)
        source: internal/router/router.go:138
    workers:
      - name: RunAsynqServer (Redis mode worker bootstrap)
        source: internal/router/task.go:231 (invoked container.go:1044)
      - name: RegisterSyncHandlers (Lite mode in-memory worker bootstrap)
        source: internal/router/sync_task.go:142 (invoked container.go:1046)
    hooks:
      - name: RunAsynqServer (Invoke)
        source: internal/container/container.go:1044
      - name: RegisterSyncHandlers (Invoke)
        source: internal/container/container.go:1046
    migrations:
      mysql:
        - "migrations/mysql/00-init-db.sql"
      sqlite:
        - "migrations/sqlite/000000_init"
      versioned:
        - "migrations/versioned/000000_init"
      note: init 基线 schema 跨模块（users/sessions/knowledge 等同批建表）；owner=bootstrap，
        Pass B 按表归属逐项拆分时需设计修订（§5.18 遗漏处理规则）。

# =========================================================================
# Shared / horizontal assets requiring Pass B file-level split
# (each listed once here; package-level owners above are the F0 plurality decisions)
# =========================================================================
shared_assets:
  - path: internal/application/service
    owner: knowledge
    note: 见 knowledge.horizontal_packages[0] 的完整拆分清单
  - path: internal/application/repository
    owner: agentruntime
    note: 见 agentruntime.horizontal_packages[1] 的完整拆分清单
  - path: internal/handler
    owner: platform
    note: 见 platform.horizontal_packages[0] 的完整拆分清单
  - path: internal/handler/session
    owner: conversation
    note: 见 conversation.horizontal_packages[0] 的完整拆分清单
  - path: internal/mcp
    owner: airesource

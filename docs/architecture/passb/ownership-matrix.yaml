# Pass B ownership matrix — 冻结每个 legacy 文件与 alias 的唯一属主（B0.2 生成）。
# 事实源：docs/architecture/moves/*.yaml（16 manifest）+ docs/architecture/passb/*.md brief
# + docs/plans/2026-09-23-backend-modularization-pass-b-framework.md 计划表。
# schema 由 tools/passbguard 严格校验（KnownFields）；本文件行集与 manifest legacy_files
# （396 条）和 alias_obligations（99 条）经 DiscoverPassB/CheckOwnership 机器对照，
# 任何一侧缺失/多出/属主漂移均为诊断。
#
# 字段：path=横向宿主包内精确路径；module=manifest 模块；plan=删除属主子计划；
# destination=目标模块包（brief 显式建议优先，其余按源层级 repository/service/handler 规则）；
# integration_owner=共享宿主装配屏障（router/container 切换点）；delete_barrier=删除收口屏障。
# 知识域 K1-K4 与 Agent Runtime R1-R4 按 brief scope 清单逐文件归属；
# internal/application/repository/knowledge.go 显式归 24-knowledge-process
# （escapeLikeKeyword 跨 owner 消费见 knowledge-process.md 消歧注记）。
#
# B0.3 裁定（freeze Task B0.3，passbguard CheckRulings/CheckBriefClaims 机器校验）：
# 1. Agent Runtime：native_archive 双文件（service + handler/session）独占归
#    34-agentruntime-protocol；native_recovery 与全部 native repository 状态/
#    lease/pending/usage 族及引擎侧审批、Run/Attempt 文件归 33-agentruntime-engine；
#    纯 native/nativecontract/nativeprobe/trpc/opencode/recoverytest 协议包归 34。
# 2. 共享宿主 internal/handler/session 全部 36 文件逐路径唯一属主（见
#    tools/passbguard/overlap.go HandlerSessionRuling）；browserskill.go、
#    sandbox_terminal_ws.go、sandbox_terminal_bridge.go 归 13-execution——三者挂在
#    conversation 属主 *Handler 上的方法拆出时去方法化，残差登记 Integration
#    Brief 推迟 IB1（conventions §7.4 / DAG b1-execution required_contracts）。
# 3. knowledge_housekeeping.go 业务清扫规则留 Knowledge（24）；System
#    （42-system-policy）经窄 KnowledgeHousekeeping port 拥有调度/生命周期调用，
#    不得出现第二套清扫实现（见 knowledge-process.md 裁定注记）。
# 4. 通用分页/上传限制/错误判定 helper（internal/handler/list_pagination.go、
#    upload_limit.go）保持 platform，任何子计划不得认领，直至独立消费者抽取计划
#    另行裁定。

.card-content {
  padding:13px 15px 15px
}
.card-content h3 {
  font-size:13px;
  margin:6px 0 3px
}
.card-description {
  font-size:11px;
  color:var(--craft-secondary-text);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.card-footer {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
  font-size:10px;
  color:var(--craft-secondary-text)
}
.home-bottom {
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:var(--craft-secondary-text);
  margin-top:29px
}
.home-bottom span {
  display:flex;
  gap:6px;
  align-items:center
}
.home-bottom .ico {
  width:11px;
  height:11px
}
.content-page {
  max-width:1250px;
  margin:0 auto;
  padding:38px 42px 50px
}
.page-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px;
  gap:16px
}
.page-title h1 {
  font-size:28px;
  line-height:38px
}
.page-title p {
  font-size:12px;
  color:var(--craft-secondary-text);
  margin-top:6px
}
.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px
}
.segments {
  display:flex;
  gap:4px;
  padding:3px;
  border:1px solid var(--craft-line);
  border-radius:7px;
  background:var(--craft-surface)
}
.segments button {
  border:0;
  background:transparent;
  padding:5px 12px;
  border-radius:4px;
  font-size:12px;
  color:var(--craft-secondary-text)
}
.segments button.active {
  background:var(--craft-brand-soft);
  color:var(--craft-brand-strong);
  font-weight:600
}
.search-box {
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  border:1px solid var(--craft-line);
  border-radius:6px;
  background:var(--craft-surface)
}
.search-box .ico {
  color:var(--craft-secondary-text);
  width:13px;
  height:13px
}
.search-box input {
  background:transparent;
  outline:none;
  border:0;
  width:180px;
  font-size:12px
}
.empty {
  grid-column:1/-1;
  text-align:center;
  padding:64px 20px;
  border:1px dashed var(--craft-line);
  border-radius:12px;
  background:var(--craft-surface);
  color:var(--craft-secondary-text)
}
.empty .ico {
  width:25px;
  height:25px;
  margin-bottom:10px;
  color:var(--craft-brand)
}
.empty p {
  margin:8px 0 16px
}
.workbench {
  height:calc(100dvh - var(--craft-header-height));
  display:grid;
  grid-template-columns:var(--craft-thread-width) minmax(0,1fr);
  background:var(--craft-surface);
  min-height:650px
}
.thread {
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  border-right:1px solid var(--craft-line)
}
.pane-head {
  height:53px;
  border-bottom:1px solid var(--craft-line-soft);
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0
}
.pane-head h3 {
  font-size:12px
}
.thread-scroll {
  min-height:0;
  overflow:auto;
  flex:1;
  padding:24px 22px 18px;
  scrollbar-width:thin;
  scrollbar-color:var(--craft-line) transparent
}
.thread-date {
  text-align:center;
  font-size:10px;
  color:var(--craft-secondary-text);
  margin-bottom:17px
}
.user-message {
  font-size:12px;
  line-height:22px;
  padding:13px 15px;
  background:var(--craft-brand-soft);
  border-radius:10px 10px 2px 10px;
  margin-left:24px;
  margin-bottom:24px
}
.attachments {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:10px
}
.agent-label {
  display:flex;
  align-items:center;
  gap:9px;
  margin:17px 0 12px;
  font-size:12px;
  font-weight:600
}
.agent-logo {
  width:25px;
  height:25px;
  border-radius:7px;
  background:var(--craft-accent-soft);
  color:var(--craft-success-text);
  display:flex;
  align-items:center;
  justify-content:center
}
.agent-logo .ico {
  width:13px;
  height:13px
}
.assistant-text {
  font-size:12px;
  line-height:23px;
  color:var(--craft-ink)
}
.assistant-text p+p {
  margin-top:8px
}
.run-card {
  margin:15px 0;
  border:1px solid var(--craft-line);
  border-radius:8px;
  background:var(--craft-surface)
}
.run-card header {
  padding:11px 13px;
  border-bottom:1px solid var(--craft-line-soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11px
}
.run-card header b {
  font-weight:600
}
.step-list {
  padding:12px 14px;
  display:grid;
  gap:13px
}
.step-row {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:11px
}
.step-row .ico {
  color:var(--craft-success-text);
  height:11px;
  width:11px
}
.step-row .step-pending {
  color:var(--craft-secondary-text)
}
.step-row small {
  margin-left:auto;
  color:var(--craft-secondary-text);
  font-size:10px
}
.run-details {
  border-top:1px solid var(--craft-line-soft);
  font-size:10px;
  color:var(--craft-secondary-text)
}
.run-details summary {
  padding:8px 13px;
  cursor:pointer
}
.run-details p {
  padding:0 13px 10px;
  font-family:var(--craft-font-mono);
  font-size:10px
}
.delivery {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--craft-line);
  border-left:3px solid var(--craft-success);
  border-radius:7px;
  margin:15px 0 12px;
  cursor:pointer;
  text-align:left;
  width:100%;
  background:var(--craft-surface)
}
.delivery:hover {
  background:var(--craft-accent-soft)
}
.delivery b {
  font-size:11px
}
.delivery p {
  font-size:10px;
  color:var(--craft-secondary-text);
  margin-top:2px
}
.delivery .type-icon {
  height:32px;
  width:30px
}
.suggestions {
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:13px
}
.suggestions button {
  padding:5px 8px;
  border:1px solid var(--craft-line);
  border-radius:5px;
  background:var(--craft-surface);
  font-size:10px;
  color:var(--craft-muted-strong)
}
.composer-wrap {
  flex-shrink:0;
  border-top:1px solid var(--craft-line-soft);
  padding:15px 17px 10px;
  background:var(--craft-surface)
}
.composer {
  border:1px solid var(--craft-line-strong);
  border-radius:10px;
  padding:10px 11px;
  background:var(--craft-surface)
}
.composer:focus-within {
  border-color:var(--craft-brand);
  box-shadow:0 0 0 2px var(--craft-brand-soft)
}
.composer textarea {
  width:100%;
  background:transparent;
  resize:none;
  outline:none!important;
  border:0;
  min-height:54px;
  font-size:12px;
  line-height:21px;
  padding:0
}
.composer-tools {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:4px
}
.composer-tools .btn {
  min-height:30px;
  font-size:11px
}
.base-meta {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  font-size:9px;
  color:var(--craft-secondary-text);
  margin-top:8px
}
.artifact-pane {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--craft-canvas)
}
.artifact-toolbar {
  height:53px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--craft-surface);
  border-bottom:1px solid var(--craft-line);
  gap:10px
}
.tabs {
  height:100%;
  display:flex;
  gap:22px
}
.tabs button {
  height:100%;
  padding:0 1px;
  background:transparent;
  border:0;
  position:relative;
  color:var(--craft-secondary-text);
  font-size:12px
}
.tabs button.active {
  color:var(--craft-brand-strong);
  font-weight:600
}
.tabs button.active:after {
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:2px;
  background:var(--craft-brand)
}
.artifact-toolbar select {
  background:var(--craft-surface);
  border:1px solid var(--craft-line);
  border-radius:6px;
  padding:5px 8px;
  font-size:11px;
  max-width:150px
}
.artifact-scroll {
  padding:18px 22px 24px;
  flex:1;
  min-height:0;
  overflow:auto
}
.preview-meta {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  color:var(--craft-secondary-text);
  margin-bottom:14px;
  gap:8px
}
.viewport-toggle {
  display:flex;
  background:var(--craft-surface);
  border:1px solid var(--craft-line);
  border-radius:5px;
  padding:2px;
  gap:1px
}
.viewport-toggle button {
  padding:4px 8px;
  background:transparent;
  border:0;
  border-radius:3px;
  color:var(--craft-secondary-text);
  font-size:10px
}
.viewport-toggle button.active {
  background:var(--craft-brand-soft);
  color:var(--craft-brand-strong)
}
.viewport-toggle .ico {
  width:12px;
  height:12px
}
.report {
  background:var(--craft-surface);
  border:1px solid var(--craft-line);
  border-radius:8px;
  box-shadow:var(--craft-shadow-card);
  margin:0 auto;
  overflow:hidden;
  max-width:100%;
  transition:max-width var(--craft-motion-base)
}
.report.narrow {
  max-width:390px
}
.report-nav {
  border-bottom:1px solid var(--craft-line-soft);
  padding:13px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:11px
}
.report-nav .ico {
  color:var(--craft-brand);
  width:13px;
  height:13px
}
.report-nav select {
  background:var(--craft-surface);
  border:0;
  color:var(--craft-secondary-text);
  font-size:10px;
  max-width:110px
}
.report-body {
  padding:25px 25px 20px
}
.report-heading .eyebrow {
  font-size:9px;
  letter-spacing:1.8px;
  color:var(--craft-brand-strong)
}
.report-heading h2 {
  font-size:24px;
  line-height:34px;
  margin:5px 0
}
.report-heading p {
  font-size:10px;
  color:var(--craft-secondary-text)
}
.report-stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:22px 0 19px
}
.metric {
  border:1px solid var(--craft-line-soft);
  border-radius:6px;
  padding:13px 14px;
  background:var(--craft-canvas)
}
.metric p {
  font-size:10px;
  color:var(--craft-secondary-text)
}
.metric strong {
  font-size:23px;
  line-height:32px;
  display:block;
  margin:4px 0;
  font-weight:650;
  letter-spacing:-.6px
}
.metric small {
  font-size:9px;
  color:var(--craft-success-text)
}
.metric small.neutral {
  color:var(--craft-secondary-text)
}
.report-chart {
  border:1px solid var(--craft-line);
  border-radius:6px;
  padding:14px 15px
}
.report-chart h3 {
  font-size:11px
}
.report-chart canvas {
  width:100%;
  height:160px;
  display:block;
  margin-top:12px
}
.chart-legend {
  display:flex;
  gap:12px;
  font-size:9px;
  color:var(--craft-secondary-text)
}
.legend-mark {
  height:7px;
  width:7px;
  display:inline-block;
  background:var(--craft-brand);
  border-radius:2px;
  margin-right:4px
}
.legend-mark.green {
  background:var(--craft-success)
}
.insight {
  display:flex;
  gap:10px;
  padding:14px;
  margin-top:15px;
  background:var(--craft-brand-soft);
  border-radius:6px;
  font-size:10px;
  line-height:20px;
  color:var(--craft-muted-strong)
}
.insight .ico {
  color:var(--craft-brand-strong);
  margin-top:3px;
  width:13px;
  height:13px
}
.insight b {
  color:var(--craft-ink)
}
.report-footer {
  border-top:1px solid var(--craft-line-soft);
  padding-top:13px;
  margin-top:16px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:9px;
  color:var(--craft-secondary-text)
}
.artifact-footer {
  height:31px;
  flex-shrink:0;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--craft-surface);
  border-top:1px solid var(--craft-line);
  color:var(--craft-secondary-text);
  font-size:9px;
  gap:6px
}
.artifact-footer .ico {
  width:10px;
  height:10px
}
.notice {
  display:flex;
  gap:9px;
  align-items:flex-start;
  border:1px solid var(--craft-line);
  border-radius:7px;
  background:var(--craft-brand-soft);
  padding:11px 12px;
  margin-bottom:13px;
  font-size:11px;
  line-height:19px;
  color:var(--craft-brand-deep)
}
.notice .ico {
  margin-top:2px;
  width:13px;
  height:13px
}
.notice.warn {
  border-color:var(--craft-warning-line);
  background:var(--craft-warning-soft);
  color:var(--craft-warning-text)
}
.notice.bad {
  border-color:var(--craft-danger-line);
  background:var(--craft-danger-soft);
  color:var(--craft-danger)
}
.notice .btn {
  margin-left:auto;
  flex-shrink:0
}
.notice b {
  display:block
}
.approval {
  background:var(--craft-warning-soft);
  border:1px solid var(--craft-warning-line);
  border-radius:8px;
  padding:14px;
  margin:15px 0;
  font-size:11px;
  line-height:21px
}
.approval h3 {
  font-size:12px;
  color:var(--craft-warning-text);
  margin-bottom:8px
}
.approval code {
  display:block;
  background:var(--craft-surface);
  border:1px solid var(--craft-warning-line);
  padding:9px;
  margin:10px 0;
  font-size:11px;
  border-radius:5px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.approval .btn {
  font-size:11px;
  margin-top:9px
}
.question {
  background:var(--craft-brand-soft);
  border-color:var(--craft-line)
}
.question h3 {
  color:var(--craft-brand-strong)
}
.document-paper {
  padding:31px 34px;
  background:var(--craft-surface);
  max-width:720px;
  margin:auto;
  border:1px solid var(--craft-line);
  border-radius:4px;
  box-shadow:var(--craft-shadow-card)
}
.document-paper h1 {
  font-size:27px;
  line-height:39px;
  margin:16px 0
}
.document-paper h2 {
  font-size:15px;
  line-height:25px;
  margin:20px 0 8px
}
.document-paper p {
  font-size:11px;
  line-height:22px;
  color:var(--craft-muted-strong)
}
.document-paper .doc-info {
  font-size:10px;
  color:var(--craft-secondary-text);
  padding-bottom:18px;
  border-bottom:1px solid var(--craft-line)
}
.document-paper blockquote {
  border-left:3px solid var(--craft-brand);
  padding:11px 14px;
  margin:16px 0;
  background:var(--craft-brand-soft);
  font-size:11px;
  line-height:21px
}
.data-table {
  width:100%;
  border-collapse:collapse;
  text-align:left;
  background:var(--craft-surface);
  font-size:11px
}
.data-table th {
  font-size:10px;
  color:var(--craft-muted-strong);
  background:var(--craft-canvas);
  font-weight:550
}
.data-table th,.data-table td {
  padding:12px 13px;
  border-bottom:1px solid var(--craft-line-soft);
  white-space:nowrap
}
.data-table .ico {
  color:var(--craft-brand);
  width:12px;
  height:12px
}
.table-wrap {
  overflow:auto;
  border:1px solid var(--craft-line);
  border-radius:7px;
  background:var(--craft-surface)
}
.files-meta {
  display:flex;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--craft-line);
  align-items:center
}
.files-meta h3 {
  font-size:13px
}
.sheet-tools {
  display:flex;
  align-items:center;
  gap:14px;
  padding:11px 13px;
  border:1px solid var(--craft-line);
  background:var(--craft-surface);
  font-size:11px;
  margin-bottom:0
}
.sheet-tools code {
  color:var(--craft-success-text)
}
.sheet td,.sheet th {
  border:1px solid var(--craft-line);
  padding:11px 12px
}
.sheet th {
  background:var(--craft-hover);
  text-align:center
}
.sheet .sheet-header td {
  background:var(--craft-accent-soft);
  color:var(--craft-success-text);
  font-weight:600
}
.sheet .total td {
  background:var(--craft-canvas);
  font-weight:600
}
.sheet-foot {
  padding:10px 14px;
  border:1px solid var(--craft-line);
  background:var(--craft-surface);
  font-size:11px;
  color:var(--craft-success-text)
}
.slide-layout {
  display:flex;
  gap:14px;
  align-items:flex-start
}
.slide-thumbs {
  display:grid;
  gap:10px;
  width:73px;
  flex-shrink:0
}
.slide-thumbs button {
  border:1px solid var(--craft-line);
  background:var(--craft-surface);
  border-radius:4px;
  padding:8px 3px;
  font-size:10px;
  line-height:17px;
  color:var(--craft-secondary-text);
  min-height:51px
}
.slide-thumbs button.active {
  border:2px solid var(--craft-brand);
  color:var(--craft-brand-strong);
  background:var(--craft-brand-soft)
}
.slide {
  aspect-ratio:16/10;
  background:var(--craft-brand-deep);
  color:var(--craft-surface);
  padding:32px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  width:100%;
  min-height:270px;
  border-radius:5px
}
.slide small {
  font-size:9px;
  letter-spacing:1.7px;
  color:inherit
}
.slide h1 {
  color:inherit;
  font-size:30px;
  line-height:43px;
  font-weight:550;
  letter-spacing:-.5px;
  max-width:340px
}
.slide p {
  font-size:11px;
  line-height:22px;
  opacity:.9;
  margin-top:12px
}
.slide-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:9px
}
.slide.alt {
  background:var(--craft-surface);
  color:var(--craft-brand-deep);
  border:1px solid var(--craft-line)
}
.slide.alt h1 {
  font-size:24px;
  line-height:35px
}
.slide-points {
  margin:15px 0;
  display:grid;
  gap:13px;
  font-size:11px;
  color:var(--craft-muted-strong)
}
.checks-grid {
  display:grid;
  gap:12px
}
.check-card {
  border:1px solid var(--craft-line);
  border-radius:8px;
  background:var(--craft-surface);
  padding:16px
}
.check-card p {
  margin-top:7px;
  font-size:11px;
  color:var(--craft-secondary-text)
}
.check-card h3 {
  font-size:12px
}
.dev-dl {
  display:grid;
  grid-template-columns:150px 1fr;
  gap:10px;
  padding:18px;
  background:var(--craft-surface);
  border:1px solid var(--craft-line);
  border-radius:8px;
  margin-top:16px;
  font-size:11px;
  overflow-wrap:anywhere
}
.dev-dl dt {
  color:var(--craft-secondary-text)
}
.dev-dl dd {
  margin:0;
  font-family:var(--craft-font-mono);
  font-size:10px
}
.mobile-tabs,.mobile-menu {
  display:none
}
.drawer {
  margin:0 0 0 auto;
  top:0;
  right:0;
  bottom:0;
  height:100dvh;
  max-height:100dvh;
  width:var(--craft-drawer-width);
  max-width:100%;
  border:0;
  border-left:1px solid var(--craft-line);
  border-radius:0;
  padding:0;
  color:var(--craft-ink);
  background:var(--craft-surface);
  box-shadow:var(--craft-shadow-dialog)
}
dialog::backdrop {
  background:var(--craft-overlay)
}
.drawer-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:26px 23px 20px;
  border-bottom:1px solid var(--craft-line)
}
.drawer-head h2 {
  font-size:20px;

        return `<p class="drawer-intro">仅选择当前任务需要的材料范围。正式后端将再次检查资源访问权限。</p><div class="check-list"><label class="check-option"><input type="checkbox" value="S1" name="source-choice" ${state.selectedSources.includes('S1') ? 'checked' : ''}>${icon('table')}销售数据.csv${badge('已关联', 'blue')}</label><label class="check-option"><input type="checkbox" value="S2" name="source-choice" ${state.selectedSources.includes('S2') ? 'checked' : ''} ${state.sourcesRevoked ? 'disabled' : ''}>${icon('book')}产品知识库${badge(state.sourcesRevoked ? '已撤权' : '可检索', state.sourcesRevoked ? 'bad' : 'good')}</label></div><div class="help-block">对已经发布的版本，来源关系保持不变；此处选择影响下一次创作输入，不回写历史版本。</div>${btn('应用到下一次创作', 'apply-sources', 'action full')}`;
    if (type === 'scenario')
        return `<p class="drawer-intro">切换本地模拟状态，检查按钮、提示和恢复行为。不会触发任何真实执行。</p><div class="scenario-grid">${Object.entries(scenarioInfo).map(([k, [name, desc]]) => `<button data-action="set-scenario" data-scenario="${k}" class="${state.scenario === k ? 'active' : ''}"><b>${name}</b><span>${desc}</span></button>`).join('')}</div><div class="help-block">演示重点：查看版本 ≠ 恢复基线；断线 ≠ 任务失败；预览刷新 ≠ 重新生成；批准已记录 ≠ 已送达。</div><div class="flex wrap">${btn('模拟缺少 v1 恢复快照', 'missing-snapshot', 'sm')}${btn('重置演示', 'reset', 'sm')}</div>`;
    return `<p class="drawer-intro">当前选中 v${state.viewVersion}，不是可变工作区。原型只导出 HTML 示例，不能冒充已生成 DOCX / XLSX / PPTX。</p><article class="source-item"><h3>${esc(state.title)}</h3><p>${current().label} · 内容版本 v${state.viewVersion}</p>${btn(icon('download') + '下载 HTML 预览示例', 'download', 'blue full')}</article><article class="source-item"><h3>正式作品格式</h3><p>接入授权版本文件 API 后启用对应格式。网页打包下载需要独立打包契约。</p>${btn('正式文件下载尚未接入', 'demo-click', 'full', 'disabled')}</article><div class="help-block">本地导出的页面会标注“原型示例”，不携带模型凭据、原文附件或后端预览票据。</div>`;
}
function confirmation(title, text, action, label, attrs = '') { returnFocus = document.activeElement; const d = $('#confirm'); $('#confirm-content').innerHTML = `<h2 id="confirm-title">${esc(title)}</h2><p>${text}</p><div class="modal-actions">${btn('取消', 'close-confirm')}${btn(label, action, 'action', attrs)}</div>`; if (!d.open)
    d.showModal(); }
function openProject(id) { const p = projects.find(p => p.id === id) || projects[0]; state.kind = p.kind; state.title = p.title; state.viewVersion = p.version; state.baseVersion = p.version; state.versions = Array.from({ length: p.version }, (_, i) => ({ id: p.version - i, label: i === 0 ? '完善内容与来源说明' : i === 1 ? '补充结构与业务指标' : '生成第一版作品', time: i === 0 ? '今天 10:42' : '今天 10:16', restorable: true, sourceIds: ['S1', 'S2'] })); state.scenario = 'ready'; state.workspaceRevision = 7; state.runCount = 1; state.tab = 'preview'; state.draft = ''; state.mobileTab = 'chat'; state.slide = 1; state.lastPrompt = p.kind === 'web' ? '结合销售数据和产品知识，生成季度经营分析看板。需要汇总指标、区域筛选，以及可追溯的业务结论。' : `根据我选择的团队资料，生成${p.title}。内容清晰，保留来源，并支持继续修改。`; go('workbench'); }
function create() { if (!state.homeDraft.trim()) {
    showToast('请先描述要创作的内容。');
    $('#home-prompt').focus();
    return;
} state.activeSourceIds = [...state.selectedSources]; state.lastPrompt = state.homeDraft.trim(); state.title = current().name; state.versions = []; state.viewVersion = null; state.baseVersion = null; state.workspaceRevision = 1; state.runCount = 1; state.scenario = 'running'; state.tab = 'preview'; state.mobileTab = 'chat'; state.draft = ''; go('workbench'); }
function send() { if (!canSend()) {
    showToast('当前不能提交新任务。草稿已保留。');
    return;
} if (!state.draft.trim()) {
    showToast('请先输入修改要求。');
    $('#composer')?.focus();
    return;
} state.activeSourceIds = [...state.selectedSources]; state.lastPrompt = state.draft.trim(); state.draft = ''; state.runCount++; state.scenario = 'running'; render(); }
function finish() { if (state.scenario !== 'running') {
    showToast('仅正在执行的演示任务可以完成。');
    return;
} const next = Math.max(0, ...state.versions.map(v => v.id)) + 1; state.versions.unshift({ id: next, label: '根据本轮目标修改并交付（模拟）', time: '本次演示', restorable: true, sourceIds: [...(state.activeSourceIds || state.selectedSources)] }); state.viewVersion = next; state.baseVersion = next; state.workspaceRevision++; state.scenario = 'ready'; render(); showToast(`已模拟发布 v${next}，历史版本保持不变。`); }
function download() { closeDrawer(); const text = { web: report, document: documentPreview, spreadsheet: spreadsheetPreview, slides: slidesPreview }[state.kind](); const styles = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n'); const data = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(state.title)} · v${state.viewVersion} · 原型示例</title><style>${styles}\nbody{padding:30px;max-width:1100px;margin:auto}</style><body class="wk-craft"><p style="margin-bottom:20px">原型导出示例 · 模拟数据 · 版本 v${state.viewVersion} · 非真实业务交付文件</p>${text}${state.kind === 'web' ? '<p style="margin-top:16px">此离线示例不包含交互脚本；图表以表格数据补充。</p><table class="data-table">' : ''}${state.kind === 'web' ? '<tr><th>月份</th><th>示例销售 / 万元</th></tr>' + seriesValues().map((v, i) => `<tr><td>${i + 1}月</td><td>${v.toFixed(2)}</td></tr>`).join('') + '</table>' : ''}</body></html>`; const b = new Blob([data], { type: 'text/html;charset=utf-8' }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = `craft-preview-v${state.viewVersion}-demo.html`; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); showToast(`已下载 v${state.viewVersion} 的 HTML 示例，不是正式 Office 文件。`); }
document.addEventListener('click', e => { const r = e.target.closest('[data-route]'); if (r) {
    e.preventDefault();
    go(r.dataset.route);
    return;
} const el = e.target.closest('[data-action]'); if (!el || el.disabled)
    return; e.preventDefault(); const a = el.dataset.action; switch (a) {
    case 'new':
        state.homeDraft = '';
        go('home');
        $('#home-prompt')?.focus();
        break;
    case 'library':
        go('library');
        break;
    case 'templates':
        go('templates');
        break;
    case 'kind':
        state.kind = el.dataset.kind;
        render();
        break;
    case 'template':
        state.kind = el.dataset.kind;
        state.homeDraft = `根据我选择的团队资料，生成${current().name}。保留关键数据与来源，支持继续修改。`;
        go('home');
        $('#home-prompt')?.focus();
        break;
    case 'create':
        create();
        break;
    case 'open-project':
        openProject(el.dataset.id);
        break;
    case 'sources':
        openDrawer('sources');
        break;
    case 'versions':
        openDrawer('versions');
        break;
    case 'upload':
        openDrawer('upload');
        break;
    case 'choose-sources':
        openDrawer('choose');
        break;
    case 'scenario':
        openDrawer('scenario');
        break;
    case 'export':
        if (state.viewVersion !== null)
            openDrawer('export');
        break;
    case 'close-drawer':
        closeDrawer();
        render();
        break;
    case 'close-confirm':
        $('#confirm').close();
        break;
    case 'filter':
        state.filter = el.dataset.filter;
        render();
        break;
    case 'clear-filter':
        state.filter = 'all';
        state.search = '';
        render();
        break;
    case 'tab':
        state.tab = el.dataset.tab;
        render();
        break;
    case 'checks':
        state.tab = 'checks';
        state.mobileTab = 'preview';
        render();
        break;
    case 'preview':
        state.tab = 'preview';
        state.mobileTab = 'preview';
        render();
        break;
    case 'viewport':
        state.viewport = el.dataset.viewport;
        render();
        break;
    case 'mobile-tab':
        state.mobileTab = el.dataset.tab;
        render();
        break;
    case 'suggestion':
        state.draft = el.dataset.text;
        render();
        $('#composer')?.focus();
        break;
    case 'send':
        send();
        break;
    case 'finish':
        finish();
        break;
    case 'approve':
        state.decision = 'recorded';
        render();
        break;
    case 'ack':
        if (state.decision === 'recorded') {
            state.decision = 'delivered';
            state.scenario = 'running';
            render();
            showToast('模拟已确认送达，继续同一任务。');
        }
        break;
    case 'reject':
        state.scenario = 'failed';
        state.decision = 'rejected';
        render();
        showToast('已拒绝本次请求，没有授予权限。');
        break;
    case 'answer':
        state.scenario = 'running';
        render();
        showToast('已模拟回答问题，不增加执行权限。');
        break;
    case 'stop':
        confirmation('停止当前任务？', '将请求后端取消，并核对执行状态。关闭浏览器或断开连接不等于取消任务。', 'confirm-stop', '确认停止');
        break;
    case 'confirm-stop':
        $('#confirm').close();
        state.scenario = 'canceled';
        render();
        showToast('模拟任务已取消；上一交付版本保留。');
        break;
    case 'reconnect':
        state.scenario = 'ready';
        render();
        showToast('已同步原任务，未创建新的 Run。');
        break;
    case 'refresh-preview':
        state.scenario = 'ready';
        render();
        showToast('仅续期预览授权，没有重新生成作品。');
        break;
    case 'view-version':
        state.viewVersion = Number(el.dataset.version);
        state.tab = 'preview';
        closeDrawer();
        render();
        showToast(`查看 v${state.viewVersion}，编辑基线仍是 v${state.baseVersion}。`);
        break;
    case 'restore':
        state.restoreTarget = Number(el.dataset.version);
        closeDrawer();
        confirmation(`从 v${state.restoreTarget} 继续编辑？`, '将检查写权限、活动任务和恢复快照，恢复工作区并提升 revision。不会覆盖历史版本，也不会仅因恢复就生成新版本。', 'confirm-restore', '恢复编辑基线');
        break;
    case 'confirm-restore': {
        const v = state.versions.find(v => v.id === state.restoreTarget);
        if (!v || !v.restorable || !canWrite() || isBusy() || state.scenario === 'reconnecting') {
            showToast('当前条件不允许恢复。');
            $('#confirm').close();
            break;
        }
        state.baseVersion = v.id;
        state.viewVersion = v.id;
        state.workspaceRevision++;
        $('#confirm').close();
        render();
        showToast(`已模拟恢复到 v${v.id}，历史版本数量未变化。`);
        break;
    }
    case 'apply-sources':
        state.selectedSources = $$('input[name="source-choice"]:checked:not(:disabled)').map(x => x.value);
        closeDrawer();
        render();
        showToast('已更新下一次创作的资料范围。');
        break;
    case 'revoke':
        state.sourcesRevoked = !state.sourcesRevoked;
        openDrawer('sources');
        break;
    case 'source-open':
        if (el.dataset.source === 'S2' && state.sourcesRevoked)
            showToast('403 演示：来源权限已撤销，不能继续读取。');
        else
            confirmation('来源说明 · ' + el.dataset.source, '这是授权资料定位的演示。正式开发按稳定 citation ID 调用已有资源入口并重新检查权限；本原型不含真实企业原文。', 'close-confirm', '知道了');
        break;
    case 'file':
        confirmation('版本文件元信息', `路径：<code>${esc(el.dataset.file)}</code><br>版本：v${state.viewVersion}<br>SHA-256：原型没有真实版本文件，不伪造校验值。<br>正式实现从 manifest 获取元信息。`, 'close-confirm', '知道了');
        break;
    case 'set-scenario':
        state.scenario = el.dataset.scenario;
        state.decision = 'pending';
        closeDrawer();
        if (state.route !== 'workbench')
            go('workbench');
        else
            render();
        break;
    case 'missing-snapshot': {
        const v = state.versions.find(v => v.id === 1);
        if (v)
            v.restorable = false;
        closeDrawer();
        openDrawer('versions');
        break;
    }
    case 'reset':
        closeDrawer();
        location.href = location.pathname + '#home';
        location.reload();
        break;
    case 'download':
        download();
        break;
    case 'slide':
        state.slide = Number(el.dataset.slide);
        render();
        break;
    case 'prev-slide':
        state.slide = Math.max(1, state.slide - 1);
        render();
        break;
    case 'next-slide':
        state.slide = Math.min(4, state.slide + 1);
        render();
        break;
    case 'menu':
        document.body.classList.toggle('nav-open');
        break;
    case 'close-nav':
        document.body.classList.remove('nav-open');
        break;
    case 'space':
        confirmation('产品团队工作空间', '此处复用现有 WeKnora 空间切换。原型仅有一个演示空间，不会创建新的租户或登录体系。', 'close-confirm', '知道了');
        break;
    case 'demo-click':
        showToast('组件状态演示；没有发送网络请求。');
        break;
} });
document.addEventListener('input', e => { if (e.target.id === 'home-prompt')
    state.homeDraft = e.target.value; if (e.target.id === 'composer')
    state.draft = e.target.value; if (e.target.id === 'project-search') {
    state.search = e.target.value;
    $('#project-grid').innerHTML = projectResults();
    requestAnimationFrame(drawCharts);
} });
document.addEventListener('change', e => { if (e.target.id === 'version-select') {
    state.viewVersion = Number(e.target.value);
    render();
} if (e.target.id === 'region') {
    state.region = e.target.value;
    render();
} if (e.target.id === 'local-files') {
    state.uploaded = Array.from(e.target.files || []).map(f => ({ name: f.name, bytes: f.size }));
    $('#upload-results').innerHTML = state.uploaded.map(f => `<article class="source-item"><h3>${esc(f.name)}</h3><p>${f.bytes} bytes · 本地已选择，未上传</p></article>`).join('');
} });
document.addEventListener('keydown', e => { if (e.target.id === 'composer' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
} if (e.key === 'Escape')
    document.body.classList.remove('nav-open'); });
$('#drawer').addEventListener('close', () => { state.drawer = null; if (returnFocus?.isConnected)
    returnFocus.focus(); });
$('#confirm').addEventListener('close', () => { if (returnFocus?.isConnected)
    returnFocus.focus(); });
window.addEventListener('popstate', () => { state.route = location.hash.slice(1) || 'home'; render(); });
window.addEventListener('resize', () => requestAnimationFrame(drawCharts));
window.CraftDemo = { snapshot: () => JSON.parse(JSON.stringify(state)) };
const initial = location.hash.slice(1);
if (['home', 'library', 'templates', 'workbench', 'design'].includes(initial))
    state.route = initial;
render();
</script>

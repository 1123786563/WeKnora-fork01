const row=(title,sub,go,ic='file')=>`<button class="listrow" data-go="${go}">${icon(ic)}<div class="grow"><h3>${title}</h3><div class="tiny">${sub}</div></div><span class="chev">${icon('chev')}</span></button>`;
let state={tenant:'示例团队',selection:'示例团队',role:'成员',taskFilter:'all',agentFilter:'all',status:'waiting_user',network:true,approval:'pending',orderPayment:'pending',orderFulfillment:'pending',purchaseEnabled:false,uploadMode:'file',uploadSelected:false,uploadStage:'idle',errorType:'offline',userMessages:[],assistantMessage:'',agentName:'周报整理助手',taskText:'整理本周销售周报，汇总重点进展和待跟进事项。',bindMode:false,invitation:'pending'};
let current='home',toastTimer=null,typingTimer=null,routeLog=[];
function go(id){if(!pages.some(p=>p.id===id))id='home';if(current!==id)routeLog.push(current);if(typingTimer){clearInterval(typingTimer);typingTimer=null;}location.hash=id;render(id)}
function back(){let id=routeLog.pop()||'home';location.hash=id;render(id)}
function toast(msg){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast" role="status">${msg}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',3000)}
function modal(title,text,confirmText='我知道了',action='close',input=false){$('#modal').innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal"><h3>${title}</h3><p>${text}</p>${input?'<label class="formlabel" for="modal-input">补充说明</label><textarea id="modal-input" class="textarea" placeholder="输入本次说明"></textarea>':''}<div class="actions"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="${action}">${confirmText}</button></div></div></div>`;setTimeout(()=>$('#modal .btn')?.focus(),0)}
const titles={home:'工作台',tasks:'任务中心',knowledge:'知识库',me:'我的',chat:'知识问答',execution:'执行详情',login:'WeKnora',workspace:'选择工作空间',agents:'Agent',agent:'发起任务',approval:'待你确认',artifact:'任务产物',kb:'产品与业务资料',upload:'添加知识',document:'来源文档',usage:'用量与套餐',checkout:'确认订单',order:'订单详情',invitations:'空间邀请',states:'异常状态'};
function shell(id,content){let isTab=['home','tasks','knowledge','me'].includes(id);let subtitle=['home','tasks','knowledge','me'].includes(id)?state.tenant:'离线线框 · 示例数据';return `<div class="statusbar"><span>9:41</span><span class="sensors">▮▮▮ ▰</span></div><div class="appnav">${!isTab&&id!=='login'?`<button class="iconbtn" data-act="back" aria-label="返回">${icon('arrow')}</button>`:''}<div class="title"><h2>${titles[id]}</h2><small>${subtitle}</small></div>${isTab?`<button class="iconbtn" data-go="workspace" aria-label="切换工作空间">${icon('users')}</button>`:''}<div class="capsule" aria-hidden="true">···│○</div></div><main class="appcontent" id="content">${content}</main>${id==='chat'?`<div class="composer"><button class="iconbtn" data-act="chat-attach" aria-label="添加临时附件">${icon('plus')}</button><input id="chat-input" class="input" aria-label="输入问题" placeholder="继续提问…"/><button class="btn primary" data-act="chat-send">发送</button></div>`:''}${id==='approval'?`<div class="footactions">${state.approval==='pending'?btn('拒绝','','danger','reject')+btn('仅同意本次','','primary','approve'):btn('返回任务','execution','primary full')}</div>`:''}${isTab?`<nav class="tabbar" aria-label="主导航">${[['home','工作台'],['tasks','任务'],['knowledge','知识'],['me','我的']].map(([k,v])=>`<button data-go="${k}" class="${k===id?'active':''}">${icon(k)}<span>${v}</span></button>`).join('')}</nav>`:''}<div class="homeindicator"></div><div id="modal"></div><div id="toast"></div>`}
const statusInfo=()=>({queued:['排队中','running'],running:['运行中','running'],waiting_user:['等待确认','wait'],reconciling:['正在对账','wait'],succeeded:['已完成','done'],failed:['失败','gray'],canceled:['已取消','gray']}[state.status]);
function home(){return `<div class="row between"><span class="pillnote">离线线框 · 示例数据</span><button class="textbtn" data-go="usage">用量与套餐 ${icon('chev')}</button></div><div class="space"></div><h1>把任务交给 AI，<br>把时间留给重要的事。</h1><p class="muted">查资料、整理文档，或继续一项工作。</p><div class="card"><label class="tiny" for="home-prompt">今天想完成什么？</label><textarea id="home-prompt" class="textarea" style="border:0;padding:10px 0;min-height:66px" placeholder="例如：整理本周工作，生成一份周报"></textarea><div class="row between"><span class="tiny">使用团队已配置的 Agent</span><button class="btn primary small" data-act="home-start">发起任务 ${icon('send')}</button></div></div><div class="section"><h2>常用 Agent</h2><button class="textbtn" data-go="agents">查看全部 →</button></div><div class="grid2"><button class="card choose" data-go="chat"><div class="avatar">${icon('knowledge')}</div><div class="space-sm"></div><h3>知识问答助手</h3><div class="tiny">从团队资料中找答案</div></button><button class="card choose" data-go="agent"><div class="avatar">${icon('tasks')}</div><div class="space-sm"></div><h3>周报整理助手</h3><div class="tiny">汇总进展，生成周报</div></button></div><div class="section"><h2>需要你关注</h2>${tag('1 项待处理','wait')}</div><button class="card pale taskcard" data-go="approval"><div class="row"><div class="avatar">${icon('shield')}</div><div class="grow"><h3>周报发送前，确认一下</h3><div class="tiny">AI 已整理完成，发送到工作群需你批准</div></div>${icon('chev')}</div></button><div class="section"><h2>最近会话</h2><button class="textbtn" data-go="chat">继续提问 →</button></div><div class="card flat">${row('产品上线前需要准备哪些资料？','知识问答 · 今天 09:12','chat','knowledge')}${row('销售周报整理','周报助手 · 等待确认','execution','tasks')}</div>`}
function login(){return `<div class="loginlogo"><div class="brandmark">W</div></div><div class="loginhead"><h1>你的随身 AI 工作台</h1><p>同一账号，同一空间。<br>在微信继续 Web 和移动端上的工作。</p></div><div class="card"><h3>${state.bindMode?'绑定已有平台账号':'登录 WeKnora'}</h3><p class="tiny">${state.bindMode?'需同时证明微信身份与原账号身份。此处仅模拟。':'这是离线交互演示，不会发起真实登录。'}</p>${btn(state.bindMode?'模拟验证微信身份':'微信快捷登录','','primary full','login-wx')}<div class="checkline"><input type="checkbox" id="consent"/><div><label for="consent">我已阅读并同意 </label><button class="textbtn" data-act="privacy">隐私政策</button> 与 <button class="textbtn" data-act="terms">服务协议</button></div></div><hr class="divider"/><p class="tiny">也可使用已有平台账号</p>${label('邮箱 / 账号','account')}<input class="input" id="account" placeholder="请输入平台账号" autocomplete="username"/>${label('密码','password')}<input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password"/><div class="space"></div>${btn('模拟账号登录','','full','login-account')}<div id="login-error" class="errorline" role="alert"></div></div><button class="textbtn" style="display:block;margin:auto" data-act="bind">${state.bindMode?'返回登录':'已有账号？先绑定，避免新建重复身份'}</button><p class="tiny" style="text-align:center;margin-top:16px">无需填写服务器地址或租户 API Key</p>`}
function workspace(){return `<h1>在哪个空间开始？</h1><p class="muted">不同空间的资料、任务和用量彼此隔离。</p>${[['我的个人空间','所有者','仅自己使用'],['示例团队','成员','与团队共享已授权的知识与 Agent']].map(([name,role,desc])=>`<button class="card choose full ${state.selection===name?'selected':''}" style="width:100%" data-act="select-space" data-space="${name}"><div class="row"><div class="avatar">${icon(name.startsWith('我的')?'me':'users')}</div><div class="grow"><h3>${name}</h3>${tag(role)}<p class="tiny">${desc}</p></div><span class="check">${state.selection===name?'✓':''}</span></div></button>`).join('')}<div class="notice">切换后重新加载该空间的数据。旧空间的请求和草稿不会混入当前空间。</div>${btn('进入所选空间','','primary full','enter-space')}<div class="section"><h2>还没有工作空间？</h2></div><div class="grid2">${btn('接受邀请','invitations','')}${btn('创建空间','','','create-space')}</div><p class="tiny">没有可用成员关系时应展示创建或加入流程，不强行进入空白工作台。</p>`}
const agentsData=[['知识问答助手','基于已授权的团队资料回答问题。','knowledge','chat','知识检索 · 引用溯源'],['周报整理助手','汇总资料、整理进展，生成工作周报。','tasks','agent','文档整理 · 结果文件'],['文档总结助手','提炼文档重点，输出结构化摘要。','file','chat','文档阅读 · 总结'],['外部设备助手','执行目标未连接，暂不可使用。','spark','unavailable','不可用 · 请管理员配置']];
function agents(){return `<div class="searchbox">${icon('search')}<input class="input" id="agent-search" aria-label="搜索Agent" placeholder="搜索名称或用途"/></div><div class="segments">${[['all','全部'],['mine','常用'],['team','团队']].map(([k,v])=>`<button data-act="agent-filter" data-value="${k}" class="${state.agentFilter===k?'active':''}">${v}</button>`).join('')}</div><div id="agents-list">${agentsData.map(([name,desc,ic,go,tags])=>`<button class="card taskcard agent-item" data-title="${name}" ${go==='unavailable'?'data-act="agent-unavailable"':`data-go="${go}"`}><div class="row"><div class="avatar">${icon(ic)}</div><div class="grow"><h3>${name}</h3><div class="tiny">${desc}</div><div class="tags">${tag(tags,go==='unavailable'?'gray':'')}</div></div>${icon('chev')}</div></button>`).join('')}</div><div class="notice">这里只使用已配置的 Agent。模型、工具连接与复杂编排在 Web 管理端维护。</div>`}
function agent(){return `<div class="card"><div class="row"><div class="avatar large">${icon('tasks')}</div><div><h2>周报整理助手</h2><div class="tiny">平台托管执行 · 团队已配置</div></div></div><div class="tags">${tag('资料整理')}${tag('生成产物')}${tag('敏感操作需确认','wait')}</div></div>${label('想让 Agent 完成什么？','task-input')}<textarea class="textarea" id="task-input" style="min-height:148px">${esc(state.taskText)}</textarea><div class="section"><h2>运行设置</h2></div><div class="card"><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>执行环境</span><b>平台托管（示例）</b></div><div class="kv"><span>资料范围</span><b>使用 Agent 已配置资源</b></div>${label('预算上限（演示单位）','budget')}<input id="budget" class="input" type="number" min="1" value="100" aria-label="预算上限"/><p class="tiny">实际单位由后端预算契约决定；此数值不是实际价格。</p></div><div class="notice warn">当前启动契约不包含任意附件字段。本页不伪造“附加文件已进入任务”的能力。</div>${btn('发起任务','','primary full','task-start')}<p class="tiny">网络未知时会先查找原请求，不重复创建任务。</p>`}
function chat(){return `<div class="row between" style="margin-bottom:15px"><span class="tag">知识范围 · 产品与业务资料</span><button class="textbtn" data-act="chat-history">会话历史</button></div><div id="messages"><div class="msg user"><div class="who">我</div><div class="bubble">产品上线前需要准备哪些资料？</div></div><div class="msg"><div class="who">${icon('spark')} 知识问答助手</div><div class="bubble">根据当前知识库中的上线流程，建议先准备以下资料：<br><br><strong>1. 产品说明</strong><br>确认主要功能、适用用户和已知限制。<br><br><strong>2. 验收清单</strong><br>包含核心链路、权限和异常场景。<br><br><strong>3. 运营材料</strong><br>准备帮助文档与问题反馈入口。<button class="citation" data-go="document">[1] 产品上线检查清单 · 引用片段<br>点击查看原文与所属知识库 →</button></div><div class="tiny" style="margin-top:7px">答案与文件均为演示数据，请核对原始资料。</div></div>${state.userMessages.map(t=>`<div class="msg user"><div class="who">我</div><div class="bubble">${esc(t)}</div></div>`).join('')}${state.assistantMessage?`<div class="msg"><div class="who">${icon('spark')} 模拟回复</div><div class="bubble" id="stream-text">${esc(state.assistantMessage)}</div></div>`:''}</div><div class="row"><button class="textbtn" data-act="chat-suggestion">整理成待办清单</button><button class="textbtn" data-act="chat-stop">停止演示输出</button></div>`}
function taskCard(title,status,meta,go='execution'){return `<button class="card taskcard" data-go="${go}"><div class="row between"><h3>${title}</h3>${tag(status[0],status[1])}</div><div class="tiny" style="margin-top:7px">${meta}</div><hr class="divider"/><div class="row between"><span class="tiny">${state.tenant} · 本人创建</span>${icon('chev')}</div></button>`}
function tasks(){let rows=[{type:state.status==='waiting_user'?'waiting':state.status==='succeeded'?'done':'running',html:taskCard('销售周报整理',statusInfo(),'周报整理助手 · 今天 09:20')},{type:'running',html:taskCard('整理客户反馈要点',['运行中','running'],'文档总结助手 · 今天 09:18')},{type:'done',html:taskCard('产品资料摘要',['已完成','done'],'文档总结助手 · 昨天 16:42','artifact')}];return `<div class="row between" style="margin-bottom:14px"><h1 style="font-size:21px;margin:0">我的任务</h1>${btn('新建','agents','small primary')}</div><div class="segments">${[['all','全部'],['running','运行中'],['waiting','待处理'],['done','已完成']].map(([k,v])=>`<button data-act="task-filter" data-value="${k}" class="${state.taskFilter===k?'active':''}">${v}</button>`).join('')}</div>${rows.filter(x=>state.taskFilter==='all'||state.taskFilter===x.type).map(x=>x.html).join('')||'<div class="empty">'+icon('tasks')+'<h3>暂无此类任务</h3><p>可以切换筛选，或发起一个新任务。</p></div>'}<div class="notice">任务在后台执行。切回小程序时从快照与事件恢复，不再次触发同一任务。</div><button class="democtl" data-go="states">查看断线 / 未开通 / 权限不足示例</button><p class="tiny">列表与跨任务待办需要新增服务端分页读模型，不能只依赖手机缓存。</p>`}
function execution(){let info=statusInfo();return `${!state.network?'<div class="notice warn">连接已断开 · 正在等待恢复；后台任务状态未知，不应重启任务。</div>':''}<div class="card pale"><div class="row between"><span class="tiny">销售周报整理</span>${tag(info[0],info[1])}</div><h2 style="margin:12px 0">${state.status==='succeeded'?'任务完成，结果已保存':state.status==='canceled'?'任务已取消':state.status==='waiting_user'?'资料已整理，等待你的确认':'正在整理任务内容'}</h2><div class="tiny">平台托管 · 任务 run_demo_001</div><div class="meter"><div style="width:${state.status==='succeeded'?100:72}%"></div></div><div class="tiny">以上进度仅用于交互演示，不是服务端估算</div></div><div class="card"><h3>我的要求</h3><p class="paragraph">${esc(state.taskText)}</p><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>账务状态</span><b>${state.status==='succeeded'?'结算处理中（示例）':'按后端状态显示'}</b></div></div><div class="section"><h2>执行摘要</h2><span class="tiny">不是内部推理</span></div><div class="timeline"><div class="step"><strong>任务已接收</strong><p>请求已持久记录，避免重复提交。</p></div><div class="step"><strong>读取授权资料</strong><p>从 Agent 已配置的资料范围获取内容。</p></div><div class="step"><strong>完成周报草稿</strong><p>整理重点进展与需要跟进的问题。</p></div><div class="step active"><strong>${state.status==='succeeded'?'产物已保存':state.status==='waiting_user'?'等待发送确认':'继续处理 / 同步结果'}</strong><p>外部发送需要当前用户明确授权。</p></div></div><div class="space"></div>${state.status==='waiting_user'?`<div class="card"><div class="row"><div class="grow"><h3>是否发送到团队工作群？</h3><div class="tiny">外部写操作 · 仅确认本次动作</div></div>${icon('shield')}</div><div class="space-sm"></div>${btn('查看并确认','approval','primary full')}</div>`:''}${['succeeded'].includes(state.status)?btn('查看任务产物','artifact','primary full'):''}<div class="grid2">${btn('追加指令','','','steer')}${btn('取消任务','','danger','cancel-task')}</div><button class="democtl" data-act="network">${state.network?'模拟断开连接':'模拟快照同步与恢复'}</button><button class="democtl" data-act="demo-finish">模拟收到任务完成事件</button>`}
function approval(){return `<div class="notice warn">这是一项外部写操作。请确认发送对象和内容范围；同意预算不代表同意发送。</div><div class="card"><div class="row between"><h2 style="margin:0">发送周报到工作群</h2>${tag(state.approval==='pending'?'待确认':'已处理',state.approval==='pending'?'wait':'gray')}</div><div class="space"></div><div class="kv"><span>来自任务</span><b>销售周报整理</b></div><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>发送目标</span><b>示例团队 · 工作群</b></div><div class="kv"><span>动作范围</span><b>只发送这一次</b></div></div><div class="card"><h3>将发送的内容</h3><p class="paragraph">本周完成产品资料整理与客户反馈归纳；待跟进事项包含上线清单补全和反馈责任人确认。</p><div class="notice" style="margin-bottom:0">示例参数经过脱敏。实际审批展示后端提供的动作与数据影响，不展示密钥。</div></div><div class="card"><h3>请特别留意</h3><p class="muted">发送后，群内成员将能够看到这份摘要。页面打开后若任务或审批版本变化，需要重新确认。</p><label class="formlabel" for="reject-reason">拒绝说明（选填）</label><textarea class="textarea" id="reject-reason" placeholder="例如：先删去未确认的数据" style="min-height:75px"></textarea></div>${state.approval==='pending'?'':`<div class="notice">此审批已在演示中处理。请返回任务刷新当前状态。</div>`}<button class="democtl" data-act="approval-stale">模拟其他设备已经处理</button>`}
function artifact(){return `<div class="card"><div class="row"><div class="avatar large">${icon('file')}</div><div><h2>销售周报.md</h2><div class="tiny">Markdown 文本 · 任务产物</div><div class="tags">${tag('安全文本预览')}${tag('示例')}</div></div></div><hr class="divider"/><div class="kv"><span>来源</span><b>销售周报整理</b></div><div class="kv"><span>空间</span><b>${state.tenant}</b></div></div><div class="card"><h2>本周工作摘要</h2><p class="paragraph">本周主要完成了三项工作：产品资料归档、客户反馈归纳、上线清单整理。</p><h3>重点进展</h3><p class="paragraph">资料结构更清晰，反馈按问题类型归组，待跟进事项已有初步清单。</p><h3>下一步</h3><p class="paragraph">核实关键数据并补齐责任人；发送前确认共享范围。</p><div class="quote">此内容完全虚构，仅用来演示任务产物页面。</div></div><div class="notice">文件下载走授权接口。HTML、脚本与可执行产物不在小程序运行。</div>${btn('下载文件（演示）','','primary full','download')}<div class="space-sm"></div>${btn('返回任务','execution','full')}`}

function upload(){return `<div class="notice">目标知识库：产品与业务资料<br>这是持久知识入库，不是聊天临时附件。</div><div class="segments">${[['file','上传文件'],['url','导入链接']].map(([k,v])=>`<button data-act="upload-mode" data-value="${k}" class="${state.uploadMode===k?'active':''}">${v}</button>`).join('')}</div><div class="card">${state.uploadMode==='file'?`<button class="illustration" style="width:100%" data-act="choose-file">${icon('upload')}<span>${state.uploadSelected?'产品说明.pdf（示例）':'点击模拟选择文件'}</span></button><p class="tiny">正式版使用微信支持的文件选择与上传能力；文件类型和大小由服务端规则返回。</p>`:`${label('网页链接','import-url')}<input class="input" id="import-url" type="url" placeholder="https://example.com/article"/><p class="tiny">后端负责安全抓取和解析；不可用于访问未授权内部地址。</p>`}</div>${state.uploadStage==='parsing'?`<div class="card pale"><div class="row between"><h3>上传已完成</h3>${tag('解析中','running')}</div><div class="meter"><div style="width:100%"></div></div><p class="tiny">可离开本页。完成解析后才进入可检索状态。</p></div>${btn('返回知识库','kb','primary full')}`:btn('确认添加','','primary full','upload-submit')}<p class="tiny">仅模拟上传状态，不读取或上传本机文件。</p>`}
function documentPage(){return `<div class="card"><h2>产品上线检查清单</h2><div class="tiny">所属：产品与业务资料 · 已就绪</div><div class="tags">${tag('来自回答引用 [1]')}${tag('授权文档')}</div></div><div class="card"><h3>引用片段</h3><div class="quote">上线前应完成产品说明、关键链路验收以及运营帮助材料。对权限、异常和反馈入口进行专项核查。</div><h3>文档内容预览</h3><p class="paragraph">本文用于说明上线资料的基本结构。产品负责人确认功能范围，技术负责人验证关键流程，运营负责人准备帮助与反馈信息。</p><div class="docline"></div><div class="docline"></div><div class="docline short"></div><p class="tiny">此处不伪造原始文档页码，正式版使用真实来源位置。</p></div><div class="grid2">${btn('继续提问','chat','primary')}${btn('下载原文','','','download')}</div><p class="tiny">示例文档非真实企业资料；实际访问仍需文档级鉴权。</p>`}
function me(){return `<div class="card"><div class="row"><div class="avatar large">U</div><div><h2>示例用户</h2><div class="tiny">已登录平台账号 · 微信绑定演示</div></div></div><hr class="divider"/><button class="listrow" data-go="workspace">${icon('users')}<div class="grow"><h3>${state.tenant}</h3><div class="tiny">${state.role} · 切换工作空间</div></div>${icon('chev')}</button></div><div class="card pale"><div class="row between"><h3>用量与权益</h3><button class="textbtn" data-go="usage">查看详情 →</button></div><div class="statgrid"><div><span class="tiny">可用</span><strong>8,640</strong></div><div><span class="tiny">预占</span><strong>160</strong></div><div><span class="tiny">退款冻结</span><strong>0</strong></div></div><p class="tiny" style="margin-bottom:0">演示积分 · 按服务端统计时点展示</p></div><div class="card flat">${row('套餐与用量','查询额度、用量明细和可购买产品','usage','wallet')}${row('我的订单','付款与履约分别追踪','order','tasks')}${row('空间邀请','1 项待处理邀请（示例）','invitations','users')}<button class="listrow" data-act="notify">${icon('bell')}<div class="grow"><h3>任务通知</h3><div class="tiny">需逐次/按规则授权，非默认无限推送</div></div>${icon('chev')}</button><button class="listrow" data-act="privacy">${icon('shield')}<div class="grow"><h3>隐私与数据</h3><div class="tiny">隐私说明、数据处理与反馈</div></div>${icon('chev')}</button></div>${btn('退出登录','','full','logout')}`}
function usage(){return `<div class="card pale"><div class="row between"><h3>当前权益</h3>${tag('演示团队套餐')}</div><span class="tiny">可用积分</span><div class="num">8,640 <span style="font-size:11px;font-weight:400">Credits</span></div><div class="statgrid"><div><span class="tiny">已预占</span><strong>160</strong></div><div><span class="tiny">退款冻结</span><strong>0</strong></div><div><span class="tiny">已使用</span><strong>1,200</strong></div></div><hr class="divider"/><div class="tiny">示例统计时点：09:30 · 当前空间 ${state.tenant}</div></div><div class="card"><h3>最近用量分布（示例）</h3><div class="row between tiny"><span>知识问答</span><span>65%</span></div><div class="meter"><div style="width:65%"></div></div><div class="row between tiny"><span>Agent 任务</span><span>35%</span></div><div class="meter"><div style="width:35%"></div></div></div><div class="section"><h2>可选套餐</h2><span class="tiny">价格不是实际报价</span></div><div class="card"><div class="row between"><div><h3>团队月度权益</h3><div class="tiny">一次购买 · 不默认自动续费</div></div><strong>¥99<span class="tiny"> / 示例</span></strong></div><p class="muted">示例新增 10,000 积分，实际额度、期限和价格由报价接口提供。</p>${btn('查看服务端报价（演示）','checkout','primary full')}</div><div class="notice warn">AI会员/次数包需核验商品分类和虚拟支付资质。未开通时不展示真实购买入口。</div>${btn('查看订单','order','full')}`}
function checkout(){return `<div class="card"><h2>确认购买内容</h2><div class="kv"><span>权益归属</span><b>${state.tenant}</b></div><div class="kv"><span>示例商品</span><b>团队月度权益</b></div><div class="kv"><span>新增权益</span><b>10,000 演示积分</b></div><div class="kv"><span>有效期</span><b>以服务端报价为准</b></div><hr class="divider"/><div class="row between"><span class="muted">示例应付金额</span><strong style="font-size:29px">¥99.00</strong></div><p class="tiny">quote_id: quote_demo_001 · 不是实际报价</p></div><div class="card"><h3>支付资格与通道</h3><p class="muted">${state.purchaseEnabled?'演示：假设当前商品已获准使用虚拟支付，并且用户具备购买权限。':'当前未验证商户资质、商品分类与购买权限，因此默认关闭购买。'}</p>${tag(state.purchaseEnabled?'仅演示通道可用':'待核验，不可购买',state.purchaseEnabled?'done':'wait')}<p class="tiny">虚拟权益使用对应虚拟支付通道；只有符合普通服务支付条件的商品才用 JSAPI。</p></div><div class="notice">前端支付返回成功后仍需查原订单。付款与权益发放可能不是同一时刻完成。</div><button class="btn primary full" data-act="pay" ${state.purchaseEnabled?'':'disabled'}>模拟调起支付</button><button class="democtl" data-act="purchase-toggle">${state.purchaseEnabled?'恢复“通道待核验”演示状态':'演示开关：预览已开通且有购买权限的状态'}</button><p class="tiny">本按钮不会打开微信收银台，不收款、不创建真实订单。</p>`}
function order(){let paid=state.orderPayment==='paid',done=state.orderFulfillment==='fulfilled';return `<div class="card pale"><div class="row">${icon(done?'check':'clock')}<h2 style="margin:0">${done?'权益已开通（模拟）':paid?'已付款，权益处理中':'等待后端确认付款'}</h2></div><p class="muted">${done?'示例订单已完成履约。正式系统需后端确认后更新权益。':paid?'请勿重复购买。到账与权益发放仍在处理。':'客户端支付动作不等于订单已成功；以原订单查询结果为准。'}</p></div><div class="card"><div class="kv"><span>订单号</span><b>order_demo_001</b></div><div class="kv"><span>商品</span><b>团队月度权益（示例）</b></div><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>金额</span><b>¥99.00（示例）</b></div><hr class="divider"/><div class="kv"><span>付款状态 payment</span><b>${state.orderPayment}</b></div><div class="kv"><span>履约状态 fulfillment</span><b>${state.orderFulfillment}</b></div></div>${btn('重新查询原订单','','primary full','order-refresh')}<div class="space-sm"></div>${btn('返回用量','usage','full')}<button class="democtl" data-act="order-paid">模拟收到后端“付款确认”</button><button class="democtl" data-act="order-fulfilled" ${!paid?'disabled':''}>模拟收到后端“履约完成”</button><p class="tiny">状态由演示开关控制，无真实交易。</p>`}
function invitations(){return `<h1>加入一个工作空间</h1><p class="muted">接受邀请前，请确认空间与授予你的权限。</p><div class="card"><div class="row"><div class="avatar">${icon('users')}</div><div><h2>示例团队</h2><div class="tiny">由示例管理员邀请</div></div></div><div class="kv"><span>加入角色</span><b>成员（实际角色以后端为准）</b></div><div class="kv"><span>当前状态</span><b>${state.invitation==='pending'?'待接受':'已处理'}</b></div><p class="muted">加入后可使用被授权的知识库和 Agent，不自动获得其他用户私有会话的访问权。</p>${state.invitation==='pending'?`<div class="grid2">${btn('拒绝','','','invite-decline')}${btn('接受邀请','','primary','invite-accept')}</div>`:btn('选择空间','workspace','full')}</div><div class="notice">邀请链接只用于向后端验证。过期、撤销或他人邀请均不能直接授权加入。</div>`}
function states(){const states={offline:['连接中断','本地显示仅供参考。重新进入后先同步快照，不能创建新的任务来“恢复”。','恢复任务','execution','wifi'],forbidden:['你没有此操作权限','请联系空间管理员确认授权。角色提示仅用于说明，权限由后端判断。','返回工作台','home','shield'],unavailable:['当前部署未开通此能力','工作台执行 handler 或目标未就绪。此状态不同于“没有任务”。','使用知识问答','chat','tasks'],expired:['登录已失效','刷新凭证不可用。先清理本地身份与作用域，再回到登录。','重新登录','login','me'],empty:['还没有任务','从已配置的 Agent 开始一项任务。这里只展示你有权查看的执行。','选择 Agent','agents','tasks']};let [title,desc,text,target,ic]=states[state.errorType];return `<div class="segments">${[['offline','断网'],['forbidden','无权限'],['unavailable','未开通'],['expired','登录失效'],['empty','空数据']].map(([k,v])=>`<button data-act="error-type" data-value="${k}" class="${state.errorType===k?'active':''}">${v}</button>`).join('')}</div><div class="card empty">${icon(ic)}<h2>${title}</h2><p>${desc}</p><div class="space-sm"></div>${btn(text,target,'primary full')}</div><div class="notice">正式版要保留可诊断错误编号，但不暴露后端堆栈、账户信息或密钥。</div><div class="card"><h3>不能合并为一个“失败”</h3><p class="muted">网络中断、权限拒绝、功能未装配、数据为空，分别对应不同的恢复动作。用户不会被引导去重复启动付费任务。</p></div>`}
const views={login,workspace,home,agents,agent,chat,tasks,execution,approval,artifact,knowledge,kb,upload,document:documentPage,me,usage,checkout,order,invitations,states};
function render(id){if(!views[id])id='home';current=id;$('#phone').innerHTML=shell(id,views[id]());const p=pages.find(p=>p.id===id);document.title=`${p.n} ${p.name} · WeKnora 小程序线框`;$('#stage-label').innerText=`SCREEN ${p.n} / ${p.name}`;$('#notes').innerHTML=`<div class="eyebrow">SCREEN ${p.n} · ${p.group}</div><h2>${p.name}</h2><span class="chip">${p.badge}</span><p class="goal" style="margin-top:15px">${p.goal}</p>${[['页面结构',p.layout],['字段与内容',p.fields],['交互',p.events],['边界与异常',p.edge],['权限',p.permission]].map(([k,v])=>`<section><h3>${k}</h3><p>${v}</p></section>`).join('')}<div class="source"><h3>后端 / 共享层映射</h3><p>${p.api}</p><p style="margin-top:15px">E 已核查 · A 需适配 · N 建议新增<br>基线 9cc91c31ef78 · 所有业务数据为示例</p></div>`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));}
function act(name,el){switch(name){
case 'back':back();break;case 'close':$('#modal').innerHTML='';break;
case 'privacy':modal('隐私与数据使用','正式上线需提供经过审核的隐私政策，说明账号、文档和模型处理的数据范围。本线框不采集账号、不发送文件、不连接第三方服务。');break;
case 'terms':modal('服务协议','此处是服务协议入口的布局示例，不是最终法律条款。实际协议需说明AI输出限制、使用规则、数据和购买权益。');break;
case 'bind':state.bindMode=!state.bindMode;render('login');break;
case 'login-wx':case 'login-account':if(!$('#consent').checked){$('#login-error').innerText='请先阅读并同意隐私政策和服务协议。';break}if(name==='login-account'&&(!$('#account').value.trim()||!$('#password').value)){$('#login-error').innerText='请填写账号和密码，演示不会校验或发送。';break}go('workspace');break;
case 'select-space':state.selection=el.dataset.space;render('workspace');break;
case 'enter-space':state.tenant=state.selection;state.role=state.tenant.startsWith('我的')?'所有者':'成员';state.userMessages=[];state.assistantMessage='';state.status='waiting_user';state.approval='pending';state.network=true;state.orderPayment='pending';state.orderFulfillment='pending';state.purchaseEnabled=false;state.uploadStage='idle';go('home');toast('演示已切换空间并重置旧空间本地状态');break;
case 'create-space':modal('创建工作空间','正式版复用现有 POST /tenants，并由后端建立所有者关系。此原型不创建真实空间。','查看个人空间','demo-create');break;
case 'demo-create':state.selection='我的个人空间';go('workspace');break;
case 'home-start':{let text=$('#home-prompt').value.trim();if(text)state.taskText=text;go('agent');break}
case 'task-start':{let text=$('#task-input').value.trim();let budget=Number($('#budget').value);if(!text||!Number.isSafeInteger(budget)||budget<=0){toast('请填写任务内容和有效预算上限');break}state.taskText=text;state.status='running';state.approval='pending';go('execution');toast('模拟已记录请求并收到同一任务的启动确认');break}
case 'agent-unavailable':modal('执行目标未连接','当前 Agent 不可运行。能力不可用与无权限分开处理，不能用前端隐藏替代服务端校验。');break;
case 'agent-filter':state.agentFilter=el.dataset.value;render('agents');if(state.agentFilter==='mine')document.querySelectorAll('.agent-item').forEach((x,i)=>x.classList.toggle('hide',i>1));break;
case 'task-filter':state.taskFilter=el.dataset.value;render('tasks');break;
case 'knowledge-filter':document.querySelectorAll('.segments button').forEach(b=>b.classList.toggle('active',b===el));document.querySelectorAll('.kb-item').forEach((x,i)=>x.classList.toggle('hide',el.dataset.value!=='all'&&(el.dataset.value==='mine'?i!==2:el.dataset.value==='shared'?i!==1:i!==0)));break;
case 'chat-suggestion':$('#chat-input').value='请把这些资料整理成待办清单';$('#chat-input').focus();break;
case 'chat-history':modal('最近会话','示例：产品上线资料问答、客户反馈要点。正式版从已有 sessions/messages 加载，不能直接把设备缓存当完整历史。');break;
case 'chat-attach':modal('添加临时附件','正式版选择文件后，上传到当前 session 的 attachments。附件不会自动进入知识库；上传成功后还要核查处理状态。','我知道了');break;
case 'chat-send':{let text=$('#chat-input').value.trim();if(!text){toast('请输入要问的问题');break}state.userMessages.push(text);state.assistantMessage='正在生成演示回答…';render('chat');let out='这是模拟的增量回复。可先整理待办事项，再核对负责人和资料来源。正式版将读取共享聊天协议并显示可追溯引用。';let at=0;state.assistantMessage='';typingTimer=setInterval(()=>{at+=2;state.assistantMessage=out.slice(0,at);if($('#stream-text'))$('#stream-text').textContent=state.assistantMessage;$('#content').scrollTop=$('#content').scrollHeight;if(at>=out.length){clearInterval(typingTimer);typingTimer=null}},45);break}
case 'chat-stop':clearInterval(typingTimer);typingTimer=null;toast('已停止本地演示输出；正式版取消任务需独立后端命令');break;
case 'network':state.network=!state.network;render('execution');toast(state.network?'模拟快照与游标同步完成；未创建新任务':'模拟连接断开；后台任务不因此自动取消');break;
case 'demo-finish':state.status='succeeded';render('execution');toast('模拟已收到完成事件，账务仍可处于结算中');break;
case 'steer':modal('追加指令','正式版携带当前 expected_revision 提交 steer。已结束或版本冲突时应重新读取，不盲目执行。','模拟提交','steer-submit',true);break;
case 'steer-submit':if(!$('#modal-input').value.trim()){toast('请填写追加指令');break}$('#modal').innerHTML='';toast('模拟指令已提交；实际是否接受由服务端确认');break;
case 'cancel-task':if(['succeeded','canceled','failed'].includes(state.status)){toast('任务已结束，请先刷新服务端状态');break}modal('确认取消任务？','这里只取消当前任务，不删除会话与已有产物。正式请求需校验权限和 expected_revision。','取消任务','cancel-confirm');break;
case 'cancel-confirm':state.status='canceled';render('execution');toast('模拟已收到服务端取消确认');break;
case 'approve':modal('只同意当前这一次发送？','确认将示例周报摘要发送到示例团队工作群。不会记住全局或永久授权。','同意本次','approve-confirm');break;
case 'approve-confirm':state.approval='approved';state.status='running';go('execution');toast('模拟已提交本次决策，执行继续');break;
case 'reject':state.approval='rejected';state.status='waiting_user';render('approval');toast('模拟已拒绝本次动作，实际后续状态由后端决定');break;
case 'approval-stale':state.approval='stale';render('approval');toast('模拟版本冲突：此审批已在其他设备处理');break;
case 'download':modal('授权文件下载','正式版经现有授权资源接口下载到微信临时文件，再使用支持的预览能力。本原型不下载真实文档。');break;
case 'upload-mode':state.uploadMode=el.dataset.value;state.uploadStage='idle';render('upload');break;
case 'choose-file':state.uploadSelected=true;render('upload');break;
case 'upload-submit':if(state.uploadMode==='file'&&!state.uploadSelected){toast('请先模拟选择文件');break}if(state.uploadMode==='url'){let v=$('#import-url').value.trim();try{let u=new URL(v);if(!['https:','http:'].includes(u.protocol))throw Error()}catch(e){toast('请输入有效的 http 或 https URL');break}}state.uploadStage='parsing';render('upload');toast('模拟上传完成，后台解析中');break;
case 'notify':modal('任务通知授权','通知是后置能力，需要有效模板和用户明确授权；用户拒绝后仍可正常创建与查看任务。不默认申请无限通知。','模拟同意','notify-confirm');break;
case 'notify-confirm':$('#modal').innerHTML='';toast('已模拟记录本次通知意愿，未调用微信订阅接口');break;
case 'logout':modal('退出当前账号？','正式版撤销可撤销登录态并清理本地凭证、请求、草稿和缓存。','退出','logout-confirm');break;
case 'logout-confirm':state.userMessages=[];state.assistantMessage='';go('login');break;
case 'purchase-toggle':state.purchaseEnabled=!state.purchaseEnabled;render('checkout');break;
case 'pay':if(!state.purchaseEnabled){toast('当前通道未核验，不可购买');break}state.orderPayment='pending';state.orderFulfillment='pending';go('order');toast('模拟支付界面已返回；等待后端确认原订单');break;
case 'order-refresh':toast(`模拟查询原订单：付款 ${state.orderPayment} / 履约 ${state.orderFulfillment}`);break;
case 'order-paid':state.orderPayment='paid';state.orderFulfillment='processing';render('order');break;
case 'order-fulfilled':if(state.orderPayment!=='paid'){toast('付款未确认，不可提前发放权益');break}state.orderFulfillment='fulfilled';render('order');break;
case 'invite-accept':state.invitation='accepted';state.selection='示例团队';go('workspace');toast('模拟接受邀请；正式版需后端验证');break;
case 'invite-decline':state.invitation='declined';render('invitations');break;
case 'error-type':state.errorType=el.dataset.value;render('states');break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el||el.disabled)return;if(el.dataset.go)go(el.dataset.go);else act(el.dataset.act,el)});
document.addEventListener('input',e=>{if(e.target.id==='agent-search'||e.target.id==='kb-search'){let sel=e.target.id==='agent-search'?'.agent-item':'.kb-item';let q=e.target.value.trim();document.querySelectorAll(sel).forEach(x=>x.classList.toggle('hide',!x.dataset.title.includes(q)))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chat-input'){e.preventDefault();act('chat-send',e.target)}if(e.key==='Escape'&&$('#modal'))$('#modal').innerHTML=''});
let lastGroup='';$('#nav').innerHTML=pages.map(p=>{let heading=p.group!==lastGroup?`<div class="label">${p.group}</div>`:'';lastGroup=p.group;return heading+`<button data-go="${p.id}"><b>${p.n}</b><span>${p.name}</span></button>`}).join('');
window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'home'));
const query=new URLSearchParams(location.search);if(query.has('solo'))document.body.classList.add('solo');render(location.hash.slice(1)||query.get('screen')||document.body.dataset.initial||'home');
</script></body></html>

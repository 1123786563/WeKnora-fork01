<div class="app"><aside class="sidebar"><a class="brand" href="#home"><div class="brand-mark">w</div><span>WeKnora<small>CRAFT WORKSPACE</small></span></a><div class="space"><div class="avatar">企</div><div><b>企业示例空间</b><span class="muted small">当前作用域 · 演示</span></div><span style="margin-left:auto">⌄</span></div><button class="primary" data-action="new"><span>＋</span><span class="nav-text">新建作品</span></button><nav class="nav" aria-label="主导航"><a href="#home" data-nav="home"><span>⌂</span><span class="nav-text">创作首页</span></a><a href="#library" data-nav="library"><span>▧</span><span class="nav-text">我的作品</span></a><a href="#templates" data-nav="templates"><span>▦</span><span class="nav-text">创作模板</span></a></nav><span class="section-title">资料与能力</span><nav class="nav"><a href="#sources" data-action="sources"><span>▤</span><span class="nav-text">知识来源</span></a><a href="#capabilities" data-nav="capabilities"><span>◇</span><span class="nav-text">创作能力</span></a><a href="#guide" data-nav="guide"><span>ⓘ</span><span class="nav-text">设计说明</span></a></nav><div class="side-footer">复用 WeKnora 身份与空间。<br>Craft 不新建用户、租户或余额系统。<div class="line"></div>React · assistant-ui<br>tRPC-Agent-Go · OpenCode</div></aside><main class="main" id="main"></main></div>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><header><div><div class="eyebrow" id="drawer-eyebrow">WORKSPACE</div><h2 id="drawer-title">详情</h2></div><button class="icon" data-action="close-panel" data-testid="close-panel" aria-label="关闭面板">×</button></header><div class="drawer-content" id="drawer-content"></div></dialog>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={route:'home',kind:'web',scenario:'ready',tab:'preview',mobile:'conversation',viewport:'desktop',version:3,baseVersion:3,workspaceRevision:7,runCount:3,title:'季度经营分析看板',lastPrompt:'',decision:false,questions:false,sourcesRevoked:false,versions:[{id:3,title:'新增区域筛选，完成校验',date:'最近一次交付'},{id:2,title:'调整季度图表与摘要',date:'上一轮修改'},{id:1,title:'根据企业资料生成首版',date:'首次生成'}]};
window.demoState=state;
const kinds={web:'网页 / 内部工具',document:'文档',spreadsheet:'表格',slides:'演示稿'};
const runLabel=()=>({ready:'已交付',running:'执行中',approval:'等待授权',question:'等待回答',reconnecting:'正在同步',failed:'本轮失败',canceled:'已取消',expired:'预览过期',readonly:'只读访问'}[state.scenario]||'已交付');
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),4500)}
function go(route){state.route=route;location.hash=route;render()}
function openDemo(kind='web',fresh=false){if(!fresh){const n=kind==='document'?2:kind==='spreadsheet'?1:3;state.versions=Array.from({length:n},(_,i)=>({id:n-i,title:i?'历史修改与交付':'最近一次修改与交付',date:'内置示例版本'}));state.version=n;state.baseVersion=n;state.workspaceRevision=7;state.runCount=n;state.scenario='ready';state.lastPrompt=''}state.kind=kind;state.title={web:'季度经营分析看板',document:'客户产品介绍文档',spreadsheet:'季度销售汇总表',slides:'经营复盘演示稿'}[kind];state.tab='preview';go('workbench')}
function header(work=false){return `<header class="topbar"><div class="breadcrumbs"><a href="#home">Craft</a><span class="muted">/</span><b>${work?esc(state.title):({home:'创作首页',library:'我的作品',templates:'创作模板',capabilities:'创作能力',guide:'设计说明'}[state.route]||'创作首页')}</b>${work?`<span class="badge ${state.scenario==='failed'?'bad':state.scenario==='ready'?'good':'warn'} hide-mid">${runLabel()}</span>`:''}</div><div class="toolbar-meta">${work?`<button class="ghost hide-mobile" data-action="sources" data-testid="sources">▤ 来源 <span class="badge">2</span></button><button data-action="versions" data-testid="versions">◷ 版本记录</button><button class="primary" data-action="download" ${state.version===null?'disabled':''}>↓ 导出<span class="hide-mid">作品</span></button>`:`<span class="small muted hide-mobile">企业示例空间</span><button class="ghost" data-action="help">帮助</button><div class="avatar">吴</div>`}</div></header>`}
function mini(kind){return `<div class="card-preview"><div class="mini-page"><div class="mini-top"></div><div class="mini-lines" style="width:72%"></div>${kind==='spreadsheet'?`<div class="mini-grid">${'<i></i>'.repeat(12)}</div>`:kind==='document'?'<div class="mini-lines"></div><div class="mini-lines"></div><div class="mini-lines" style="width:87%"></div><div class="mini-lines"></div><div class="mini-lines" style="width:62%"></div>':`<div class="bars">${[40,65,48,85,69,98].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`}</div></div>`}
function cards(){return `<div class="cards">${[['web','季度经营分析看板','v3 · 网页','已交付'],['document','客户产品介绍文档','v2 · 文档','已交付'],['spreadsheet','季度销售汇总表','v1 · 表格','待核对']].map(([kind,title,meta,status])=>`<button class="artifact-card" data-action="open-demo" data-kind="${kind}" data-testid="open-demo">${mini(kind)}<div class="card-info"><span class="eyebrow">${kind.toUpperCase()}</span><h3>${title}</h3><div class="card-meta"><span>${meta} · 演示资料</span><span class="badge ${status==='已交付'?'good':'warn'}">${status}</span></div></div></button>`).join('')}</div>`}
function renderHome(){return header()+`<section class="home"><div class="home-hero"><div class="eyebrow">KNOWLEDGE → CREATION → DELIVERY</div><h1 data-testid="home-heading">把企业资料，变成可交付的作品。</h1><p>描述目标，选择资料。让 AI 完成生成、验证，陪你继续修改。</p></div><div class="creator"><label class="sr-only" for="home-prompt">描述你的创作目标</label><textarea id="home-prompt" placeholder="例如：结合产品知识库和销售 CSV，生成可按区域筛选的季度经营分析看板。"></textarea><div class="kind-tabs">${Object.entries(kinds).map(([k,v])=>`<button data-action="kind" data-kind="${k}" class="${state.kind===k?'selected':''}">${k==='web'?'▧':k==='document'?'▤':k==='spreadsheet'?'▦':'▱'} ${v}</button>`).join('')}</div><div class="creator-bottom"><div class="btns"><button data-action="upload">＋ 上传资料</button><button data-action="sources">▤ 选择知识</button><span class="badge good">仅使用已授权资料</span></div><button class="primary" data-action="create">开始创作 →</button></div></div><div class="section-head"><h2>继续你的创作</h2><button class="ghost" data-action="library">全部作品 →</button></div>${cards()}<div class="tips"><div><b>01 / 资料可追溯</b><p>作品保留来源标识；点击原文时重新检查访问权限。</p></div><div><b>02 / 修改不丢历史</b><p>每次交付绑定明确版本，旧文件不会被覆盖。</p></div><div><b>03 / 任务可再次打开</b><p>关闭页面不停止任务；再次打开读取后端状态。</p></div></div></section>`}
function banner(){if(state.scenario==='reconnecting')return `<div class="banner" data-testid="sync-banner"><div><b>连接已中断，正在同步原任务</b><br>不会重新发送你的要求，也不会创建新 Run。</div><button data-action="reconnect">重新连接</button></div>`;if(state.scenario==='failed')return `<div class="banner error"><div><b>本轮检查未通过</b><br>仍显示上一版已交付作品；不会把失败文件覆盖到历史版本。</div><button data-action="retry">查看并修复</button></div>`;if(state.scenario==='readonly')return `<div class="banner"><div><b>你正在只读查看作品</b><br>可以预览授权文件，不能提交新任务或恢复工作区。</div></div>`;return ''}
function approval(){if(state.scenario==='approval')return `<div class="approval-card" data-testid="approval-card"><span class="badge warn">需要你的授权</span><h3 style="margin-top:9px">允许执行这一次构建命令？</h3><p>范围：当前作品沙箱 /workspace<br>用途：验证本轮网页构建。不会授予长期权限。</p><code>pnpm run build<br>request: perm_demo_07 · revision: 2</code>${state.decision?'<p><b>决定已记录 · 送达尚未确认</b><br>正在核对 OpenCode 状态，请勿重复批准。</p><button data-action="ack">演示：确认送达</button>':`<div class="btns"><button class="primary" data-action="approve" data-testid="approve-once">仅本次允许</button><button data-action="reject">拒绝本次操作</button></div>`}</div>`;if(state.scenario==='question')return `<div class="approval-card"><span class="badge warn">需要补充信息 · 不是权限申请</span><h3 style="margin-top:10px">区域统计按哪种口径？</h3><label style="display:block;margin-top:9px"><input type="radio" name="q" value="发货区域" checked> 发货区域</label><label style="display:block"><input type="radio" name="q" value="客户所在区域"> 客户所在区域</label><div class="btns"><button class="primary" data-action="answer">提交答案</button><button data-action="reject">不继续此任务</button></div></div>`;return ''}
function chat(){const running=['running','approval','question','reconnecting'].includes(state.scenario);const failed=state.scenario==='failed',stopped=state.scenario==='canceled',unfinished=running||failed||stopped;return `<section class="chat-pane" aria-label="创作对话"><div class="chat-head"><h3>与 Craft 协作</h3><span class="badge">主 Agent</span></div><div class="chat-scroll"><div class="turn-label">本轮创作 · 企业资料已选定</div><div class="user-message">结合销售数据和产品知识，生成季度经营分析看板。需要汇总指标、区域筛选和有来源的结论。<div class="source-chips"><button data-action="sources">▤ 销售数据.csv</button><button data-action="sources">▤ 产品知识库</button></div></div><div class="agent-name"><span class="agent-icon">✦</span>Craft</div><p class="assistant-message">我会先核对数据与产品口径，再生成可预览的作品。资料中的事实和分析结论会分别标注，方便你复核。</p><div class="run-card"><header><b>生成并验证作品</b><span class="badge ${failed?'bad':unfinished?'warn':'good'}">${failed?'本轮失败':stopped?'已取消':running?'处理中':'已完成'}</span></header><div class="steps"><div class="step"><span class="tick">✓</span>检索 2 项授权资料<span>来源已记录</span></div><div class="step"><span class="tick">✓</span>委派构建任务<span>OpenCode</span></div><div class="step"><span class="tick">${unfinished?'·':'✓'}</span>生成文件并检查<span>${failed?'检查失败':stopped?'已停止':running?'执行中':'3 项通过'}</span></div><div class="step"><span class="tick">${unfinished?'·':'✓'}</span>发布不可变版本<span>${unfinished?'本轮未发布':'v'+state.version}</span></div></div></div>${approval()}${state.lastPrompt?`<div class="user-message">${esc(state.lastPrompt)}</div>`:''}${!running&&state.version!==null?`<p class="assistant-message">${failed||stopped?'本轮未发布新版本，下方保留之前的交付。':'作品已可预览。'}当前数字为线框演示数据，不是企业真实经营结论。你可以继续要求调整图表、维度或说明。</p><div class="output-card"><div class="output-icon">▧</div><div><b>${esc(state.title)}</b><small>v${state.version} · 来源 2 项 · 文件 4 个</small></div><button class="ghost" data-action="view-output" aria-label="查看作品" style="margin-left:auto">↗</button></div>`:''}${state.scenario==='running'?`<button data-action="finish" data-testid="finish-demo">演示：完成本轮生成</button>`:''}<div class="small muted" style="font-size:10px;margin-top:17px">执行详情用于展示工具与检查事实，不展示模型内部推理。</div></div><div class="composer"><div class="composer-box"><label class="sr-only" for="composer">继续修改作品</label><textarea id="composer" data-testid="composer" placeholder="继续修改，例如：增加季度对比，保留原有指标…" ${state.scenario==='readonly'?'disabled':''}></textarea><div class="composer-foot"><div class="btns"><button class="ghost icon" data-action="upload" aria-label="添加附件">＋</button><button class="ghost small" data-action="sources">资料</button></div>${running?`<button data-action="stop" style="font-size:11px">■ 停止任务</button>`:`<button class="primary" data-action="send" data-testid="send" style="font-size:11px" ${state.scenario==='readonly'?'disabled':''}>发送 ↑</button>`}</div></div><div class="composer-note">${state.baseVersion===null?'首次创作 · 尚无编辑基线':'基线 v'+state.baseVersion} · 同一工作区串行修改 · 关闭页面不等于取消任务</div></div></section>`}
function webPreview(){return `<div class="preview-document ${state.viewport==='phone'?'phone':''}" data-testid="preview-canvas"><div class="report-top"><span class="report-brand"><i class="report-logo"></i>经营观察</span><span class="muted">区域：全部 ⌄</span></div><article class="report"><div class="eyebrow" style="font-size:9px">QUARTERLY BUSINESS REVIEW</div><h2>让业务增长，有据可循。</h2><p class="report-sub">季度经营分析 · 交互与排版示例，非真实经营数据</p><div class="report-kpis"><div class="kpi"><label>销售收入</label><strong>¥ 128.6万</strong><small>较上期 +12.4%</small></div><div class="kpi"><label>订单数量</label><strong>2,048</strong><small>较上期 +8.2%</small></div><div class="kpi"><label>客户复购率</label><strong>36.8%</strong><small>较上期 +3.1pp</small></div></div><div class="chart-box"><div class="chart-title"><b>各月销售表现</b><span class="badge">演示数据</span></div><div class="fake-chart" aria-label="演示销售柱状图">${[47,61,56,76,70,93].map((h,i)=>`<div class="bar" style="height:${h}%"><small>${i+1}月</small></div>`).join('')}</div></div><p class="report-note"><b>观察结论</b><br>本区域用于展示有来源的分析说明。正式产品应区分资料事实、计算结果与 Agent 推断。</p><div class="report-source">依据：销售数据.csv [S1] · 产品知识库 [S2]<br>内容绑定 v${state.version}，切换历史版本不会修改当前工作区。</div></article></div>`}
function kindPreview(){if(state.kind==='web')return webPreview();const inside=state.kind==='document'?`<div class="eyebrow">CUSTOMER BRIEF</div><h2>客户产品介绍</h2><p class="report-sub">Markdown 预览 · DOCX 为同一版本导出文件</p><div class="line"></div><h3>一、产品概述</h3><p class="assistant-message">基于企业产品资料，构建统一的知识与创作工作台。本段仅为布局演示。[S1]</p><h3>二、适用场景</h3><p class="assistant-message">知识报告、业务分析、客户介绍和内部工具。内容与数字需通过事实检查后再交付。</p><h3>三、来源与说明</h3><p class="assistant-message">资料引用使用稳定来源标识，点击时重新授权。</p>`:state.kind==='spreadsheet'?`<h2>季度销售汇总</h2><p class="report-sub">只读数据预览 · 不承诺在线 Excel 编辑器</p><table class="sheet-preview"><tr><th>区域</th><th>一季度</th><th>二季度</th><th>合计</th></tr><tr><td>华东</td><td>100</td><td>200</td><td>300</td></tr><tr><td>华南</td><td>50</td><td>100</td><td>150</td></tr><tr><th>汇总</th><th>150</th><th>300</th><th>450</th></tr></table><p class="report-source">演示值；正式交付要求 XLSX 实际重算值与预览一致。</p>`:`<div class="slide"><div class="eyebrow">BUSINESS REVIEW</div><h2>经营复盘<br>把信息变成行动</h2><p class="report-sub" style="margin-top:17px">季度总结 · 企业知识驱动的演示稿</p></div><p class="report-source">逐页预览图 + 可修改源文件 + PPTX。正式生成须校验页数、字体与溢出。</p>`;return `<div class="preview-document" data-testid="preview-canvas"><div class="report">${inside}</div></div>`}
function preview(){if(state.version===null)return `<div class="files-panel" data-testid="empty-artifact" style="padding:70px 28px;text-align:center"><div class="eyebrow">FIRST CREATION</div><h2 style="margin-top:12px">首个作品版本尚未交付</h2><p class="muted small" style="margin-top:14px">生成、检查与发布完成后，预览将在这里出现。<br>没有交付物时不会展示虚构的历史文件。</p></div>`;if(state.scenario==='expired')return `<div class="files-panel" style="padding:65px 25px;text-align:center"><h2>此版本的预览授权已过期</h2><p class="muted small" style="margin:15px 0 24px">只需重新获取预览权限，不必重新生成作品。</p><button class="primary" data-action="refresh-preview">刷新预览授权</button></div>`;return `<div class="preview-controls"><span>已发布版本 · <span class="mono">${state.kind==='web'?'index.html':state.kind==='document'?'report.md':state.kind==='spreadsheet'?'preview.json':'slides / page-01'}</span></span><div class="segmented"><button data-action="viewport" data-mode="desktop" class="${state.viewport==='desktop'?'active':''}" aria-label="桌面预览">桌面</button><button data-action="viewport" data-mode="phone" class="${state.viewport==='phone'?'active':''}" aria-label="窄屏预览">窄屏</button></div></div>${kindPreview()}`}
function files(){if(state.version===null)return preview();let names=state.kind==='web'?['index.html','assets/chart.js','assets/style.css','manifest.json']:state.kind==='document'?['report.md','report.docx','sources.json','manifest.json']:state.kind==='spreadsheet'?['report.xlsx','preview.json','sources.json','manifest.json']:['slides.json','report.pptx','pages/page-01.png','manifest.json'];return `<div class="files-panel" data-testid="file-list"><div class="panel-title"><h3>版本 v${state.version} 的文件</h3><p>从已发布 manifest 读取；不是沙箱实时目录。</p></div>${names.map((n,i)=>`<div class="file-row"><span>▤</span><div class="filename"><div class="mono">${n}</div><small>${[18.2,46.8,5.3,2.1][i]} KB · SHA-256 已绑定版本</small></div><button data-action="file" data-file="${n}">查看</button><button data-action="download">↓</button></div>`).join('')}</div><div class="details-box"><b>下载规则</b><p>服务端以 session + version + manifest 中的路径授权。历史下载不得重定向到最新目录；本原型仅导出演示说明。</p></div>`}
function checks(){if(state.version===null)return `<div class="details-box"><h3>尚无已发布版本的检查报告</h3><p>本轮工具进度见左侧执行卡。未运行的检查不能标记为通过。</p></div>`;return `<div class="check-panel" data-testid="checks-panel"><div class="panel-title"><h3>验证事实，不是模型自述</h3><p>当前查看 v${state.version}；本表所有结果仅为界面演示。</p></div>${[['good','通过','文件与入口','入口存在，输出文件已纳入不可变 manifest。'],['good','通过','构建执行','沙箱构建命令退出码为 0。'],['good','通过','基础预览','隔离预览载入验证已运行。'],['','未运行','完整业务准确性','尚未执行人工业务复核，不能标记为通过。']].map(([cls,status,name,desc])=>`<div class="check-row"><span class="badge ${cls}">${status}</span><div><b>${name}</b><p>${desc}</p></div></div>`).join('')}</div><div class="details-box"><b>执行关联</b><br><code>session: craft_demo_01<br>run: run_demo_${state.runCount}<br>delegation: delegation_demo_03<br>workspace revision: ${state.workspaceRevision}<br>runtime: tRPC-Agent-Go → OpenCode</code><div class="line" style="margin:12px 0"></div>执行日志默认只读；交互终端作为单独授权能力。</div>`}
function canvas(){return `<section class="canvas-pane" aria-label="作品面板"><div class="canvas-toolbar"><div class="tabs" role="tablist" aria-label="作品内容">${[['preview','预览'],['files','文件'],['checks','检查 / 详情']].map(([id,title])=>`<button class="${state.tab===id?'active':''}" role="tab" aria-selected="${state.tab===id}" data-action="tab" data-tab="${id}" data-testid="tab-${id}">${title}</button>`).join('')}</div><button data-action="versions" class="small" data-testid="version-label">${state.version===null?'尚未交付':'v'+state.version+' '+(state.version===state.versions[0]?.id?'· 最新交付':'· 历史版本')} ⌄</button></div><div class="canvas-body">${banner()}${state.tab==='preview'?preview():state.tab==='files'?files():checks()}</div><div class="canvas-footer"><span>⏣ 隔离预览 · 按版本授权</span><span>工作区 revision ${state.workspaceRevision} · 本地演示</span></div></section>`}
function workbench(){return header(true)+`<div class="mobile-tabs"><button data-action="mobile" data-mode="conversation" class="${state.mobile==='conversation'?'active':''}">对话</button><button data-action="mobile" data-mode="preview" data-testid="mobile-preview" class="${state.mobile==='preview'?'active':''}">作品</button><button data-action="sources">来源</button></div><div class="workbench" data-testid="workbench" data-mobile="${state.mobile}">${chat()}${canvas()}</div>`}
function library(){return header()+`<section class="home"><div class="home-hero"><div class="eyebrow">YOUR ARTIFACTS</div><h1>每一版成果，都留得住。</h1><p>最近作品与不可变版本。搜索只作用于当前示例空间。</p></div><label class="sr-only" for="search">搜索作品名称</label><input id="search" placeholder="搜索作品名称…" style="width:100%;border:1px solid var(--line);padding:12px 16px;border-radius:9px;margin-bottom:25px">${cards()}<p class="muted small" style="margin-top:20px">点击作品继续查看与修改。列表数据为原型内置示例。</p></section>`}
function templates(){return header()+`<section class="plain-page"><div class="eyebrow">GUIDED START</div><h1 style="margin-top:10px">从目标开始，不必从空白开始。</h1><p>模板只是预填目标、作品类型与资料要求，不是另一套执行引擎。</p>${Object.entries(kinds).map(([k,title])=>`<div class="capability"><h3>${title}<button data-action="template" data-kind="${k}">使用此引导 →</button></h3><p>${{web:'生成可筛选的业务看板；提供 CSV 与指标口径。',document:'生成有引用的客户材料；提供产品知识与目标读者。',spreadsheet:'汇总数据并产生公式计算结果；提供明细与统计规则。',slides:'将业务材料整理成演示稿；提供受众、页数与重点。'}[k]}</p></div>`).join('')}</section>`}
function capabilities(){return header()+`<section class="plain-page"><div class="eyebrow">CAPABILITIES & BOUNDARIES</div><h1 style="margin-top:10px">能力逐项开放，结果逐项验证。</h1><p>这是设计说明页面，不对应已上线的管理员配置 API。</p>${[['主 Agent','tRPC-Agent-Go','理解需求、检索知识、选择工具、委派执行和最终交付。'],['执行 Agent','OpenCode','在绑定沙箱中修改文件、执行命令和局部修复。'],['作品类型','独立功能开关','网页优先；文档、表格、演示稿各自完成生成、修改、预览、下载验收后开放。'],['安全与预算','每个阶段的前置门槛','租户与资源授权、工作区串行、停止与恢复、预览隔离和有限执行预算。'],['暂不纳入首版','明确边界','任意后端应用公网部署、多人同时改文件、完整在线 Office 编辑器，不由当前线框承诺。']].map(([name,badge,desc])=>`<div class="capability"><h3>${name}<span class="badge">${badge}</span></h3><p>${desc}</p></div>`).join('')}</section>`}
function guide(){return header()+`<section class="plain-page"><div class="eyebrow">DESIGN HANDOFF / SEPTEMBER 2026</div><h1 style="margin-top:10px">可点击线框与状态契约</h1><p>原型由独立 HTML/CSS/JavaScript 构成，展示目标交互；不是已接入 assistant-ui 的生产前端。刷新后回到示例状态。</p><table class="spec-table"><tr><th>区域</th><th>点击路径</th><th>实现归属</th></tr><tr><td>创建作品</td><td>首页 → 类型 / 资料 → 开始创作</td><td>apps/web 装配 + core 命令层</td></tr><tr><td>对话</td><td>我的作品 → 对话 → 发送修改</td><td>assistant-ui + 外部消息投影</td></tr><tr><td>资料</td><td>来源 → 查看原文 / 模拟撤权</td><td>WeKnora 原有资源 ACL</td></tr><tr><td>版本</td><td>版本记录 → 查看 → 从此版继续</td><td>不可变版本 + 工作区恢复</td></tr><tr><td>故障</td><td>顶部状态选择器</td><td>连接 / 主任务 / 作品状态分离</td></tr><tr><td>导出</td><td>导出作品 → 下载演示说明</td><td>正式实现须调用版本文件 API</td></tr></table><div class="capability"><h3>审阅范围与来源</h3><p>基线：1123786563/WeKnora-fork01 @ 0cba2f85f8998a28691d564690a1261dcc041643。通过 GitHub 连接逐文件读取文档和关键源码，未完成本地完整 clone，未启动真实模型或后端。onyxCraft 参考仓库本轮访问返回 404，本设计不是其像素级复刻。</p></div><div class="capability"><h3>恢复不等于覆盖版本</h3><p>查看历史版本不改变工作区。确认恢复只改变工作区 revision 与编辑基线；下一次真正修改交付后才新增作品版本。上传就绪不等于知识索引就绪，预览过期也不等于任务失败。</p></div><button class="primary" data-action="open-demo" data-kind="web">进入完整工作台演示 →</button></section>`}
function render(){const main=$('#main');main.innerHTML=state.route==='workbench'?workbench():state.route==='library'?library():state.route==='templates'?templates():state.route==='capabilities'?capabilities():state.route==='guide'?guide():renderHome();$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===state.route));$('#scenario').value=state.scenario}
function showPanel(type){const dlg=$('#drawer');if(dlg.open)dlg.close();$('#drawer-title').textContent=type==='versions'?'版本记录':type==='upload'?'添加创作资料':'知识与材料来源';$('#drawer-eyebrow').textContent=type==='versions'?'IMMUTABLE VERSIONS':type==='upload'?'AUTHORIZED INPUTS':'EVIDENCE & PERMISSIONS';if(type==='versions'){$('#drawer-content').innerHTML=`<p class="drawer-intro">查看旧版不会修改工作区。恢复只改变编辑基线，下一次交付才发布新版本。</p>${state.versions.map(v=>`<article class="version-item ${v.id===state.version?'selected':''}"><header><b>v${v.id} · ${v.id===state.versions[0].id?'最新交付':'历史交付'}</b><span class="badge good">不可变</span></header><p>${v.title}<br>${v.date} · 文件 4 个 · 检查记录保留</p><div class="btns"><button data-action="view-version" data-version="${v.id}" data-testid="view-v${v.id}">查看此版本</button><button data-action="restore" data-version="${v.id}" data-testid="restore-v${v.id}" ${['running','approval','question','reconnecting','readonly'].includes(state.scenario)?'disabled':''}>从此版本继续编辑</button></div></article>`).join('')}<p class="small muted">当前工作区 revision ${state.workspaceRevision}。有活动任务或无写权限时不能恢复；正式实现必须检查完整恢复快照。</p>`}else if(type==='upload'){$('#drawer-content').innerHTML=`<p class="drawer-intro">正式流程：已有上传入口 → 完成校验 → 关联到 Craft 输入。上传成功与知识索引可检索是不同状态。</p><label class="source-item" style="display:block;cursor:pointer;border-style:dashed"><b>选择本地示例文件</b><p class="small muted" style="margin:7px 0 15px">本原型仅显示文件名，不上传或读取文件内容。</p><input type="file" id="demo-file" multiple style="max-width:100%"></label><div id="selected-files"></div><div class="details-box">不在浏览器生成数据库、模型或沙箱凭据。材料摘录作为数据，不作为权限指令。</div>`}else{$('#drawer-content').innerHTML=`<div data-testid="source-panel"><p class="drawer-intro">本次创作依据以下材料。来源绑定作品版本；查看原文时重新校验权限。</p><article class="source-item"><h3>S1 · 销售数据.csv <span class="badge good">已关联</span></h3><div class="meta">会话上传 · 摘要 sha256: demo… · 原型数据</div><div class="source-excerpt">区域、月份、订单与销售额。只向执行环境提供当前任务需要的授权文件。</div><button data-action="source-open" data-source="S1">查看来源说明</button></article><article class="source-item"><h3>S2 · 产品知识库 <span class="badge ${state.sourcesRevoked?'bad':'good'}">${state.sourcesRevoked?'权限已撤销':'已授权'}</span></h3><div class="meta">共享知识范围 · 稳定引用 citation: S2</div><div class="source-excerpt">产品分类与业务口径摘录。检索遵循现有共享知识 ACL，不简单等同于 tenant_id 相同。</div><div class="btns"><button data-action="source-open" data-source="S2">打开原文</button><button data-action="revoke">${state.sourcesRevoked?'恢复演示授权':'模拟撤销权限'}</button></div></article><div class="details-box"><b>继续修改时重新授权</b><p>历史引用不代表永久权限。权限变化后不继续检索受限内容；已导出文件的撤回能力需另行定义。</p></div><div class="btns" style="margin-top:20px"><button data-action="upload">＋ 添加本地资料</button><button class="primary" data-action="close-panel">使用这些示例来源</button></div></div>`}dlg.showModal()}
function confirmation(title,body,button,action,attrs=''){const c=$('#confirm');c.innerHTML=`<h2 id="confirm-title">${title}</h2><p>${body}</p><div class="btns"><button data-action="close-confirm">取消</button><button class="primary" data-action="${action}" ${attrs}>${button}</button></div>`;c.showModal()}
function send(){if(['running','approval','question','reconnecting','readonly'].includes(state.scenario)){toast('当前状态不能提交新任务；正在运行时仅保留修改草稿。');return}const text=$('#composer')?.value.trim();if(!text){toast('请先输入修改目标。');$('#composer')?.focus();return}state.lastPrompt=text;state.runCount++;state.scenario='running';render()}
function downloadDemo(){if(state.version===null){toast('尚未交付作品，不能导出。');return}const text=`WeKnora Craft 线框演示导出\n作品：${state.title}\n选中版本：v${state.version}\n工作区 revision：${state.workspaceRevision}\n\n这不是实际生成的作品文件。正式下载必须调用指定版本的授权文件 API。\n所有数字均为示例，不是用户真实数据。\n`;const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`craft-demo-v${state.version}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载演示说明；未生成真实 Office 或网页交付包。')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return; e.preventDefault();const a=el.dataset.action;switch(a){case'new':state.scenario='ready';go('home');setTimeout(()=>$('#home-prompt')?.focus(),0);break;case'library':go('library');break;case'kind':state.kind=el.dataset.kind;const draft=$('#home-prompt')?.value;render();if(draft)$('#home-prompt').value=draft;break;case'create':state.lastPrompt=$('#home-prompt')?.value.trim()||'根据授权材料生成示例作品';state.versions=[];state.version=null;state.baseVersion=null;state.workspaceRevision=1;state.runCount=1;state.scenario='running';openDemo(state.kind,true);break;case'open-demo':openDemo(el.dataset.kind||'web');break;case'template':state.kind=el.dataset.kind;go('home');$('#home-prompt').value=`根据我选择的企业资料，生成${kinds[state.kind]}，保留来源并提供可继续修改的文件。`;break;case'sources':showPanel('sources');break;case'versions':showPanel('versions');break;case'upload':showPanel('upload');break;case'close-panel':$('#drawer').close();break;case'close-confirm':$('#confirm').close();break;case'tab':state.tab=el.dataset.tab;render();break;case'viewport':state.viewport=el.dataset.mode;render();break;case'mobile':state.mobile=el.dataset.mode;render();break;case'view-output':state.tab='preview';state.mobile='preview';render();break;case'view-version':state.version=Number(el.dataset.version);state.tab='preview';$('#drawer').close();render();toast(`正在只读查看 v${state.version}，编辑基线仍为 v${state.baseVersion}。`);break;case'restore':const v=Number(el.dataset.version);$('#drawer').close();confirmation(`从 v${v} 继续编辑？`,'将校验授权与恢复快照，再重建工作区并提升 revision。历史文件保持不变；不会仅因恢复就创建新作品版本。','恢复编辑基线','confirm-restore',`data-version="${v}" data-testid="confirm-restore"`);break;case'confirm-restore':state.version=Number(el.dataset.version);state.baseVersion=state.version;state.workspaceRevision++;$('#confirm').close();render();toast(`演示：工作区已恢复，以 v${state.baseVersion} 为编辑基线，历史版本未改变。`);break;case'send':send();break;case'finish':state.scenario='ready';state.version=Math.max(0,...state.versions.map(v=>v.id))+1;state.baseVersion=state.version;state.workspaceRevision++;state.versions.unshift({id:state.version,title:'根据本轮要求修改并交付（模拟）',date:'本次演示生成'});render();toast(`演示完成：发布 v${state.version}；旧版本保持不变。`);break;case'approve':state.decision=true;render();break;case'ack':state.scenario='running';state.decision=false;render();toast('演示：送达已确认，原任务继续执行。');break;case'reject':state.scenario='failed';state.decision=false;render();toast('演示：本次请求被拒绝；未授予任何权限。');break;case'answer':state.scenario='running';render();toast('演示：问题答案已提交，不构成命令执行授权。');break;case'stop':confirmation('停止当前任务？','正式操作需要后端持久化取消并核对 OpenCode。关闭浏览器或断开 SSE 不会触发取消。','确认停止','confirm-stop');break;case'confirm-stop':$('#confirm').close();state.scenario='canceled';render();toast('演示：任务已停止；未发布的修改不会覆盖历史版本。');break;case'reconnect':state.scenario='ready';render();toast('演示：已同步原 Run，没有创建新任务。');break;case'retry':state.tab='checks';render();toast('先查看检查证据，再显式发送新的修复要求。');break;case'refresh-preview':state.scenario='ready';render();toast('演示：仅刷新预览授权，没有重新生成作品。');break;case'download':downloadDemo();break;case'file':confirmation(esc(el.dataset.file),`这是版本 v${state.version} 的文件条目演示。真实内容必须经授权文件 API 读取，本原型未连接对象存储。`,'知道了','close-confirm');break;case'source-open':toast(el.dataset.source==='S2'&&state.sourcesRevoked?'403 演示：来源访问已撤销，不能沿用旧权限。':'来源定位演示：正式实现按 citation ID 重新鉴权后打开原文。');break;case'revoke':state.sourcesRevoked=!state.sourcesRevoked;showPanel('sources');break;case'help':go('guide');break}});
$('#scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.decision=false;if(state.route!=='workbench')state.route='workbench';location.hash='workbench';render()});
document.addEventListener('change',e=>{if(e.target.id==='demo-file'){$('#selected-files').innerHTML=Array.from(e.target.files).map(f=>`<div class="source-item"><b>${esc(f.name)}</b><p class="small muted">${(f.size/1024).toFixed(1)} KB · 仅选择，未上传</p></div>`).join('')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){$$('.artifact-card').forEach(card=>card.style.display=card.textContent.includes(e.target.value)?'block':'none')}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(['home','workbench','library','templates','capabilities','guide'].includes(r)&&state.route!==r){state.route=r;render()}});
const initial=location.hash.slice(1);if(['home','workbench','library','templates','capabilities','guide'].includes(initial))state.route=initial;render();
</script>
</body></html>

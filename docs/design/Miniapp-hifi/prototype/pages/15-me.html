", "edge": "目标不可用/预算不足/提交未知状态；先查询原request_id，不新建重复任务。", "permission": "target/workspace为服务端授权选择；不向现有StartExecutionInput私塞attachment_ids。", "api": "E POST workbench/executions；GET workbench/executions/requests/:request_id。", "layout": "Agent信息卡；任务文本；预算与运行环境；边界说明；底部提交。"}, {"id": "chat", "n": "06", "name": "知识 / Agent 对话", "group": "使用", "badge": "适配现有聊天", "goal": "自然语言问答，展示引用、工具摘要和临时附件。", "fields": "会话标题、知识范围、气泡、引用、工具进度、输入框、附件、发送与停止。", "events": "输入并模拟增量回复；打开引用文档；临时附件说明；打开历史；主动停止输出。", "edge": "网络断开显示恢复/重试；空回答与无引用区分；不将停止本地订阅等同取消后台执行。", "permission": "仅本人会话；引用文档需再次鉴权；只展示执行摘要、不显示私有推理。", "api": "E sessions、messages、knowledge-chat/agent-chat、attachments、continue-stream（需验证）。", "layout": "导航与知识范围；可滚动消息区；引用卡片；固定底部输入条，不与Tab重叠。"}, {"id": "tasks", "n": "07", "name": "任务中心", "group": "任务", "badge": "新增列表读模型", "goal": "跨设备查看本人任务，按状态定位运行和待处理事项。", "fields": "全部/运行中/待处理/已完成、任务标题、Agent、状态、更新时间、恢复标识。", "events": "筛选任务；打开详情；新建任务；待处理跳审批。", "edge": "空任务/筛选无结果/无权限/服务未装配分开；离线只读缓存有明确时点。", "permission": "分页和统计基于owner+tenant，不是全租户管理员任务墙。", "api": "N GET workbench/executions 列表；E 单run详情/快照。", "layout": "标题与新建；状态筛选；任务卡列表；恢复说明；底部4Tab。"}, {"id": "execution", "n": "08", "name": "执行详情", "group": "任务", "badge": "复用快照与事件", "goal": "看进度、恢复状态、追加指令、取消或进入审批。", "fields": "run状态、连接状态、任务正文、阶段摘要、待处理卡、产物、执行/结算状态。", "events": "模拟断网并恢复；打开审批；追加文字steer；二次确认取消；模拟完成后查看产物。", "edge": "seq缺口或schema不支持→重新同步；取消已完成run要刷新状态；结算中不能当异常重复计费。", "permission": "单run归属与capabilities检查；操作带expected_revision；不能向source-events写客户端伪事件。", "api": "E execution/get/snapshot/events/interactions/commands。", "layout": "状态大卡；任务信息；步骤时间线；待处理区域；底部操作。"}, {"id": "approval", "n": "09", "name": "审批与风险确认", "group": "任务", "badge": "复用交互决策", "goal": "用户理解动作对象与影响后，只批准当前这一次操作。", "fields": "任务/空间、待批准动作、目标、必要参数、风险说明、拒绝理由、有效性。", "events": "同意前二次确认；拒绝并说明原因；模拟他端处理冲突后刷新。", "edge": "已处理/过期/版本冲突禁止重复提交；不显示永久允许或默认同意。", "permission": "来自服务端的可处理interaction；预算扩展不等于外部写操作授权。", "api": "E GET :run/interactions；POST interactions/:id/decisions；请求体沿用真实类型。", "layout": "风险提示；动作摘要；影响/对象；参数折叠区；固定拒绝/仅此次同意。"}, {"id": "artifact", "n": "10", "name": "任务产物", "group": "任务", "badge": "安全查看", "goal": "获取后台真实保存的产物，不在小程序运行生成代码。", "fields": "文件名称、类型、来源任务、授权状态、内容摘要、下载、返回任务。", "events": "查看示例文本；模拟下载提示；返回执行详情。", "edge": "文件过期/撤销/无权限；HTML与脚本只显示安全摘要或源码说明。", "permission": "通过受鉴权资源接口下载，不保存永久公开地址。", "api": "E sessions/:id/artifacts、message artifacts/download；跨run映射按真实session/message确认。", "layout": "文件信息；安全标记；文本预览；下载/返回操作。"}, {"id": "knowledge", "n": "11", "name": "知识库", "group": "知识", "badge": "复用知识领域", "goal": "找可访问的知识库并进入检索或问答。", "fields": "搜索、我的/空间/共享、知识库卡片、最近更新、可操作状态。", "events": "搜索；选知识库；点问答；进入导入流程。", "edge": "共享只读库禁止上传；空库提示导入；未就绪不能承诺可检索。", "permission": "知识共享范围和tenant范围按后端组合验证。", "api": "E knowledgeBases共享API与domain筛选；具体字段按真实返回投影。", "layout": "空间/搜索；筛选；知识库卡；最近文档；底部4Tab。"}, {"id": "kb", "n": "12", "name": "知识库详情", "group": "知识", "badge": "文档与解析状态", "goal": "查看文档与处理状态，选择基于此库提问。", "fields": "名称、说明、文档列表、解析/就绪/失败状态、上传入口、库内提问。", "events": "打开文档；问答；导入；查看解析状态说明。", "edge": "上传完还未解析；失败条目显示可诊断说明；权限变动需刷新。", "permission": "上传权限以实际知识库授权为准，不能仅从菜单判断。", "api": "E knowledge document list / processing / settings相关共享API。", "layout": "知识库头部；双操作；文档搜索；状态列表。"}, {"id": "upload", "n": "13", "name": "添加知识", "group": "知识", "badge": "原生文件适配", "goal": "通过文件或URL将内容写入当前有权限的知识库。", "fields": "目标库、文件/链接选择、文件信息、上传进度、解析说明、提交。", "events": "模拟选择文件；切换URL输入；提交显示上传与解析两段状态；返回文档列表。", "edge": "格式/大小不允许、网络失败、URL抓取失败；不将临时聊天附件自动入库。", "permission": "明确目标库与权限；URL安全策略由后端执行。", "api": "E knowledge upload/import共享API；A Taro.uploadFile + NativeFileSource。", "layout": "目标说明；导入方式；文件占位/URL；进度；确认与返回。"}, {"id": "document", "n": "14", "name": "文档 / 引用详情", "group": "知识", "badge": "引用来源可追溯", "goal": "从回答引用追溯到获授权的原文片段。", "fields": "标题、所属知识库、来源位置、引用段落、完整内容入口、提问按钮。", "events": "高亮引用；基于文档继续问答；模拟安全下载。", "edge": "引用内容已更新/被删/权限撤销提示；不伪造页码。", "permission": "文档级鉴权；模型生成URL不直接当可信来源。", "api": "E knowledge document/preview与chat reference领域映射。", "layout": "文件元信息；引用高亮块；正文片段；提问/下载。"}, {"id": "me", "n": "15", "name": "我的", "group": "账户", "badge": "复用身份与商业信息", "goal": "查看账号、当前空间、用量订单、邀请和隐私入口。", "fields": "账号、空间角色、套餐摘要、可用额度、冻结量、订单、通知、退出。", "events": "切换空间；用量套餐；查看订单；处理邀请；打开协议；确认退出。", "edge": "用量stale显示统计时点；无计费权限隐藏写操作而非伪报成功。", "permission": "账号与空间职责分开；退出清理本端数据并撤销可撤销登录态。", "api": "E auth/me、commercial/summary、orders、me/invitations。", "layout": "身份卡；空间；用量摘要；功能列表；底部4Tab。"}, {"id": "usage", "n": "16", "name": "用量与套餐", "group": "账户", "badge": "支付通道需核验", "goal": "解释可用/预占/退款冻结，并在权限允许时选择套餐报价。", "fields": "套餐、可用/预占/退款冻结、统计时点、用量示例、计划卡、购买资格。", "events": "选择示例套餐进入报价；查看账单；无权限显示原因。", "edge": "过期报价重取；商品/终端不支持购买；不给外部绕过支付链接。", "permission": "由后端billing权限与通道资格控制；金额/credits使用字符串真值。", "api": "E commercial summary/plans/usage/quotes；N 合规通道可用性。", "layout": "余额卡；用量条；套餐卡；政策待核验提示；订单入口。"}, {"id": "checkout", "n": "17", "name": "报价与支付", "group": "账户", "badge": "新增渠道契约", "goal": "在已核验的购买能力下确认服务端报价并调起正确支付通道。", "fields": "空间、商品、报价金额、权益、有效期、购买权限、通道和状态。", "events": "默认通道待核验不可购买；点击演示开关仅模拟已开通；提交→付款待确认订单。", "edge": "过期/权限不足/用户取消/渠道未知状态；不以端回调给权益。", "permission": "AI次数与会员先评估虚拟支付；合规普通服务才使用JSAPI；签名与openid从后端得到。", "api": "E quotes/orders；N typed mini checkout / 虚拟或JSAPI渠道适配。", "layout": "订单信息；金额与权益；合规通道状态；底部确认；清晰模拟按钮。"}, {"id": "order", "n": "18", "name": "订单与履约结果", "group": "账户", "badge": "付款≠履约", "goal": "分别显示支付与权益发放状态，避免重复购买。", "fields": "订单号、付款状态、履约状态、金额、商品、时间、重查按钮。", "events": "模拟已付款待履约；模拟后端履约确认；刷新原订单；返回用量。", "edge": "支付超时不新建重复订单；退款状态不自算；attention说明需处理。", "permission": "仅当前空间可见且授权的订单；示例模拟不代表真实支付。", "api": "E GET commercial/orders/:id；OrderView.payment 与 fulfillment。", "layout": "两阶段状态；订单详情；状态说明；查询和返回。"}, {"id": "invitations", "n": "19", "name": "空间邀请", "group": "账户", "badge": "复用邀请流程", "goal": "让微信深链进入已存在的租户邀请确认，而不是直接授权。", "fields": "邀请空间、邀请者、角色、状态、接受/拒绝。", "events": "接受后进入空间选择；拒绝后列表更新。", "edge": "链接过期/已撤销/已接受；匿名先登录再验证邀请。", "permission": "仅受邀人可操作；分享链接token只用于服务端验证。", "api": "E me/invitations、accept/decline、accept-by-token。", "layout": "邀请说明；卡片；权限范围；接受/拒绝。"}, {"id": "states", "n": "20", "name": "异常与能力状态", "group": "验收", "badge": "必须覆盖", "goal": "展示加载失败、服务未开通、权限拒绝与断流恢复的不同表现。", "fields": "错误原因、恢复动作、请求标识、只读缓存时点、能力状态。", "events": "切换异常类型；重试；去执行页恢复；去登录。", "edge": "禁止把404/503/forbidden显示成“暂无数据”；网络断开不创建新run。", "permission": "不展示后端堆栈、凭证或敏感参数。", "api": "E ApiError与ExecutionDTO.capabilities；N 完整部署能力声明。", "layout": "状态筛选；图形占位；原因与恢复；设计验收说明。"}];

function home(){return `<div class="row between"><span class="pillnote">高保真原型 · 示例数据</span><button class="textbtn" data-go="usage">用量与套餐 ${icon('chev')}</button></div><div class="space"></div><h1>把任务交给 AI，<br>把时间留给重要的事。</h1><p class="muted">查资料、整理文档，或继续一项工作。</p><div class="card"><label class="tiny" for="home-prompt">今天想完成什么？</label><textarea id="home-prompt" class="textarea" style="border:0;padding:10px 0;min-height:66px" placeholder="例如：整理本周工作，生成一份周报"></textarea><div class="row between"><span class="tiny">使用团队已配置的 Agent</span><button class="btn primary small" data-act="home-start">发起任务 ${icon('send')}</button></div></div><div class="section"><h2>常用 Agent</h2><button class="textbtn" data-go="agents">查看全部 →</button></div><div class="grid2"><button class="card choose" data-go="chat"><div class="avatar">${icon('knowledge')}</div><div class="space-sm"></div><h3>知识问答助手</h3><div class="tiny">从团队资料中找答案</div></button><button class="card choose" data-go="agent"><div class="avatar">${icon('tasks')}</div><div class="space-sm"></div><h3>周报整理助手</h3><div class="tiny">汇总进展，生成周报</div></button></div><div class="section"><h2>需要你关注</h2>${tag('1 项待处理','wait')}</div><button class="card pale taskcard" data-go="approval"><div class="row"><div class="avatar">${icon('shield')}</div><div class="grow"><h3>周报发送前，确认一下</h3><div class="tiny">AI 已整理完成，发送到工作群需你批准</div></div>${icon('chev')}</div></button><div class="section"><h2>最近会话</h2><button class="textbtn" data-go="chat">继续提问 →</button></div><div class="card flat">${row('产品上线前需要准备哪些资料？','知识问答 · 今天 09:12','chat','knowledge')}${row('销售周报整理','周报助手 · 等待确认','execution','tasks')}</div>`}
function login(){return `<div class="loginlogo"><div class="brandmark">W</div></div><div class="loginhead"><h1>你的随身 AI 工作台</h1><p>同一账号，同一空间。<br>在微信继续 Web 和移动端上的工作。</p></div><div class="card"><h3>${state.bindMode?'绑定已有平台账号':'登录 WeKnora'}</h3><p class="tiny">${state.bindMode?'需同时证明微信身份与原账号身份。此处仅模拟。':'这是离线交互演示，不会发起真实登录。'}</p>${btn(state.bindMode?'模拟验证微信身份':'微信快捷登录','','primary full','login-wx')}<div class="checkline"><input type="checkbox" id="consent"/><div><label for="consent">我已阅读并同意 </label><button class="textbtn" data-act="privacy">隐私政策</button> 与 <button class="textbtn" data-act="terms">服务协议</button></div></div><hr class="divider"/><p class="tiny">也可使用已有平台账号</p>${label('邮箱 / 账号','account')}<input class="input" id="account" placeholder="请输入平台账号" autocomplete="username"/>${label('密码','password')}<input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password"/><div class="space"></div>${btn('模拟账号登录','','full','login-account')}<div id="login-error" class="errorline" role="alert"></div></div><button class="textbtn" style="display:block;margin:auto" data-act="bind">${state.bindMode?'返回登录':'已有账号？先绑定，避免新建重复身份'}</button><p class="tiny" style="text-align:center;margin-top:16px">无需填写服务器地址或租户 API Key</p>`}

function agent(){return `<div class="card"><div class="row"><div class="avatar large">${icon('tasks')}</div><div><h2>周报整理助手</h2><div class="tiny">平台托管执行 · 团队已配置</div></div></div><div class="tags">${tag('资料整理')}${tag('生成产物')}${tag('敏感操作需确认','wait')}</div></div>${label('想让 Agent 完成什么？','task-input')}<textarea class="textarea" id="task-input" style="min-height:148px">${esc(state.taskText)}</textarea><div class="section"><h2>运行设置</h2></div><div class="card"><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>执行环境</span><b>平台托管（示例）</b></div><div class="kv"><span>资料范围</span><b>使用 Agent 已配置资源</b></div>${label('预算上限（演示单位）','budget')}<input id="budget" class="input" type="number" min="1" value="100" aria-label="预算上限"/><p class="tiny">实际单位由后端预算契约决定；此数值不是实际价格。</p></div><div class="notice warn">当前启动契约不包含任意附件字段。本页不伪造“附加文件已进入任务”的能力。</div>${btn('发起任务','','primary full','task-start')}<p class="tiny">网络未知时会先查找原请求，不重复创建任务。</p>`}
function chat(){return `<div class="row between" style="margin-bottom:15px"><span class="tag">知识范围 · 产品与业务资料</span><button class="textbtn" data-act="chat-history">会话历史</button></div><div id="messages"><div class="msg user"><div class="who">我</div><div class="bubble">产品上线前需要准备哪些资料？</div></div><div class="msg"><div class="who">${icon('spark')} 知识问答助手</div><div class="bubble">根据当前知识库中的上线流程，建议先准备以下资料：<br><br><strong>1. 产品说明</strong><br>确认主要功能、适用用户和已知限制。<br><br><strong>2. 验收清单</strong><br>包含核心链路、权限和异常场景。<br><br><strong>3. 运营材料</strong><br>准备帮助文档与问题反馈入口。<button class="citation" data-go="document">[1] 产品上线检查清单 · 引用片段<br>点击查看原文与所属知识库 →</button></div><div class="tiny" style="margin-top:7px">答案与文件均为演示数据，请核对原始资料。</div></div>${state.userMessages.map(t=>`<div class="msg user"><div class="who">我</div><div class="bubble">${esc(t)}</div></div>`).join('')}${state.assistantMessage?`<div class="msg"><div class="who">${icon('spark')} 模拟回复</div><div class="bubble" id="stream-text">${esc(state.assistantMessage)}</div></div>`:''}</div><div class="row"><button class="textbtn" data-act="chat-suggestion">整理成待办清单</button><button class="textbtn" data-act="chat-stop">停止演示输出</button></div>`}

function tasks(){let rows=[{type:state.status==='waiting_user'?'waiting':state.status==='succeeded'?'done':'running',html:taskCard('销售周报整理',statusInfo(),'周报整理助手 · 今天 09:20')},{type:'running',html:taskCard('整理客户反馈要点',['运行中','running'],'文档总结助手 · 今天 09:18')},{type:'done',html:taskCard('产品资料摘要',['已完成','done'],'文档总结助手 · 昨天 16:42','artifact')}];return `<div class="row between" style="margin-bottom:14px"><h1 style="font-size:21px;margin:0">我的任务</h1>${btn('新建','agents','small primary')}</div><div class="segments">${[['all','全部'],['running','运行中'],['waiting','待处理'],['done','已完成']].map(([k,v])=>`<button data-act="task-filter" data-value="${k}" class="${state.taskFilter===k?'active':''}">${v}</button>`).join('')}</div>${rows.filter(x=>state.taskFilter==='all'||state.taskFilter===x.type).map(x=>x.html).join('')||'<div class="empty">'+icon('tasks')+'<h3>暂无此类任务</h3><p>可以切换筛选，或发起一个新任务。</p></div>'}<div class="notice">任务在后台执行。切回小程序时从快照与事件恢复，不再次触发同一任务。</div><button class="democtl" data-go="states">查看断线 / 未开通 / 权限不足示例</button><p class="tiny">列表与跨任务待办需要新增服务端分页读模型，不能只依赖手机缓存。</p>`}
function execution(){let info=statusInfo();return `${!state.network?'<div class="notice warn">连接已断开 · 正在等待恢复；后台任务状态未知，不应重启任务。</div>':''}<div class="card pale"><div class="row between"><span class="tiny">销售周报整理</span>${tag(info[0],info[1])}</div><h2 style="margin:12px 0">${state.status==='succeeded'?'任务完成，结果已保存':state.status==='canceled'?'任务已取消':state.status==='waiting_user'?'资料已整理，等待你的确认':'正在整理任务内容'}</h2><div class="tiny">平台托管 · 任务 run_demo_001</div><div class="meter"><div style="width:${state.status==='succeeded'?100:72}%"></div></div><div class="tiny">以上进度仅用于交互演示，不是服务端估算</div></div><div class="card"><h3>我的要求</h3><p class="paragraph">${esc(state.taskText)}</p><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>账务状态</span><b>${state.status==='succeeded'?'结算处理中（示例）':'按后端状态显示'}</b></div></div><div class="section"><h2>执行摘要</h2><span class="tiny">不是内部推理</span></div><div class="timeline"><div class="step"><strong>任务已接收</strong><p>请求已持久记录，避免重复提交。</p></div><div class="step"><strong>读取授权资料</strong><p>从 Agent 已配置的资料范围获取内容。</p></div><div class="step"><strong>完成周报草稿</strong><p>整理重点进展与需要跟进的问题。</p></div><div class="step active"><strong>${state.status==='succeeded'?'产物已保存':state.status==='waiting_user'?'等待发送确认':'继续处理 / 同步结果'}</strong><p>外部发送需要当前用户明确授权。</p></div></div><div class="space"></div>${state.status==='waiting_user'?`<div class="card"><div class="row"><div class="grow"><h3>是否发送到团队工作群？</h3><div class="tiny">外部写操作 · 仅确认本次动作</div></div>${icon('shield')}</div><div class="space-sm"></div>${btn('查看并确认','approval','primary full')}</div>`:''}${['succeeded'].includes(state.status)?btn('查看任务产物','artifact','primary full'):''}<div class="grid2">${btn('追加指令','','','steer')}${btn('取消任务','','danger','cancel-task')}</div><button class="democtl" data-act="network">${state.network?'模拟断开连接':'模拟快照同步与恢复'}</button><button class="democtl" data-act="demo-finish">模拟收到任务完成事件</button>`}
function approval(){return `<div class="notice warn">这是一项外部写操作。请确认发送对象和内容范围；同意预算不代表同意发送。</div><div class="card"><div class="row between"><h2 style="margin:0">发送周报到工作群</h2>${tag(state.approval==='pending'?'待确认':'已处理',state.approval==='pending'?'wait':'gray')}</div><div class="space"></div><div class="kv"><span>来自任务</span><b>销售周报整理</b></div><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>发送目标</span><b>青禾产品团队 · 工作群</b></div><div class="kv"><span>动作范围</span><b>只发送这一次</b></div></div><div class="card"><h3>将发送的内容</h3><p class="paragraph">本周完成产品资料整理与客户反馈归纳；待跟进事项包含上线清单补全和反馈责任人确认。</p><div class="notice" style="margin-bottom:0">示例参数经过脱敏。实际审批展示后端提供的动作与数据影响，不展示密钥。</div></div><div class="card"><h3>请特别留意</h3><p class="muted">发送后，群内成员将能够看到这份摘要。页面打开后若任务或审批版本变化，需要重新确认。</p><label class="formlabel" for="reject-reason">拒绝说明（选填）</label><textarea class="textarea" id="reject-reason" placeholder="例如：先删去未确认的数据" style="min-height:75px"></textarea></div>${state.approval==='pending'?'':`<div class="notice">此审批已在演示中处理。请返回任务刷新当前状态。</div>`}<button class="democtl" data-act="approval-stale">模拟其他设备已经处理</button>`}
function artifact(){return `<div class="card"><div class="row"><div class="avatar large">${icon('file')}</div><div><h2>销售周报.md</h2><div class="tiny">Markdown 文本 · 任务产物</div><div class="tags">${tag('安全文本预览')}${tag('示例')}</div></div></div><hr class="divider"/><div class="kv"><span>来源</span><b>销售周报整理</b></div><div class="kv"><span>空间</span><b>${state.tenant}</b></div></div><div class="card"><h2>本周工作摘要</h2><p class="paragraph">本周主要完成了三项工作：产品资料归档、客户反馈归纳、上线清单整理。</p><h3>重点进展</h3><p class="paragraph">资料结构更清晰，反馈按问题类型归组，待跟进事项已有初步清单。</p><h3>下一步</h3><p class="paragraph">核实关键数据并补齐责任人；发送前确认共享范围。</p><div class="quote">此内容完全虚构，仅用来演示任务产物页面。</div></div><div class="notice">文件下载走授权接口。HTML、脚本与可执行产物不在小程序运行。</div>${btn('下载文件（演示）','','primary full','download')}<div class="space-sm"></div>${btn('返回任务','execution','full')}`}
function knowledge(){return `<div class="searchbox">${icon('search')}<input class="input" id="kb-search" aria-label="搜索知识库" placeholder="搜索知识库或资料"/></div><div class="segments"><button class="active" data-act="knowledge-filter" data-value="all">全部</button><button data-act="knowledge-filter" data-value="mine">我的</button><button data-act="knowledge-filter" data-value="team">空间</button><button data-act="knowledge-filter" data-value="shared">共享</button></div><div id="kb-list">${[['产品与业务资料','12 份文档 · 最近更新 今天','可问答 · 可导入'],['团队流程文档','8 份文档 · 最近更新 昨天','共享只读'],['我的资料','3 份文档 · 最近更新 2 天前','个人']].map(([title,desc,t])=>`<button class="card taskcard kb-item" data-title="${title}" data-go="kb"><div class="row"><div class="avatar">${icon('knowledge')}</div><div class="grow"><h3>${title}</h3><div class="tiny">${desc}</div><div class="tags">${tag(t)}</div></div>${icon('chev')}</div></button>`).join('')}</div><div class="section"><h2>最近文档</h2>${btn('添加知识','upload','small')}</div><div class="card flat">${row('产品上线检查清单','产品与业务资料 · 已就绪','document')}${row('客户反馈整理','产品与业务资料 · 解析中','kb')}</div><p class="tiny">文档、数量和时间为示例；实际按权限范围返回。</p>`}
function kb(){return `<div class="card"><div class="row"><div class="avatar">${icon('knowledge')}</div><div><h2>产品与业务资料</h2><div class="tiny">团队产品说明、流程和上线资料</div></div></div><div class="tags">${tag('12 份文档')}${tag('示例可写')}</div></div><div class="grid2">${btn('基于此库提问','chat','primary')}${btn('添加知识','upload','')}</div><div class="section"><h2>文档</h2><span class="tiny">按最近更新</span></div><div class="card flat">${row('产品上线检查清单','Markdown · 已就绪','document')}${row('产品功能说明','PDF · 已就绪','document')}${row('客户反馈整理','DOCX · 正在解析，不代表已可检索','upload')}${row('旧版操作说明','PDF · 解析失败，查看原因','states')}</div><div class="notice">上传完成后仍需后台解析、索引。解析/失败状态要能在回到页面后重新获取。</div>`}
function upload(){return `<div class="notice">目标知识库：产品与业务资料<br>这是持久知识入库，不是聊天临时附件。</div><div class="segments">${[['file','上传文件'],['url','导入链接']].map(([k,v])=>`<button data-act="upload-mode" data-value="${k}" class="${state.uploadMode===k?'active':''}">${v}</button>`).join('')}</div><div class="card">${state.uploadMode==='file'?`<button class="illustration" style="width:100%" data-act="choose-file">${icon('upload')}<span>${state.uploadSelected?'产品说明.pdf（示例）':'点击模拟选择文件'}</span></button><p class="tiny">正式版使用微信支持的文件选择与上传能力；文件类型和大小由服务端规则返回。</p>`:`${label('网页链接','import-url')}<input class="input" id="import-url" type="url" placeholder="https://example.com/article"/><p class="tiny">后端负责安全抓取和解析；不可用于访问未授权内部地址。</p>`}</div>${state.uploadStage==='parsing'?`<div class="card pale"><div class="row between"><h3>上传已完成</h3>${tag('解析中','running')}</div><div class="meter"><div style="width:100%"></div></div><p class="tiny">可离开本页。完成解析后才进入可检索状态。</p></div>${btn('返回知识库','kb','primary full')}`:btn('确认添加','','primary full','upload-submit')}<p class="tiny">仅模拟上传状态，不读取或上传本机文件。</p>`}
function documentPage(){return `<div class="card"><h2>产品上线检查清单</h2><div class="tiny">所属：产品与业务资料 · 已就绪</div><div class="tags">${tag('来自回答引用 [1]')}${tag('授权文档')}</div></div><div class="card"><h3>引用片段</h3><div class="quote">上线前应完成产品说明、关键链路验收以及运营帮助材料。对权限、异常和反馈入口进行专项核查。</div><h3>文档内容预览</h3><p class="paragraph">本文用于说明上线资料的基本结构。产品负责人确认功能范围，技术负责人验证关键流程，运营负责人准备帮助与反馈信息。</p><div class="docline"></div><div class="docline"></div><div class="docline short"></div><p class="tiny">此处不伪造原始文档页码，正式版使用真实来源位置。</p></div><div class="grid2">${btn('继续提问','chat','primary')}${btn('下载原文','','','download')}</div><p class="tiny">示例文档非真实企业资料；实际访问仍需文档级鉴权。</p>`}
function me(){return `<div class="card"><div class="row"><div class="avatar large">U</div><div><h2>示例用户</h2><div class="tiny">已登录平台账号 · 微信绑定演示</div></div></div><hr class="divider"/><button class="listrow" data-go="workspace">${icon('users')}<div class="grow"><h3>${state.tenant}</h3><div class="tiny">${state.role} · 切换工作空间</div></div>${icon('chev')}</button></div><div class="card pale"><div class="row between"><h3>用量与权益</h3><button class="textbtn" data-go="usage">查看详情 →</button></div><div class="statgrid"><div><span class="tiny">可用</span><strong>8,640</strong></div><div><span class="tiny">预占</span><strong>160</strong></div><div><span class="tiny">退款冻结</span><strong>0</strong></div></div><p class="tiny" style="margin-bottom:0">演示积分 · 按服务端统计时点展示</p></div><div class="card flat">${row('套餐与用量','查询额度、用量明细和可购买产品','usage','wallet')}${row('我的订单','付款与履约分别追踪','order','tasks')}${row('空间邀请','1 项待处理邀请（示例）','invitations','users')}<button class="listrow" data-act="notify">${icon('bell')}<div class="grow"><h3>任务通知</h3><div class="tiny">需逐次/按规则授权，非默认无限推送</div></div>${icon('chev')}</button><button class="listrow" data-act="privacy">${icon('shield')}<div class="grow"><h3>隐私与数据</h3><div class="tiny">隐私说明、数据处理与反馈</div></div>${icon('chev')}</button></div>${btn('退出登录','','full','logout')}`}
function usage(){return `<div class="card pale"><div class="row between"><h3>当前权益</h3>${tag('演示团队套餐')}</div><span class="tiny">可用积分</span><div class="num">8,640 <span style="font-size:11px;font-weight:400">Credits</span></div><div class="statgrid"><div><span class="tiny">已预占</span><strong>160</strong></div><div><span class="tiny">退款冻结</span><strong>0</strong></div><div><span class="tiny">已使用</span><strong>1,200</strong></div></div><hr class="divider"/><div class="tiny">示例统计时点：09:30 · 当前空间 ${state.tenant}</div></div><div class="card"><h3>最近用量分布（示例）</h3><div class="row between tiny"><span>知识问答</span><span>65%</span></div><div class="meter"><div style="width:65%"></div></div><div class="row between tiny"><span>Agent 任务</span><span>35%</span></div><div class="meter"><div style="width:35%"></div></div></div><div class="section"><h2>可选套餐</h2><span class="tiny">价格不是实际报价</span></div><div class="card"><div class="row between"><div><h3>团队月度权益</h3><div class="tiny">一次购买 · 不默认自动续费</div></div><strong>¥99<span class="tiny"> / 示例</span></strong></div><p class="muted">示例新增 10,000 积分，实际额度、期限和价格由报价接口提供。</p>${btn('查看服务端报价（演示）','checkout','primary full')}</div><div class="notice warn">AI会员/次数包需核验商品分类和虚拟支付资质。未开通时不展示真实购买入口。</div>${btn('查看订单','order','full')}`}
function checkout(){return `<div class="card"><h2>确认购买内容</h2><div class="kv"><span>权益归属</span><b>${state.tenant}</b></div><div class="kv"><span>示例商品</span><b>团队月度权益</b></div><div class="kv"><span>新增权益</span><b>10,000 演示积分</b></div><div class="kv"><span>有效期</span><b>以服务端报价为准</b></div><hr class="divider"/><div class="row between"><span class="muted">示例应付金额</span><strong style="font-size:29px">¥99.00</strong></div><p class="tiny">quote_id: quote_demo_001 · 不是实际报价</p></div><div class="card"><h3>支付资格与通道</h3><p class="muted">${state.purchaseEnabled?'演示：假设当前商品已获准使用虚拟支付，并且用户具备购买权限。':'当前未验证商户资质、商品分类与购买权限，因此默认关闭购买。'}</p>${tag(state.purchaseEnabled?'仅演示通道可用':'待核验，不可购买',state.purchaseEnabled?'done':'wait')}<p class="tiny">虚拟权益使用对应虚拟支付通道；只有符合普通服务支付条件的商品才用 JSAPI。</p></div><div class="notice">前端支付返回成功后仍需查原订单。付款与权益发放可能不是同一时刻完成。</div><button class="btn primary full" data-act="pay" ${state.purchaseEnabled?'':'disabled'}>模拟调起支付</button><button class="democtl" data-act="purchase-toggle">${state.purchaseEnabled?'恢复“通道待核验”演示状态':'演示开关：预览已开通且有购买权限的状态'}</button><p class="tiny">本按钮不会打开微信收银台，不收款、不创建真实订单。</p>`}
function order(){let paid=state.orderPayment==='paid',done=state.orderFulfillment==='fulfilled';return `<div class="card pale"><div class="row">${icon(done?'check':'clock')}<h2 style="margin:0">${done?'权益已开通（模拟）':paid?'已付款，权益处理中':'等待后端确认付款'}</h2></div><p class="muted">${done?'示例订单已完成履约。正式系统需后端确认后更新权益。':paid?'请勿重复购买。到账与权益发放仍在处理。':'客户端支付动作不等于订单已成功；以原订单查询结果为准。'}</p></div><div class="card"><div class="kv"><span>订单号</span><b>order_demo_001</b></div><div class="kv"><span>商品</span><b>团队月度权益（示例）</b></div><div class="kv"><span>当前空间</span><b>${state.tenant}</b></div><div class="kv"><span>金额</span><b>¥99.00（示例）</b></div><hr class="divider"/><div class="kv"><span>付款状态 payment</span><b>${state.orderPayment}</b></div><div class="kv"><span>履约状态 fulfillment</span><b>${state.orderFulfillment}</b></div></div>${btn('重新查询原订单','','primary full','order-refresh')}<div class="space-sm"></div>${btn('返回用量','usage','full')}<button class="democtl" data-act="order-paid">模拟收到后端“付款确认”</button><button class="democtl" data-act="order-fulfilled" ${!paid?'disabled':''}>模拟收到后端“履约完成”</button><p class="tiny">状态由演示开关控制，无真实交易。</p>`}
function invitations(){return `<h1>加入一个工作空间</h1><p class="muted">接受邀请前，请确认空间与授予你的权限。</p><div class="card"><div class="row"><div class="avatar">${icon('users')}</div><div><h2>青禾产品团队</h2><div class="tiny">由示例管理员邀请</div></div></div><div class="kv"><span>加入角色</span><b>成员（实际角色以后端为准）</b></div><div class="kv"><span>当前状态</span><b>${state.invitation==='pending'?'待接受':'已处理'}</b></div><p class="muted">加入后可使用被授权的知识库和 Agent，不自动获得其他用户私有会话的访问权。</p>${state.invitation==='pending'?`<div class="grid2">${btn('拒绝','','','invite-decline')}${btn('接受邀请','','primary','invite-accept')}</div>`:btn('选择空间','workspace','full')}</div><div class="notice">邀请链接只用于向后端验证。过期、撤销或他人邀请均不能直接授权加入。</div>`}
function states(){const states={offline:['连接中断','本地显示仅供参考。重新进入后先同步快照，不能创建新的任务来“恢复”。','恢复任务','execution','wifi'],forbidden:['你没有此操作权限','请联系空间管理员确认授权。角色提示仅用于说明，权限由后端判断。','返回工作台','home','shield'],unavailable:['当前部署未开通此能力','工作台执行 handler 或目标未就绪。此状态不同于“没有任务”。','使用知识问答','chat','tasks'],expired:['登录已失效','刷新凭证不可用。先清理本地身份与作用域，再回到登录。','重新登录','login','me'],empty:['还没有任务','从已配置的 Agent 开始一项任务。这里只展示你有权查看的执行。','选择 Agent','agents','tasks']};let [title,desc,text,target,ic]=states[state.errorType];return `<div class="segments">${[['offline','断网'],['forbidden','无权限'],['unavailable','未开通'],['expired','登录失效'],['empty','空数据']].map(([k,v])=>`<button data-act="error-type" data-value="${k}" class="${state.errorType===k?'active':''}">${v}</button>`).join('')}</div><div class="card empty">${icon(ic)}<h2>${title}</h2><p>${desc}</p><div class="space-sm"></div>${btn(text,target,'primary full')}</div><div class="notice">正式版要保留可诊断错误编号，但不暴露后端堆栈、账户信息或密钥。</div><div class="card"><h3>不能合并为一个“失败”</h3><p class="muted">网络中断、权限拒绝、功能未装配、数据为空，分别对应不同的恢复动作。用户不会被引导去重复启动付费任务。</p></div>`}

function hfSection(t,l='',g=''){return `<div class="section"><h2>${t}</h2>${g?`<button class="textbtn" data-go="${g}">${l} ${icon('chev')}</button>`:l}</div>`}
function home(){return `<div class="row between"><span class="hf-eyebrow">上午好，林悦</span><button class="textbtn" data-go="usage">用量 ${icon('chev')}</button></div><h1 class="hf-home-title">把想法，变成<br><em>下一步。</em><span class="hf-spark">${icon('spark')}</span></h1><div class="card hf-intent"><label class="sr-only" for="home-prompt">想完成的任务</label><textarea id="home-prompt" class="textarea" placeholder="整理客户反馈，生成一份行动清单…"></textarea><div class="row between"><span class="row tiny">${icon('shield')}在当前空间安全执行</span><button class="btn primary" data-act="home-start" aria-label="选择助手并继续">${icon('send')}</button></div></div><div class="hf-chips"><button data-act="home-preset" data-text="整理本周项目进展，生成团队周报。">帮我写周报</button><button data-act="home-preset" data-text="梳理客户反馈，提炼优先改进方向。">梳理产品需求</button></div>${hfSection('你的 AI 助手','查看全部','agents')}<div class="grid2"><button class="card choose hf-agent-mini" data-go="chat">${hfTile('knowledge')}<h3>知识问答助手</h3><span class="tiny">有据可循，放心提问</span></button><button class="card choose hf-agent-mini" data-go="agent">${hfTile('tasks','amber')}<h3>周报整理助手</h3><span class="tiny">整理进展，留住重点</span></button></div>${hfSection('需要你关注',tag(state.approval==='pending'?'1 项待处理':'已处理',state.approval==='pending'?'wait':'done'))}<button class="card taskcard hf-attention" data-go="approval"><div class="row">${hfTile('shield','amber')}<div class="grow"><h3>${state.approval==='pending'?'发送周报前，确认一下':'本次审批已处理'}</h3><div class="tiny">${state.approval==='pending'?'草稿已准备好，最后一步由你决定。':'查看当前任务与处理结果。'}</div></div>${icon('chev')}</div></button>${hfSection('最近会话','继续提问','chat')}<div class="card flat">${row('产品上线需要准备哪些资料？','知识问答助手 · 今天 09:12','chat','knowledge')}</div>`}
function login(){return `<div class="hf-loginbrand"><div class="brandmark">W</div>WeKnora</div><h1>随时开始，<br>把工作交给 AI。</h1><p class="muted">你的知识、助手与任务，<br>在同一个工作空间里，随身同行。</p><div class="hf-loginart"><div class="hf-art-chip">${icon('knowledge')}知识有来源，答案更可靠</div><br><div class="hf-art-chip second">${icon('check')}任务在继续，你不必一直等待</div></div><div class="checkline"><input id="consent" type="checkbox"/><div><label for="consent">我已阅读并同意 </label><button class="textbtn" data-act="privacy">隐私政策</button> 与 <button class="textbtn" data-act="terms">服务协议</button></div></div>${btn(state.bindMode?'验证微信身份并绑定':'微信快捷登录','','primary full','login-wx')}<div id="login-error" class="errorline" role="alert"></div><div class="space"></div><details class="card"><summary style="font-size:13px;min-height:24px;cursor:pointer">${state.bindMode?'绑定已有平台账号':'使用已有平台账号'}</summary>${label('邮箱 / 账号','account')}<input class="input" id="account" placeholder="平台账号" autocomplete="username"/>${label('密码','password')}<input class="input" id="password" type="password" placeholder="密码（仅本地演示）" autocomplete="current-password"/><div class="space"></div>${btn(state.bindMode?'验证原账号并绑定':'登录平台账号','','full','login-account')}</details><button class="textbtn" style="display:flex;margin:auto" data-act="bind">${state.bindMode?'返回登录':'已有账号？绑定后继续使用'}</button><p class="tiny" style="text-align:center;margin-top:10px">离线交互原型，不发送账号、密码或微信凭证。</p>`}
function workspace(){return `${hfHead('选择工作空间','个人想法与团队工作，清晰分开。')}${hfWorkspaceOptions().map(([n,d,i,r])=>`<button class="card choose full ${state.selection===n?'selected':''}" data-act="select-space" data-space="${n}" style="width:100%;padding:19px;margin-bottom:14px"><div class="row">${hfTile(i)}<div class="grow"><h3>${n}</h3><div class="tiny">${d}</div></div><span class="check">${state.selection===n?'✓':''}</span></div><div class="tiny" style="margin:14px 0 0 54px">${r} · ${n.startsWith('我的')?'个人专属':'已加入团队'}</div></button>`).join('')}<div class="notice">切换后，会话、任务、资料与额度将切换为该空间的数据。</div>${btn('进入工作空间','','primary full','enter-space')}<div class="row between"><button class="textbtn" data-go="invitations">查看邀请</button><button class="textbtn" data-act="create-space">创建新空间 ${icon('plus')}</button></div>`}
function agents(){return `${hfHead('找到合适的助手','把重复的工作，交给擅长它的 AI。')}<div class="searchbox">${icon('search')}<input id="agent-search" class="input" placeholder="搜索助手或想完成的事" aria-label="搜索助手"/></div><div class="segments">${[['all','全部助手'],['team','团队助手'],['mine','我的常用']].map(([k,v])=>`<button data-act="agent-filter" data-value="${k}" class="${state.agentFilter===k?'active':''}">${v}</button>`).join('')}</div><div id="agent-cards">${agentCards()}</div><div class="notice">这里使用已配置的助手。模型、MCP 与高级编排请在 Web 管理端配置。</div>`}
function agentCards(q=''){return [{name:'知识问答助手',desc:'从团队知识中找到可靠答案，让结论有据可循。',go:'chat',kind:'team',ic:'knowledge',color:'',tags:['知识问答','引用溯源']},{name:'周报整理助手',desc:'梳理进展、提炼重点，生成可以直接审阅的周报。',go:'agent',kind:'team',ic:'tasks',color:'amber',tags:['长任务','需要确认']},{name:'文档写作助手',desc:'把零散想法组织成清晰文档，减少从空白开始的时间。',go:'agent',kind:'mine',ic:'file',color:'blue',tags:['写作','个人常用']}].filter(a=>(state.agentFilter==='all'||state.agentFilter===a.kind)&&(!q||a.name.includes(q)||a.desc.includes(q))).map(a=>`<button class="card taskcard" data-go="${a.go}" data-agent="${a.name}" style="padding:18px"><div class="row">${hfTile(a.ic,a.color)}<div class="grow"><h3>${a.name}</h3><div class="tiny">${a.desc}</div></div>${icon('chev')}</div><div class="tags" style="margin:14px 0 0 54px">${a.tags.map(t=>tag(t)).join('')}</div></button>`).join('')||'<div class="card empty"><h3>没有找到相关助手</h3><p>换个关键词，或查看团队开放的助手。</p></div>'}
function agent(){return `<div class="hf-hero"><div class="row between">${hfTile('tasks','large amber')}${tag('平台托管','done')}</div><h1>周报整理助手</h1><p>把零散进展整理成清晰周报。涉及外部发送时，再单独向你确认。</p><div class="tags">${tag('资料整理')}${tag('生成产物')}${tag('敏感操作需确认','wait')}</div></div><div class="hf-section-number">01 / 告诉助手你想完成什么</div>${label('任务描述','task-input')}<textarea class="textarea" id="task-input" style="min-height:130px">${esc(state.taskText)}</textarea><p class="tiny">越具体，越容易得到你需要的结果。</p><div class="hf-section-number">02 / 确认执行范围</div><div class="card">${hfKv('工作空间',state.tenant)}${hfKv('运行环境','平台托管 · 无需配置')}${hfKv('资料范围','助手已获授权的资源')}</div>${label('本次预算上限（示例单位）','budget')}<input id="budget" class="input" type="number" min="1" value="200" aria-label="本次预算上限"/><p class="tiny">上限不是实际扣费，实际用量以服务端结算为准。</p><div class="notice">本入口提交文字任务。临时文件请使用对话附件，不会自动加入知识库。</div>${btn('确认并发起任务','','primary full','task-start')}`}
function taskCard(n,status,summary=''){return `<article class="card"><div class="row between"><div class="row">${hfTile(n.includes('客户')?'spark':'tasks',status==='waiting_user'?'amber':'')}<span class="tiny">${n.includes('客户')?'需求洞察助手':'周报整理助手'}</span></div>${hfStatus(status)}</div><h3 class="hf-task-title">${n}</h3><p class="tiny">${summary||'正在按你的要求继续执行。'}</p><div class="row between hf-task-footer"><span class="tiny">今天 09:28 · 本人创建</span>${status==='waiting_user'?btn('去确认','approval','small subtle'):btn(status==='succeeded'?'查看产物':'查看进度',status==='succeeded'?'artifact':'execution','small')}</div></article>`}
function tasks(){return `<div class="row between"><div><h1>我的任务</h1><div class="tiny">${state.tenant} · 仅显示本人任务</div></div><button class="iconbtn" data-go="agents" aria-label="创建新任务">${icon('plus')}</button></div><div class="hf-metrics"><div><b>${state.status==='running'?2:1}</b><p>正在执行</p></div><div><b>${state.status==='waiting_user'?1:0}</b><p>需要确认</p></div><div><b>${state.status==='succeeded'?2:1}</b><p>已完成</p></div></div><div class="segments">${[['all','全部'],['running','运行中'],['waiting_user','待确认'],['succeeded','已完成']].map(([k,v])=>`<button data-act="task-filter" data-value="${k}" class="${state.taskFilter===k?'active':''}">${v}</button>`).join('')}</div>${filteredTasks()}<div class="notice">退出小程序不会取消后台任务。回来后，会同步同一任务的进度。</div>`}
function execution(){let waiting=state.status==='waiting_user',done=state.status==='succeeded',canceled=state.status==='canceled';return `<div class="card hf-dark"><div class="row between">${hfStatus(state.status)}<span class="tiny">周报整理助手</span></div><h1 style="font-size:25px;margin-top:20px">${waiting?'最后一步，等你确认':done?'任务已完成':canceled?'任务已取消':'助手正在继续执行'}</h1><p class="muted">${esc(state.taskText)}</p><div class="row tiny" style="margin-top:15px">${icon('wifi')}${state.network?'已同步最新状态':'连接已断开 · 任务仍在后台'}</div><p class="tiny" style="font-family:var(--font-mono);margin-bottom:0">run_demo_001 · 示例任务</p></div>${!state.network?'<div class="notice warn">当前内容来自最近一次快照。恢复连接只会继续读取同一任务。</div>':''}${hfSection('执行过程')}<div class="card"><div class="timeline"><div class="step"><strong>读取项目资料</strong><p>已读取当前空间中有权访问的资料。<br>09:28</p></div><div class="step"><strong>整理周报草稿</strong><p>已归纳本周进展、风险与下周计划。<br>09:29</p></div><div class="step active"><strong>${done?'产物已保存':canceled?'后续操作已停止':'发送周报到项目群'}</strong><p>${waiting?'这会向群成员发送内容，需要你确认。':done?'草稿与结果可在产物页查看。':canceled?'取消不撤销已完成的外部动作。':'正在按照确认后的范围继续执行。'}</p></div></div></div>${waiting?`<div class="card hf-attention"><h3>对外发送前，需要确认</h3><p class="tiny">目标：青禾产品团队 · 项目协作群</p>${btn('审阅并确认','approval','primary full')}</div>`:''}${done?`<div class="card">${row('本周项目周报.md','已生成 · 可安全预览与下载','artifact','file')}</div>`:''}<div class="card">${hfKv('任务状态',hfStatus(state.status))}${hfKv('结算状态',done?'正在核对用量（演示）':'尚未结算')}${hfKv('连接状态',state.network?'已连接':'已断开')}</div><div class="grid2">${btn('追加指令','','','steer')}${btn('取消任务','','danger','cancel-task')}</div><button class="democtl" data-act="${'network'}">演示：${state.network?'断开连接，观察任务状态':'恢复连接，不重新创建任务'}</button><button class="democtl" data-act="demo-finish">演示：任务完成，查看产物</button>`}
function approval(){return `<div style="margin:10px 0 22px">${hfTile('shield','large amber')}<h1 style="font-size:26px;margin-top:16px">这一步，<br>需要你确认。</h1><p class="muted">先核对内容与接收对象，只授权本次操作。</p></div>${state.approval!=='pending'?`<div class="notice warn">${state.approval==='stale'?'此操作已在其他设备处理，当前版本不可再次提交。':state.approval==='approved'?'你已同意本次操作，后续状态请查看任务。':'你已拒绝本次操作，助手不会凭本次审批继续发送。'}</div>`:''}<div class="card"><div class="row between"><h3>发送周报到项目群</h3>${tag(state.approval==='pending'?'待确认':'已处理',state.approval==='pending'?'wait':'gray')}</div><hr class="divider"/>${hfKv('来自任务','整理本周项目进展')}${hfKv('工作空间',state.tenant)}${hfKv('发送目标','项目协作群')}${hfKv('授权范围','仅本次发送，不永久放行')}</div>${hfSection('将发送的内容')}<div class="card"><div class="row"><span class="tiny">${icon('file')}</span><h3>本周项目周报 · 摘要</h3></div><div class="hf-focus" style="margin-top:12px">本周完成产品资料整理与客户反馈归纳；下周推进上线清单补全、关键需求确认和负责人分配。</div><details class="space-sm"><summary class="textbtn">审阅完整示例内容</summary><p class="muted">本周完成：资料整理与反馈归纳。<br>下周计划：补齐验收清单并明确责任人。<br>需要关注：未确认数据不作为最终结论。</p></details><div class="space"></div></div><div class="notice warn">发送后，群成员能够看到这些内容。预算增加不代表已同意对外发送。</div>${label('拒绝理由（选填）','reason')}<textarea id="reason" class="textarea" style="min-height:75px" placeholder="例如：先删除尚未确认的数据。"></textarea><button class="democtl" data-act="approval-stale">演示：模拟此操作已在其他设备处理</button>`}
function artifact(){return `<div class="hf-file-cover"><div class="hf-paper">${icon('file')}MD</div><h2>本周项目周报</h2><div class="tiny">Markdown · 2.4 KB（示例）· 周报整理助手</div></div><div class="notice">安全文本预览，不会执行生成的 HTML 或脚本。</div><div class="card hf-paperbody"><div class="hf-eyebrow">WEEKLY REPORT / 示例产物</div><hr class="divider"/><h2>本周项目周报</h2><p>青禾产品团队 · 2026 年 9 月第 3 周</p><h3>01 / 本周完成</h3><p>整理产品上线资料，归纳客户反馈，并形成可追踪的改进清单。</p><h3>02 / 需要关注</h3><p>部分需求仍需确认负责人；上线验收清单需要补全异常路径。</p><h3>03 / 下周计划</h3><p>推进需求确认、完善验收标准，完成第一轮联调评审。</p></div><div class="grid2">${btn('返回任务','execution')}${btn('下载示例文件','','primary','download')}</div>`}
function knowledge(){return `${hfHead('把知识，用起来。','在资料里找到答案，在答案里找到依据。')}<div class="searchbox">${icon('search')}<input id="knowledge-search" class="input" placeholder="搜索知识库或资料" aria-label="搜索知识库"/></div><div class="segments">${[['all','全部'],['mine','我的'],['space','空间'],['shared','共享']].map(([k,v])=>`<button data-act="kb-filter" data-value="${k}" class="${(state.kbFilter||'all')===k?'active':''}">${v}</button>`).join('')}</div><div id="hf-kb-cards">${hfKnowledgeCards()}</div>${hfSection('最近文档','添加知识','upload')}<div class="card flat">${row('产品上线检查清单','PDF · 今天更新','document','file')}${row('客户反馈整理','文档 · 正在解析','kb','file')}</div>`}
function hfKnowledgeCards(q=''){return [{name:'产品与业务资料',desc:'产品说明、需求文档与上线清单',type:'space',num:12},{name:'团队流程文档',desc:'让日常协作有章可循',type:'shared',num:8},{name:'我的资料',desc:'收藏灵感，积累自己的知识',type:'mine',num:3}].filter(k=>(!state.kbFilter||state.kbFilter==='all'||state.kbFilter===k.type)&&(!q||k.name.includes(q)||k.desc.includes(q))).map(k=>`<button class="card taskcard" data-go="kb" style="padding:18px"><div class="row">${hfTile(k.type==='shared'?'users':'knowledge',k.type==='shared'?'blue':'')}<div class="grow"><h3>${k.name}</h3><div class="tiny">${k.desc}</div></div>${icon('chev')}</div><div class="row between" style="margin-top:16px"><span class="tiny">${k.num} 份文档 · 今天更新</span>${tag(k.type==='shared'?'共享只读':'可问答 · 可导入',k.type==='shared'?'running':'done')}</div></button>`).join('')||'<div class="card empty"><h3>没有找到知识库</h3><p>换个关键词或筛选条件试试。</p></div>'}

function documentPage(){return `<div class="hf-paper" style="width:47px;height:60px;margin:10px 0 22px;box-shadow:3px 3px 0 #D1DEC8">${icon('file')}PDF</div><h1 style="font-size:25px">产品上线检查清单</h1><div class="hf-titlemeta">产品与业务资料 · 今天 09:10 更新</div><div class="tags">${tag('已就绪','done')}${tag('授权访问')}</div><div class="space"></div><div class="card"><div class="hf-eyebrow">引用片段 / [1]</div><div class="quote">产品上线前，需要完成产品说明、验收清单和运营材料的准备。验收清单应覆盖关键业务路径、权限控制与异常场景。</div><p class="tiny">演示文档中的来源片段。没有真实位置数据时，不显示推测页码。</p></div>${hfSection('原文节选')}<div class="card hf-paperbody"><h2>上线准备与团队协作</h2><p>发布前，由对应负责人逐项确认准备状态。涉及对外发布的内容，需要独立审阅。</p><h3>一、产品说明</h3><p>明确目标用户、主要能力、操作流程与使用边界。</p><h3>二、验收清单</h3><p>记录主流程、异常处理、权限范围与负责人，保留验收依据。</p><h3>三、运营材料</h3><p>提供帮助文档、常见问题和用户反馈入口。</p></div><div class="grid2">${btn('下载示例文档','','','download')}${btn('基于文档提问','chat','primary')}</div>`}

document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act]');if(!el||el.disabled)return;if(el.dataset.go)go(el.dataset.go);else act(el.dataset.act,el)});

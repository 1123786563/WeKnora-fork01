case 'connect-confirm':if(!available()){closeModal();return;}val().connected=true;modal=null;render();announce('授权演示结束；真实状态需读取产品 API。');return;
case 'revoke-confirm':if(!available()){closeModal();return;}val().connected=false;modal=null;render();announce('演示连接已撤销，未操作真实 Provider。');return;
case 'star':val().starred=!val().starred;render();announce(val().starred?'已收藏此演示知识库。':'已取消收藏。');return;
case 'ask-knowledge':val().knowledge=true;val().agent='research';val().draft='根据客户反馈知识，整理本周主要问题与三个优先处理建议。';go('new');return;
case 'send':if(!available())return;if(!val().chatDraft?.trim()){announce('请先输入补充信息。');return;}if(state.scenario==='unknown'||val().run==='unknown'){announce('原请求仍在核实，补充草稿已保留。');return;}val().messages.push(val().chatDraft);val().chatDraft='';render();announce('已加入本地消息演示，未发送到服务端。');return;
case 'record':if(!available())return;val().voiceStatus='recording';render();return;
case 'transcribe':val().voiceStatus='review';val().voiceText='请整理本周客户反馈，优先列出需要处理的三个问题。';render();return;
case 'voice-to-draft':if(!available()||!val().voiceText.trim())return;val().chatDraft=val().voiceText;val().voiceStatus='idle';go('conversation');announce('文字已放入草稿。请核对后点击发送。');return;
case 'notifications':state.notifications=!state.notifications;render();announce('已更改本地演示偏好；未申请系统推送权限。');return;
case 'read-all':announce('演示动态已标为已读；未改变审批或任务状态。');return;
case 'recover':state.scenario='normal';render();announce('已恢复正常演示状态，没有重新执行任务。');return;
case 'download':{if(restricted())return;const content='# 客户反馈分析摘要\n\n> WeKnora 高保真原型演示文件；不是实际客户资料或模型结果。\n\n## 主要发现\n用户关注任务进度可见性与离开页面后的结果提醒。\n\n## 优先建议\n1. 明确登录失败原因。\n2. 区分执行中、等待审批、停止待确认。\n3. 提供可带走的任务成果。\n\n版本：demo-v1。\n';const url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='WeKnora-客户反馈分析-演示.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('已生成本地演示 Markdown 文件。');return;}
case 'sample':return;
}}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled||t.closest('[inert]'))return;if(t.dataset.go){go(t.dataset.go);return;}if(t.dataset.act){act(t.dataset.act);return;}if(t.dataset.space){setResult(WorkbenchModel.switchSpace(state,t.dataset.space));historyStack=[];return;}if(t.dataset.agent){if(t.dataset.agent==='coding'){openModal('target');return;}val().agent=t.dataset.agent;go('new');return;}if(t.dataset.target){val().target=t.dataset.target;go('new');return;}if(t.dataset.sessionFilter){filter=t.dataset.sessionFilter;render();return;}if(t.dataset.agentFilter){agentFilter=t.dataset.agentFilter;render();return;}if(t.dataset.resourceFilter){resourceFilter=t.dataset.resourceFilter;render();return;}if(t.dataset.inboxFilter){inboxFilter=t.dataset.inboxFilter;render();return;}if(t.dataset.inspect){inspect=t.dataset.inspect;document.getElementById('inspector').innerHTML=inspector();return;}});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(f){val()[f]=e.target.value;store();if(f==='voiceText'){const button=document.querySelector('#phone [data-act="voice-to-draft"]');if(button)button.disabled=!available()||!val().voiceText.trim();}}if(e.target.dataset.search){search=e.target.value;const kind=e.target.dataset.search;const target=document.getElementById(kind==='sessions'?'session-list':kind==='agents'?'agent-list':'resource-list');if(target)target.innerHTML=kind==='sessions'?sessionsList():kind==='agents'?agentsList():resourcesList();}});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const els=[...document.querySelectorAll('#phone [role="dialog"] button:not(:disabled),#phone [role="dialog"] input')];const i=els.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();els.at(-1)?.focus();}else if(!e.shiftKey&&i===els.length-1){e.preventDefault();els[0]?.focus();}}});
document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.message='';modal=null;render();});document.getElementById('mobile-pages').innerHTML=pages.map(p=>`<option value="${p.id}">${p.no} ${p.title}</option>`).join('');document.getElementById('mobile-pages').addEventListener('change',e=>go(e.target.value));
window.WorkbenchReview={pages:pages.map(({no,id,title})=>({no,id,title})),go,reset:()=>act('reset'),snapshot:()=>JSON.parse(JSON.stringify(state)),setScenario:s=>{if(['normal','offline','conflict','forbidden','unknown','loading','empty','error'].includes(s)){state.scenario=s;modal=null;state.message='';render();}},setTheme:s=>{if(['light','dark'].includes(s)){state.theme=s;render();}},setLarge:v=>{state.large=!!v;render();},setMode:m=>{if(['preview','gallery','guide'].includes(m)){mode=m;render();}}};
render();
</script></body></html>

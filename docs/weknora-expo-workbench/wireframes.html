function login(){return `<div class="authlogo"><div class="brandmark">W</div><h3>把工作带在身边</h3><p>连接你的 WeKnora 空间，随时发起任务、<br>处理审批、查看成果。</p></div><label class="field"><span>邮箱</span><input type="email" aria-label="邮箱" placeholder="you@company.com" autocomplete="off"></label><label class="field"><span>密码</span><input type="password" aria-label="密码" placeholder="输入产品账户密码" autocomplete="off"></label><div class="mt24">${btn('进入演示工作台','demo-login','primary full','arrow')}</div><div class="auth-divider">或使用企业账户</div>${btn('企业 SSO 登录','sso','secondary full','shield')}<div class="hint">原型不发送或保存账号密码。正式版使用产品认证与系统浏览器回跳，不使用 Happy token。</div><p class="legal">默认连接受信服务地址<br><button data-act="server">私有部署 · 服务器设置</button></p>`;}
function spaces(){return `<div class="hero-title">选择工作空间</div><p class="sub">资源、任务与账单按空间独立管理。</p>${['产品研发空间','个人空间'].map((s,i)=>`<button class="space-card ${state.space===s?'selected':''}" data-space="${s}"><span class="square">${ic(i?'user':'grid')}</span><span class="grow"><strong>${s}</strong><small>${i?'仅你 · 独立个人空间':'12位成员 · 演示角色：Owner'}</small></span><span class="checkmark">${state.space===s?ic('check'):''}</span></button>`).join('')}<div class="hint">切换后重新校验成员权限、关闭旧订阅，并使旧空间的迟到结果失效。服务器上的任务不会因切空间而取消。</div>`;}
function sessions(){if(emptySpace())return emptyBlock();let rows=[state.taskTitle,'整理季度项目进展','分析用户访谈要点'].filter(x=>!state.search||x.includes(state.search));return `<label class="search">${ic('search')}<input data-field="search" aria-label="搜索会话" placeholder="搜索会话" value="${esc(state.search)}"></label><div class="segmented"><span class="sel">最近</span><span>进行中</span><span>已归档</span></div><div class="sectiontitle"><h3>今天</h3><span class="muted" style="font-size:10px">${state.space}</span></div><div id="session-rows">${rows.length?rows.map((name,i)=>item(name,i===0?'通用助手 · 有一项待处理决定':i===1?'工作助手 · 最近更新 11:20':'分析助手 · 已完成','conversation',i===0?'chat':'file',i===0?'待处理':'')).join(''):'<p class="sub">没有匹配的演示会话。</p>'}</div><div class="hint">会话保留上下文，Run 记录一次任务执行。进入会话后可查看每次执行的独立状态。</div>`;}
function newTask(){return `<label class="field"><span>使用哪个助手</span><button class="selectrow" data-go="agents">${ic('bolt')}<span class="grow">${esc(state.agent)}</span>${ic('chevron','chev')}</button></label><label class="field"><span>任务描述</span><textarea data-field="prompt" aria-label="任务描述" rows="4" placeholder="描述你希望完成的工作">${esc(state.prompt)}</textarea></label><div class="chips">${btn(state.file?'需求文件.pdf · 已选择':'添加附件','attach','secondary small','paperclip')}${btn('引用知识（可选）','knowledge-select','secondary small','book')}</div><label class="field"><span>执行位置</span><button class="selectrow" data-go="targets">${ic('laptop')}<span class="grow">${esc(state.target)}</span>${ic('chevron','chev')}</button></label><label class="field"><span>本次任务预算上限</span><span class="inline-input"><input data-field="budget" type="number" min="1" max="10000" step="1" aria-label="任务预算上限" value="${esc(state.budget)}"><span class="unit">Credits</span></span><small class="caption">上限不是实际扣费；子任务共享同一预算树。</small></label><div class="hint">知识库不是必选项。提交前由服务端再次校验 Agent、资源、连接和预算权限。</div>`;}
function agents(){return `<p class="sub" style="margin-top:0">先从通用助手开始；专业助手也是同一个产品会话与执行体系。</p>${[['通用助手','检索、总结、写作和日常任务','bolt'],['知识助手','基于已授权资料回答并展示引用','book'],['工作助手','组织信息，准备业务动作与审批','tasks'],['编码助手','通过受控远程目标处理编码任务','laptop']].map(([n,t,i])=>`<button class="card card-choice full" data-agent="${n}"><div class="row"><span class="square">${ic(i)}</span><div class="grow"><strong>${n}</strong><small>${t}</small></div>${state.agent===n?ic('check'):ic('chevron','endicon')}</div></button>`).join('')}<div class="hint">这里的 Agent 名称是线框示例；真实列表由当前空间授权和部署能力返回。</div>`;}
function conversation(){return `<div class="message user"><div class="message-label">你 · 刚刚</div><div class="bubble">${esc(state.taskSubmitted?state.prompt:'整理本周客户反馈，生成一份处理建议。')}</div></div><div class="message"><div class="message-label"><span class="square small">${ic('bolt')}</span>${esc(state.agent)}</div><div class="assistant-body">${actualRun()==='unknown'?'提交回执尚未确认。我们会先核实原请求，不会重复启动任务。':'已完成初步检索，找到 12 条相关记录。主要问题集中在登录体验和任务状态提示，我会整理优先级与建议。'}</div>${actualRun()==='unknown'?btn('核实原请求','reconcile','secondary full mt16','refresh',offline()):`<div class="chips"><button class="tag outline" data-go="knowledge">${ic('book')}客户反馈知识 · 2处引用</button></div><div class="card soft"><div class="row"><strong class="small-title">执行活动</strong>${tag('检索已完成')}</div><p>读取已授权资料 → 合并反馈 → 生成摘要</p></div><div class="card"><div class="row"><strong class="small-title">${state.approval==='pending'?'需要确认一项操作':'操作决定已记录'}</strong>${ic('shield')}</div><p>${state.approval==='pending'?'准备向协作项目发布反馈摘要。请查看具体内容后决定。':state.approval==='approved'?'已记录本次批准。后续执行与费用由服务端确认。':'已拒绝该操作；不会按这项批准执行外部写入。'}</p>${btn('查看审批','go:approval','secondary small full')}</div>${item('客户反馈摘要.md','演示成果 · 版本 v1','artifact','file')}`}</div>${state.messages.map(m=>`<div class="message user"><div class="message-label">你 · 演示补充</div><div class="bubble">${esc(m)}</div></div>`).join('')}<div class="mini-meta">演示内容不连接模型。原生版使用持久事件投影，而非在消息组件中直接追加网络文本。</div>`;}
function runPage(){let run=actualRun();let statuses=run==='unknown'?['正在核实','尚未确认','等待对账']:run==='cancel_requested'?['取消已申请','停止待确认','实际消耗待结算']:run==='succeeded'?['已完成','已停止','结算处理中']:run==='reconciling'?['决定已提交','等待执行反馈','尚未最终结算']:['等待操作决定','最近在线','尚未最终结算'];return `${run==='unknown'?`<div class="alertblock">${ic('clock')}<div><strong>不确定是否已启动</strong><p>回执丢失不代表失败。请先查询原请求，避免重复执行或重复外部写入。</p></div></div>`:''}<div class="card ${run==='unknown'?'':'soft'}"><div class="row"><h3>${esc(state.taskTitle)}</h3>${tag('演示')}</div><div class="idtext mt16">${state.runID}<br>${state.request}</div><div class="hairline"></div>${kv('产品任务',statuses[0])}${kv('执行观察',statuses[1])}${kv('费用结算',statuses[2])}</div><div class="card">${kv('执行位置',state.target)}${kv('预算上限',state.budget+' Credits')}${kv('已记录消耗','38 Credits · 演示')}${kv('最后同步','14:32:08 · 演示')}</div><div class="sectiontitle"><h3>执行时间线</h3>${tag('最近快照')}</div><div class="timeline"><div class="step"><strong>任务请求已提交</strong><p>同一 request_id 用于后续核实与恢复。</p></div><div class="step ${run==='unknown'?'muted':''}"><strong>${run==='unknown'?'正在核实受理结果':'资料检索已完成'}</strong><p>${run==='unknown'?'不自动再次启动。':'使用当前空间已授权的知识资源。'}</p></div><div class="step muted"><strong>${run==='cancel_requested'?'等待停止确认':run==='unknown'?'等待确定执行状态':state.approval==='approved'?'决定已提交，等待后续执行':'等待你的操作决定'}</strong><p>任务状态、执行状态与最终结算分别更新。</p></div></div>${run==='unknown'?btn('查询原请求状态','reconcile','secondary full','refresh',offline()):run==='cancel_requested'?'<div class="hint">取消请求已记录。只有执行方确认停止后才显示已停止；实际用量仍会结算。</div>':btn('查看相关审批','go:approval','secondary full','shield')}<div class="hint">这里显示产品状态与最后观察值，不保证远程进程当前仍在线。断开手机连接不会取消服务器任务。</div>`;}
function approval(){if(state.scenario==='conflict')return `<div class="alertblock">${ic('refresh')}<div><strong>这项审批已在另一设备处理</strong><p>当前页面版本已过期。刷新后查看最新状态，不重复提交旧决定。</p></div></div><div class="card"><h3>发布客户反馈摘要</h3>${kv('当前页面版本','revision 4')}${kv('服务端版本','revision 5 · 演示')}${kv('状态','已处理')}</div>${btn('刷新审批状态','refresh-approval','secondary full mt16','refresh')}<div class="hint">这是409冲突状态示例。刷新不会自动批准，也不会再次执行写入。</div>`;return `<div class="alertblock">${ic('shield')}<div><strong>${state.approval==='pending'?'请核对完整操作':'决定已记录'}</strong><p>${state.approval==='pending'?'一次性决定，仅用于以下账号、目标与内容。':state.approval==='approved'?'本次演示批准已提交。不要把本地确认当作外部写入已完成。':'本次操作已拒绝。其他任务步骤的状态由服务端继续返回。'}</p></div></div><div class="card"><div class="card-head"><h3>发布一条项目更新</h3>${tag(state.approval==='pending'?'待决定':state.approval==='approved'?'已批准':'已拒绝')}</div>${kv('连接','项目协作 · 空间连接')}${kv('账号','project-bot（演示）')}${kv('目标','客户体验 / 本周反馈')}${kv('风险','外部写入，需要确认')}${kv('有效版本','revision 4 · 示例')}</div><div class="sectiontitle"><h3>将要发布的内容</h3></div><div class="quote">本周共整理 12 条客户反馈。建议优先改善登录失败提示与任务进度展示。完整分析见本次任务成果。</div><div class="card soft"><h3>授权边界</h3><p>仅批准本条内容，不授予长期自动发布权限，也不增加任务预算。</p></div><div class="hint">业务动作是线框演示。当前 OC 真实写入与商业能力是否可开放，仍由部署profile和真实验收证据决定。</div>`;}
function inbox(){if(emptySpace())return emptyBlock('没有新的通知','当前空间的任务与通知会显示在这里。');return `<div class="segmented"><span class="sel">全部</span><span>待处理 1</span><span>未读 2</span></div><div class="sectiontitle"><h3>需要决定</h3></div>${item('请确认发布项目更新','客户反馈摘要 · 2分钟前','approval','shield','待处理')}<div class="sectiontitle"><h3>任务进展</h3></div>${item('成果已准备好','客户反馈摘要.md · 版本 v1','artifact','file')}${item('本次任务预算提醒','预算是上限，消耗以结算为准','usage','clock')}${item('执行状态正在同步','点击读取最新快照，不自动重启','run','refresh')}<div class="hint">深链只携带最小资源引用。打开前重新登录、切空间确认并检查资源权限；不会直接批准操作。</div>`;}
function resources(){if(emptySpace())return `<div class="hero-title">构建你的工作资源</div><p class="sub">从通用助手开始，再按需添加知识或连接。</p>${item('可用 Agent','不必先创建知识库','agents','bolt')}<div class="empty"><span class="square big">${ic('folder')}</span><h3>个人空间暂无资源</h3><p>团队空间的知识、连接和成果不会在这里显示。</p></div>`;return `<div class="hero-title">随手可用的能力</div><p class="sub">只展示当前空间允许你使用的资源。</p><div class="listgroup">${item('Agents','通用与专业助手','agents','bolt','4')}${item('知识与文档','客户反馈知识 · 示例','knowledge','book','12')}${item('连接器','个人与空间连接','connector','link','1')}${item('任务成果','文件、报告与分析结果','artifact','file','8')}${item('执行目标','平台与受控远程节点','targets','laptop','2')}</div><div class="card soft"><h3>在任务里使用，而不是到处配置</h3><p>资源选择与权限检查融入任务流程；复杂管理保留在专用管理界面。</p></div>`;}
function knowledge(){return `<div class="row start"><span class="square big">${ic('book')}</span><div class="grow"><strong style="font-size:19px">客户反馈知识</strong><small>当前空间 · 已授权只读<br>索引可用 · 最后更新 14:20</small></div></div><div class="stats"><div class="stat"><strong>12</strong><span>文档 · 演示</span></div><div class="stat"><strong>2</strong><span>本次引用</span></div><div class="stat"><strong>只读</strong><span>你的权限</span></div></div><div class="sectiontitle"><h3>本次任务的引用</h3></div><div class="card"><h3>用户反馈整理 · 第3段</h3><p>用户希望在离开应用后仍可得知任务进度，并在需要授权时收到明确提示。</p>${btn('预览引用文档','preview-reference','secondary small full')}</div><div class="sectiontitle"><h3>文档</h3></div>${item('本周客户访谈.md','文本 · 已完成索引','artifact','file')}${item('问题与建议汇总.pdf','PDF · 已完成索引','artifact','file')}<div class="mt16">${btn('基于这些资料提问','ask-knowledge','primary full','chat')}</div>`;}
function connector(){return `<div class="row start"><span class="square big">${ic('link')}</span><div class="grow"><strong style="font-size:19px">项目协作</strong><small>空间连接 · 示例Provider</small><div class="chips">${tag(state.connected?'演示已连接':'已撤销',state.connected?'dark':'outline')}</div></div></div><div class="card">${kv('连接归属',state.space)}${kv('使用账号','project-bot（演示）')}${kv('凭据保管','服务端 · 客户端不可读取')}${kv('权限版本',state.connected?'v3':'v4 · 已撤销')}</div><div class="sectiontitle"><h3>动作权限</h3></div><div class="listgroup">${item('读取项目内容','按已授权资源范围执行','new','book','需授权')}<div class="listrow"><span class="square">${ic('lock')}</span><span class="grow"><strong>发布项目更新</strong><small>真实写入须通过部署与Provider门禁</small></span>${tag('受限')}</div></div><div class="hint">连接授权不等于批准所有操作。高风险写入还要核对具体内容，并通过任务预算准入。</div><div class="buttonrow">${btn(state.connected?'查看授权流程':'重新授权','connect','secondary','link')}${btn('撤销连接','revoke','secondary','lock',!state.connected||offline())}</div>`;}
function artifact(){return `<div class="row"><span class="square">${ic('file')}</span><div class="grow"><strong>客户反馈摘要.md</strong><small>v1 · 8.4KB · 来自 ${esc(state.agent)}</small></div>${tag('不可变版本')}</div><div class="doc-preview"><div class="doctype">ARTIFACT / DEMO DOCUMENT</div><h3>客户反馈分析摘要</h3><p>本周 · 12条记录 · 产品研发空间</p><div class="hairline"></div><h4>01 / 主要发现</h4><p>用户对任务进度的可见性和操作确认的清晰度有更高期待。建议优先优化异常状态与反馈。</p><h4>02 / 建议动作</h4><p>拆分任务、进程与结算状态；在弱网恢复时对账原请求；审批展示具体操作目标与内容。</p><h4>03 / 资料依据</h4><div class="previewline"></div><div class="previewline short"></div><p style="margin-top:17px">内容仅用于原型评审，不是模型实际输出。</p></div><div class="card soft">${kv('来源执行',state.runID)}${kv('访问范围','当前空间已授权成员')}${kv('版本','v1 · 只读')}</div><div class="buttonrow">${btn('系统分享','share','secondary','share')}${btn('查看来源任务','go:run','secondary','tasks')}</div><p class="caption">真实预览、下载与分享均重新授权；不暴露远程绝对路径。</p>`;}
function targets(){return `<p class="sub" style="margin-top:0">目标由平台授权与能力探针决定。这里不是任意远程地址输入框。</p>${[['平台执行','通用Agent · 不需要远程机器','演示可用','bolt'],['托管编码节点','工作目录：项目工作区 / 受控引用','演示可用','laptop'],['我的个人节点','上次在线：昨天 · 当前不可观察','离线','laptop']].map(([t,d,b,i],idx)=>`<button class="card card-choice full" data-target="${t}" ${idx===2?'disabled':''}><div class="card-head"><span class="square">${ic(i)}</span>${tag(b,idx===2?'':'outline')}</div><h3>${t}</h3><p>${d}</p><div class="chips">${tag(idx===0?'平台驱动':'Paseo profile')}${state.target===t?tag('已选择','dark'):''}</div></button>`).join('')}<div class="hint">演示在线不代表仓库已完成真实节点验收。create / observe / events / cancel 的必要能力全部通过后，才可准入。</div>`;}
function voice(){let text=state.voiceText;return `<div class="center"><div class="tag outline">${text?'转写已生成 · 请编辑确认':'按下按钮模拟录音'}</div><div class="voice-visual">${[12,24,36,20,46,64,40,76,48,92,61,104,64,84,41,68,36,48,28,39,20,12].map(h=>`<i style="--h:${h}px"></i>`).join('')}</div><button class="recordbutton" data-act="record" aria-label="模拟录音与转写">${ic(text?'refresh':'mic')}</button><p class="sub">${text?'先确认你想说的话，再提交任务。':'这是交互演示，不调用设备麦克风。'}</p></div><label class="field"><span>转写文本（可编辑）</span><textarea data-field="voiceText" aria-label="转写文本" rows="4" placeholder="点击上方麦克风生成模拟转写">${esc(text)}</textarea></label><div class="hint">结束录音不会取消服务器任务。实时语音中的停止播报、结束会话和取消任务必须分别处理。</div>`;}
function profile(){return `<div class="row"><div class="avatar" style="width:58px;height:58px;font-size:23px">演</div><div class="grow"><strong style="font-size:19px">演示成员</strong><small>member@example.invalid<br>当前空间：${esc(state.space)}</small></div></div><div class="listgroup">${item('切换工作空间','当前角色：Owner（演示）','spaces','grid')}${item('空间用量与权益','只显示获准查看的当前空间账务','usage','clock')}<button class="listrow" data-act="toggle-notifications"><span class="square">${ic('bell')}</span><span class="grow"><strong>任务通知</strong><small>拒绝推送也不影响任务执行</small></span><span class="toggle ${state.notices?'on':''}" role="switch" aria-checked="${state.notices}" aria-label="任务通知"></span></button><button class="listrow" data-act="privacy"><span class="square">${ic('lock')}</span><span class="grow"><strong>隐私与本地缓存</strong><small>凭证与敏感数据分开管理</small></span>${ic('chevron','endicon')}</button></div><div class="card soft"><h3>同一个产品身份，不同执行能力</h3><p>不需要额外 Happy 账户；通用助手、知识问答与远程编码遵守同一空间授权。</p></div><div class="mt24">${btn('退出演示账户','logout','secondary full')}</div><p class="legal">WeKnora Mobile · Expo 设计方案<br>本页功能与数据均为演示</p>`;}
function usage(){return `<div class="card soft" style="margin-top:0"><div class="row"><h3>${esc(state.space)}</h3>${tag('模拟账务')}</div><p>当前空间可用额度</p><div class="amount">1,200 <small>Credits</small></div><div class="hairline"></div>${kv('已结算消耗','340 Credits · 示例')}${kv('当前预占','100 Credits · 示例')}${kv('账单权限','Owner · 演示')}</div><div class="sectiontitle"><h3>最近任务费用</h3></div><div class="card"><h3>${esc(state.taskTitle)}</h3>${kv('任务预算上限',state.budget+' Credits')}${kv('已记录消耗','38 Credits · 非最终值')}${kv('结算状态','处理中')}<p>等待可信用量与结算完成后更新，不由手机计算最终费用。</p></div><div class="hint">空间独立付费。预算授权、预占、实际消耗和最终结算是不同概念；BYOK也不自动免除平台资源费用。</div><div class="card"><h3>购买与充值单独设计</h3><p>本线框不提供真实支付或外部购买跳转。商店支付、地区与账户权限须单独完成规格和合规核对。</p></div>`;}
const renderers={login,spaces,home,sessions,new:newTask,agents,conversation,run:runPage,approval,inbox,resources,knowledge,connector,artifact,targets,voice,profile,usage};
function footer(page){if(page==='new')return `<div class="footeraction">${btn('提交任务','submit-task','primary full','arrow',offline()||noPermission())}<p class="caption center">在 ${esc(state.space)} 中执行 · 知识可选</p></div>`;if(page==='conversation')return `<div class="composer">${state.file?'<div class="tag">需求文件.pdf · 演示附件</div>':''}<textarea aria-label="补充任务信息" data-field="draft" placeholder="补充信息，或继续这项工作…">${esc(state.draft)}</textarea><div class="composer-tools"><div class="left"><button class="iconbutton" data-act="attach" aria-label="添加附件">${ic('paperclip')}</button><button class="iconbutton" data-go="voice" aria-label="语音输入">${ic('mic')}</button></div>${btn('发送','send-message','primary','send',offline()||noPermission())}</div></div>`;if(page==='approval'&&state.approval==='pending'&&state.scenario!=='conflict'&&!noPermission()&&!emptySpace())return `<div class="footeraction"><div class="buttonrow" style="margin-top:0">${btn('拒绝','reject','secondary','',offline())}${btn('批准一次','approve','primary','shield',offline())}</div><p class="caption center">仅对当前目标与内容作出决定</p></div>`;if(page==='voice')return `<div class="footeraction">${btn('确认文字并发送','send-voice','primary full','send',!state.voiceText.trim()||offline()||noPermission())}</div>`;if(page==='run'&&actualRun()!=='unknown'&&actualRun()!=='cancel_requested'&&!noPermission()&&!emptySpace())return `<div class="footeraction">${btn('申请取消任务','cancel-run','secondary full','stop',offline())}</div>`;return '';}
function bodyFor(page){let restricted=['conversation','run','approval','knowledge','connector','artifact','usage'];if((noPermission()||emptySpace())&&restricted.includes(page))return locked();return renderers[page]();}
function phoneContent(page,withOverlay=false){let restricted=(noPermission()||emptySpace())&&['conversation','run','approval','knowledge','connector','artifact','usage'].includes(page);return `<div class="statusbar"><span>9:41</span><span class="signal">▴▴▴ ${ic('wifi').replace('<svg','<svg style="width:12px;height:12px"')}<i class="battery"></i></span></div>${apphead(page)}${notice(page)}<div class="app-scroll ${['conversation','sessions'].includes(page)?'tight':''}">${bodyFor(page)}</div>${restricted?'':footer(page)}${tabs(page)}<div class="homebar"></div>${withOverlay&&state.modal?modal():''}${withOverlay&&state.toast?`<div class="toast" role="status"><button data-act="clear-toast" aria-label="关闭提示">×</button>${esc(state.toast)}</div>`:''}`;}
function modal(){let m=state.modal;let cfg={approve:['确认批准这项操作？','仅批准向“客户体验 / 本周反馈”发布页面所列摘要。不会授予长期权限，也不会提高任务预算。','确认批准','confirm-approve'],reject:['拒绝这项操作？','拒绝只影响这项具体动作。其他步骤、已经发生的外部副作用与实际消耗仍以服务端状态为准。','确认拒绝','confirm-reject'],cancel:['申请取消任务？','服务器收到请求后会尝试停止执行。手机显示的是“停止待确认”，不是操作回滚或自动退款。','申请取消','confirm-cancel'],revoke:['撤销这个连接？','后续使用将重新校验权限；客户端不会直接删除私网 Provider 凭据，也不会将空授权列表当作禁止全部。','确认撤销','confirm-revoke'],connect:['通过系统浏览器授权','正式应用打开服务端生成的受信授权链接，回跳后查询产品连接状态。当前只演示流程，不连接外部 Provider。','完成授权演示','confirm-connect'],sso:['企业单点登录','正式版用系统浏览器、PKCE、state和一次性code交换产品身份。这里不会收集或发送任何账号密码。','继续演示','demo-login'],server:['私有部署服务器','正式版只接受用户明确选择的受信HTTPS服务。不能从一条未知深链静默更换服务器或泄露已有凭证。','关闭','close-modal'],share:['系统分享与下载','真实实现先重新鉴权，再获得短期文件访问。此原型没有真实产物文件，也不会把私有内容发送到其他应用。','关闭','close-modal'],privacy:['本地数据边界','凭证与本地加密密钥进入SecureStore；事件缓存/草稿按origin、用户、空间隔离。退出时按策略清理，不清除别人的数据。','关闭','close-modal'],reference:['安全文档预览','引用只展示当前有权读取的文档片段。复杂可执行HTML应隔离或转为静态预览，不携带产品登录态。','查看示例成果','reference-open'],knowledge:['为本次任务选用知识','知识引用是可选资源。这里将客户反馈知识作为演示选择；真实实现再次校验空间权限和可检索状态。','使用这项知识','confirm-knowledge']}[m];if(!cfg)return '';return `<div class="modal-overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(cfg[0])}"><div class="sheethandle"></div><h3>${esc(cfg[0])}</h3><p>${esc(cfg[1])}</p><div class="buttonrow">${btn('返回','close-modal','secondary')}${btn(cfg[2],cfg[3],'primary')}</div></section></div>`;}
function render(){const p=getPage(state.page);document.getElementById('scenario').value=state.scenario;document.getElementById('page-select').value=state.page;document.getElementById('screen-title').textContent=p.n+' / '+p.title;document.getElementById('sidenav').innerHTML=pages.map(x=>`<button type="button" class="navitem ${state.page===x.id?'active':''}" data-go="${x.id}" aria-current="${state.page===x.id?'page':'false'}"><span class="num">${x.n}</span>${x.title}</button>`).join('');document.getElementById('phone').innerHTML=phoneContent(state.page,true);document.getElementById('notes').innerHTML=`<div class="eyebrow">${p.n} / DESIGN NOTE</div><h2>${p.title}</h2><span class="annotation-badge">${p.task}</span><div class="notesection"><h3>页面意图</h3><p>${esc(p.subtitle)}</p></div><div class="notesection"><h3>可体验的交互</h3><p>${esc(p.interaction)}</p></div><div class="notesection"><h3>数据与实现接缝</h3><p>${esc(p.api)}</p></div><div class="notesection"><h3>不能忽略的边界</h3><p>${esc(p.rule)}</p></div><div class="notesection"><p>本轮只交付设计。所有原型内容为模拟数据，不是当前仓库功能可用性证明。</p></div>`;document.getElementById('layout').hidden=state.board;document.getElementById('gallery').hidden=!state.board;if(state.board)document.getElementById('gallery').innerHTML=pages.map(x=>`<article class="gallery-card"><header><h3>${x.n} · ${x.title}</h3><button data-go="${x.id}">打开页面</button></header><div class="miniwrap" inert><div class="phone">${phoneContent(x.id)}</div></div></article>`).join('');document.querySelector('[data-act="gallery"]').textContent=state.board?'单屏评审':'全部页面';if(state.modal){const modalNode=document.querySelector('#phone [role="dialog"]');modalNode?.querySelector('button')?.focus();}}
function go(id){if(!pages.some(p=>p.id===id))return;state.page=id;state.board=false;state.modal=null;state.toast='';render();}
function toast(t){state.toast=t;render();}
function action(a){
 switch(a){
 case 'gallery':state.board=!state.board;state.modal=null;render();return;
 case 'reset':state=initial();render();return;
 case 'back':go(({spaces:'profile',new:'home',agents:'new',conversation:'sessions',run:'conversation',approval:'run',inbox:'home',knowledge:'resources',connector:'resources',artifact:'conversation',targets:'new',voice:'conversation',usage:'profile'})[state.page]||'home');return;
 case 'demo-login':state.modal=null;go('spaces');return;
 case 'logout':state=initial();state.page='login';render();return;
 case 'sso':case 'server':case 'share':case 'privacy':case 'connect':case 'revoke':state.modal=a;render();return;
 case 'clear-toast':state.toast='';render();return;
 case 'close-modal':state.modal=null;render();return;
 case 'attach':if(offline())return toast('离线时只保留选择意图，恢复后确认上传。');state.file=true;toast('已选择演示文件。真实上传由 nativeFile 端口完成，此处不读取设备文件。');return;
 case 'knowledge-select':state.modal='knowledge';render();return;
 case 'confirm-knowledge':state.modal=null;toast('已为任务选择客户反馈知识（演示）；服务端仍会重新校验权限。');return;
 case 'submit-task':if(offline()||noPermission())return toast('当前不可提交，草稿已留在演示表单。');if(!state.prompt.trim())return toast('请填写任务描述。');if(!Number.isSafeInteger(Number(state.budget))||Number(state.budget)<=0)return toast('预算上限应为正整数。');if(actualRun()==='unknown'&&state.taskSubmitted){go('run');return;}state.taskSubmitted=true;state.taskTitle=state.prompt.trim().slice(0,17);state.requestCount+=1;state.request='demo-request-'+String(state.requestCount).padStart(3,'0');state.runID='demo-run-'+String(17+state.requestCount).padStart(3,'0');state.run=state.scenario==='unknown'?'unknown':'waiting_user';state.approval='pending';state.messages=[];go(state.scenario==='unknown'?'run':'conversation');return;
 case 'send-message':if(offline()||noPermission())return;if(!state.draft.trim())return toast('请先输入要补充的信息。');if(actualRun()==='unknown')return toast('原请求仍在核实，补充草稿保留。');state.messages.push(state.draft);state.draft='';toast('已展示本地消息演示；正式版由服务端创建或接收合法的补充指令。');return;
 case 'approve':case 'reject':if(offline()||noPermission())return;state.modal=a;render();return;
 case 'confirm-approve':state.modal=null;state.approval='approved';state.run='reconciling';toast('演示决定已记录。真正的执行结果必须等待服务端返回，不能据此判断外部写入成功。');return;
 case 'confirm-reject':state.modal=null;state.approval='rejected';toast('演示已拒绝具体操作，不会自动重发。');return;
 case 'refresh-approval':state.scenario='normal';state.approval='approved';toast('已加载“另一设备已处理”的演示状态，没有再次提交审批。');return;
 case 'cancel-run':if(offline())return;state.modal='cancel';render();return;
 case 'confirm-cancel':state.modal=null;state.run='cancel_requested';toast('演示：停止请求已提交，等待执行方确认；实际消耗仍需结算。');return;
 case 'reconcile':if(offline())return;state.scenario='normal';state.run='waiting_user';toast('演示已找到原 Run，继续使用 '+state.request+'，未创建新请求。');return;
 case 'confirm-revoke':state.modal=null;state.connected=false;toast('演示已撤销连接，后续使用需要重新授权。');return;
 case 'confirm-connect':state.modal=null;state.connected=true;toast('授权流程演示结束；真实 Provider 状态需从产品 API 读取。');return;
 case 'preview-reference':state.modal='reference';render();return;
 case 'reference-open':go('artifact');return;
 case 'ask-knowledge':state.prompt='根据客户反馈知识，总结本周主要问题并给出处理建议。';state.agent='知识助手';go('new');return;
 case 'record':state.voiceText='请整理本周客户反馈，优先列出需要处理的三个问题。';render();return;
 case 'send-voice':if(offline()||noPermission()||!state.voiceText.trim())return;state.messages.push(state.voiceText);state.voiceText='';go('conversation');toast('已将确认后的文字放入会话演示；不是未经确认的录音自动提交。');return;
 case 'toggle-notifications':state.notices=!state.notices;toast(state.notices?'已开启演示通知偏好。':'已关闭演示通知偏好，任务不会因此停止。');return;
 }
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;if(t.dataset.go){go(t.dataset.go);return;}if(t.dataset.act){action(t.dataset.act);return;}if(t.dataset.space){let next=t.dataset.space;state=initial();state.space=next;state.page='home';render();return;}if(t.dataset.agent){state.agent=t.dataset.agent;go('new');return;}if(t.dataset.target){state.target=t.dataset.target;go('new');return;}});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(f&&Object.prototype.hasOwnProperty.call(state,f)){state[f]=e.target.value;if(f==='voiceText'){const b=document.querySelector('#phone [data-act="send-voice"]');if(b)b.disabled=!state.voiceText.trim()||offline()||noPermission();}if(f==='search'){const rows=[state.taskTitle,'整理季度项目进展','分析用户访谈要点'].filter(x=>!state.search||x.includes(state.search));let wrap=document.getElementById('session-rows');if(wrap)wrap.innerHTML=rows.length?rows.map(n=>item(n,'当前空间 · 演示会话','conversation','chat')).join(''):'<p class="sub">没有匹配的演示会话。</p>';}}});
document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.modal=null;state.toast='';render();});
document.getElementById('page-select').addEventListener('change',e=>go(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}if(e.key==='Tab'&&state.modal){const nodes=[...document.querySelectorAll('#phone [role="dialog"] button')];const i=nodes.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();nodes.at(-1)?.focus();}else if(!e.shiftKey&&i===nodes.length-1){e.preventDefault();nodes[0]?.focus();}}});
document.getElementById('page-select').innerHTML=pages.map(p=>`<option value="${p.id}">${p.n} · ${p.title}</option>`).join('');
const params=new URLSearchParams(location.search);if(params.get('page')&&pages.some(p=>p.id===params.get('page')))state.page=params.get('page');if(params.get('board')==='1')state.board=true;
window.WireframeReview={go,reset:()=>{state=initial();render();},snapshot:()=>JSON.parse(JSON.stringify(state)),pages:pages.map(({id,n,title})=>({id,n,title})),setScenario:s=>{if(['normal','offline','conflict','forbidden','unknown'].includes(s)){state.scenario=s;render();}}};
render();
</script>
</body>
</html>

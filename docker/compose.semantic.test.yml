# Isolated semantic integration-test environment (O01).
# Ports FIXED for tests: PG 15432, Neo4j 17687 - never published to the
# public internet; the service talks to them over the compose network.
services:
  semantic-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: semantic
      POSTGRES_PASSWORD: semantic
      POSTGRES_DB: semantic_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantic -d semantic_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  semantic-neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/semantica-test
    ports:
      - "127.0.0.1:17687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  semantic-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.semantic
    depends_on:
      semantic-pg:
        condition: service_healthy
    environment:
      SEMANTIC_ADDRESS: "0.0.0.0:50051"
      SEMANTIC_INTERNAL_TOKEN: "test-internal-token"
      SEMANTIC_ALLOW_PLAINTEXT: "true"
      SEMANTIC_QUERY_DSN: "postgresql://semantic:semantic@semantic-pg:5432/semantic_test"
    ports:
      - "127.0.0.1:15051:50051"
    # Readiness (not liveness): migrations + stores + barrier sync.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:50052/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 30

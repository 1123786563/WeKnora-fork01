  "overflow_semantics": {
    "rule": "an outline over 30 pages renders only the first 30; the page numbers beyond the cap are recorded in overflow_pages (e.g. a 31-page outline records [31]) with pages=failed and the manifest stays not-ready (SlidesReady returns false while overflow_pages is non-empty) so the main agent must split or trim",

    "page_export": "pdftocairo -svg -f N -l N report.pdf pages/page-N.svg — poppler's SVG output is SINGLE-PAGE, so a per-page loop is mandatory (a plain 'pdftocairo -svg deck.pdf prefix' silently writes only page 1)",

    "min_font_pt": 12,
    "conversion_budget": "timeout -k 5 180 soffice ...; a conversion killed by the budget exits >=124 (verified: timeout -k 1 0.2 -> rc 124 when TERM lands first, rc 137 when the SIGKILL escalation fires — both are budget kills, D03 review N2 wording) and MUST be recorded as check render=failed with no output shipped (verified: no report.pdf produced)"

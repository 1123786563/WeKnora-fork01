# 合法契约 fixture：capability-port 与 route-set 各一条，故意倒序。
contracts:
  - id: workbench-task-port
    owner: workbench
    kind: capability-port
    symbol: TaskService
    signature: "CreateTask(ctx context.Context, req CreateTaskRequest) (Task, error)"
    stability: frozen
    consumers:
      - internal/insights/service/scan.go
    characterization_tests:
      - internal/workbench/service/task_test.go
  - id: conversation-route-set
    owner: conversation
    kind: route-set
    symbol: internal/conversation/routes.go
    signature: ""
    stability: frozen
    consumers: []
    characterization_tests: []
    items:
      - "POST /api/v1/session/chat"
      - "GET /api/v1/session/messages"

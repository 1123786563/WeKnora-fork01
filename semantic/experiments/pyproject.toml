[project]
name = "semantica-v01-experiments"
version = "0.1.0"
description = "Frozen, minimal Semantica 0.6.8 import-contract experiment"
requires-python = "==3.12.12"
dependencies = [
    "networkx==3.2.1",
    "neo4j==5.28.2",
    "numpy==2.0.2",
    "pandas==2.2.3",
    "pydantic==2.13.4",
    "pytest==8.4.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.2",
    "rdflib==7.1.4",
    "requests==2.32.5",
    "scipy==1.13.1",
    "semantica==0.6.8",
]

[tool.uv]
# This is intentionally a minimal import-contract profile, not Semantica's
# default installation.  The official 0.6.8 metadata lists a broad ML and
# integration stack.  We replace its dependency metadata only for this isolated
# probe, then lock the imports actually needed by the V01 public API contract.
dependency-metadata = [
    { name = "semantica", version = "0.6.8", requires-dist = [] },
]

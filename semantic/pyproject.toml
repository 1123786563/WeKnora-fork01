# WeKnora Semantica semantic service - production Python package.
# C01 establishes the package layout and the verified gRPC contract stack.
# The upstream semantica dependency (frozen by V01 as semantica==0.6.8)
# enters this lock at the first task whose production code imports it (I03),
# keeping the C01 lock lean and the contract layer independent.
[project]
name = "semantic_service"
version = "0.1.0"
description = "WeKnora Semantica semantic knowledge service (Python side)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio==1.80.0",
    "grpcio-health-checking==1.80.0",
    "psycopg[binary]==3.2.9",
    "protobuf>=6.33,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "grpcio-tools==1.80.0",
    "trustme==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_service"]

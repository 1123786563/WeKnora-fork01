// WeKnora Semantica wire contract - the ONLY schema shared between the Go
// business system and the Python semantic service (spec section 7).
//
// Tag discipline (C01): field numbers are immutable once released; deleted
// fields must be reserved, never renumbered. Optional scalars distinguish
// "absent" from zero values (spans, manifest_ref, timestamps, error codes).
// 64-bit integers stay uint64 on the wire; JSON public boundaries encode
// them as decimal strings.
syntax = "proto3";

package weknora.semantic.v1;

option go_package = "github.com/Tencent/WeKnora/semantic/proto;semanticpb";

// ---------------------------------------------------------------------------
// Shared envelope
// ---------------------------------------------------------------------------

message RequestHeader {
  string request_id = 1;
  string trace_id = 2;
}

// ---------------------------------------------------------------------------
// Scope and document identity
// ---------------------------------------------------------------------------

message ScopeKey {
  uint64 tenant_id = 1;
  string kb_id = 2;
}

message DocumentRevision {
  ScopeKey scope = 1;
  string document_id = 2;
  uint64 revision = 3;
  string content_hash = 4;
  bool deleted = 5;
}

message ChunkSnapshot {
  string chunk_id = 1;
  string text = 2;
  string content_hash = 3;
}

message IndexConfig {
  string config_digest = 1;
  string engine_version = 2;
  string model_profile_ref = 3;
  string prompt_version = 4;
  string rule_set_version = 5;
  string schema_version = 6;
}

message ApplyRequest {
  DocumentRevision document = 1;
  repeated ChunkSnapshot chunks = 2;
  optional string manifest_ref = 3;
  IndexConfig config = 4;
  string idempotency_key = 5;
  string payload_hash = 6;
}

message Operation {
  enum State {
    OPERATION_STATE_UNSPECIFIED = 0;
    OPERATION_STATE_ACCEPTED = 1;
    OPERATION_STATE_RUNNING = 2;
    OPERATION_STATE_STAGED = 3;
    OPERATION_STATE_PUBLISHING = 4;
    OPERATION_STATE_SUCCEEDED = 5;
    OPERATION_STATE_FAILED = 6;
    OPERATION_STATE_CANCELLED = 7;
    OPERATION_STATE_SUPERSEDED = 8;
  }
  string operation_id = 1;
  ScopeKey scope = 2;
  string document_id = 3;
  uint64 revision = 4;
  State state = 5;
  string stage = 6;
  uint64 lease_token = 7;
  optional string result_generation = 8;
  optional string error_code = 9;
}

// ---------------------------------------------------------------------------
// Facts and evidence
// ---------------------------------------------------------------------------

message Evidence {
  string evidence_id = 1;
  string document_id = 2;
  uint64 revision = 3;
  string chunk_id = 4;
  string content_hash = 5;
  string quote = 6;
  optional uint32 start_char = 7;
  optional uint32 end_char = 8;
  // Q01: assertions this evidence item supports (source protocol).
  repeated string assertion_ids = 9;
}

message Assertion {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SOURCE = 1;
    KIND_RULE = 2;
    KIND_MODEL = 3;
  }
  string assertion_id = 1;
  ScopeKey scope = 2;
  string subject_id = 3;
  string predicate = 4;
  optional string object_id = 5;
  optional string value = 6;
  Kind kind = 7;
  repeated string evidence_ids = 8;
  repeated string premise_ids = 9;
  optional string valid_from = 10;
  optional string valid_until = 11;
}

// ---------------------------------------------------------------------------
// Authorization and queries
// ---------------------------------------------------------------------------

message AccessScope {
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    PURPOSE_SEARCH = 1;
    PURPOSE_REASON = 2;
    PURPOSE_INDEX = 3;
  }
  ScopeKey scope = 1;
  string subject_id = 2;
  string scope_ref = 3;
  string scope_hash = 4;
  uint64 permission_epoch = 5;
  string expires_at = 6;
  string audience = 7;
  Purpose purpose = 8;
  string budget_ref = 9;
  // Q01: the resolved allowed document set for this search. The business
  // side (Go) resolves the A01 scope snapshot and forwards it; the
  // service never expands the set on its own.
  repeated string allowed_document_ids = 10;
}

message QueryLimits {
  uint32 max_hops = 1;
  uint32 max_nodes = 2;
  uint32 max_edges = 3;
  uint32 top_k = 4;
  uint32 max_tokens = 5;
  uint32 deadline_ms = 6;
  // Q01 addition: appended AFTER the released fields - never renumber.
  uint32 max_evidence = 7;
}

message SearchRequest {
  RequestHeader header = 1;
  string query_id = 2;
  string query = 3;
  AccessScope access_scope = 4;
  QueryLimits limits = 5;
  string mode = 6;
}

message SearchResponse {
  message Path {
    repeated string nodes = 1;
  }
  string query_id = 1;
  string generation = 2;
  string mode = 3;
  repeated Evidence evidence = 4;
  repeated string assertion_ids = 5;
  repeated Path paths = 6;
  bool stale = 7;
  bool partial = 8;
  bool truncated = 9;
}

// Header precedence: on ReasonRequest the OUTER header is authoritative;
// the nested search.header must stay unset (the mapping layer never sets
// both). Receivers that observe both MUST use the outer one and reject on
// conflicting values.
message ReasonRequest {
  enum ReasoningMode {
    REASONING_MODE_UNSPECIFIED = 0;
    REASONING_MODE_RULES = 1;
    REASONING_MODE_MODEL = 2;
  }
  RequestHeader header = 1;
  SearchRequest search = 2;
  ReasoningMode reasoning_mode = 3;
  string rule_set_version = 4;
}

message ReasonResponse {
  enum ConclusionKind {
    CONCLUSION_KIND_UNSPECIFIED = 0;
    CONCLUSION_KIND_RULE = 1;
    CONCLUSION_KIND_MODEL = 2;
  }
  SearchResponse retrieval = 1;
  string status = 2;
  string conclusion = 3;
  ConclusionKind conclusion_kind = 4;
  repeated string premise_ids = 5;
  repeated string rule_ids = 6;
  optional string model_version = 7;
  optional string prompt_version = 8;
  repeated string limitations = 9;
}

// ---------------------------------------------------------------------------
// Capabilities and RPC envelopes
// ---------------------------------------------------------------------------

// Capability negotiation failure behavior (spec section 7): if
// GetCapabilities fails, times out, or reports an unsupported
// protocol_version, callers MUST treat EVERY mode as unavailable (fail
// closed) - never assume success. A mode with available=false carries the
// concrete unavailable_reason; callers must not work around it by widening
// scope or switching backends.
message Capability {
  string mode = 1;
  bool available = 2;
  string unavailable_reason = 3;
}

message GetCapabilitiesRequest {
  RequestHeader header = 1;
}

message GetCapabilitiesResponse {
  string protocol_version = 1;
  string engine_version = 2;
  repeated Capability capabilities = 3;
  QueryLimits default_limits = 4;
}

message ApplyDocumentRevisionRequest {
  RequestHeader header = 1;
  ApplyRequest apply = 2;
}

message DeleteDocumentRequest {
  RequestHeader header = 1;
  DocumentRevision document = 2;
}

message GetOperationRequest {
  RequestHeader header = 1;
  ScopeKey scope = 2;
  string operation_id = 3;
}

message CancelOperationRequest {
  RequestHeader header = 1;
  ScopeKey scope = 2;
  string operation_id = 3;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service Semantic {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc ApplyDocumentRevision(ApplyDocumentRevisionRequest) returns (Operation);
  rpc DeleteDocument(DeleteDocumentRequest) returns (Operation);
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc CancelOperation(CancelOperationRequest) returns (Operation);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Reason(ReasonRequest) returns (ReasonResponse);
}

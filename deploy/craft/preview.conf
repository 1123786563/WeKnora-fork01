# =============================================================================
# WeKnora Craft — W02 独立 origin 受控预览（preview origin, controlled preview）
# =============================================================================
#
# 本文件只服务受控预览：不可变静态 HTML/CSS/JS 及其相对资源，全部来自已发布版本
# 清单（/p/<opaque-capability>/<version-relative-file>）。它不是通用静态站，也绝不
# 反代模型给出的任意端口/URL —— 需要后端的内部应用在应用层（Go 侧）即返回
# “不支持此预览类型”（craft.ErrUnsupported）。
#
# ── 凭据策略（Host-only）──────────────────────────────────────────────────
#   * 主站会话 Cookie 是 Host-only（仅 app origin），浏览器天然不会带到预览源；
#     本配置再加一道硬边界：转发到后端的请求剥掉 Cookie 与 Authorization，并隐藏
#     任何 Set-Cookie 响应头。预览源上没有任何可持久化的凭据。
#   * 预览的授权即 URL 中的 opaque capability：256bit 随机、默认 5min 过期、服务端
#     仅存摘要、票据一次性兑换。应用层（internal/handler/session/craft_preview.go）
#     从不读取 Cookie/Authorization。
#
# ── 多实例约束（重要）─────────────────────────────────────────────────────
#   ticket/capability 的 grant 表在应用进程内存中（不落库，by design）。APP_UPSTREAM
#   若是多实例，必须把同一客户端（同 ticket 兑换后的后续能力读取）粘滞到同一实例，
#   例如 ip_hash 或等价的会话粘滞；否则兑换与后续读取落在不同实例会 404。单实例
#   或未来把 grant 表外置共享存储后无此约束。
#
# ── CSP 分工 ───────────────────────────────────────────────────────────────
#   CSP 不在本层下发：Go 侧对每个预览响应逐条下发完整 CSP（connect-src 'none'、
#   worker-src 'none' 禁 ServiceWorker、资源仅本预览源、frame-ancestors 仅主站
#   origin）。nginx 若再 add_header 一条 CSP，两条会被浏览器同时执行（取交集），
#   极易出现意外收紧/放开的组合，故本文件只做 HSTS/nosniff/no-referrer/no-store
#   兜底。
#
# ── W06 iframe sandbox 要求（嵌入侧，主站页面负责）────────────────────────
#   <iframe sandbox="allow-scripts"> —— 允许脚本运行；不得加 allow-same-origin、
#   allow-top-navigation、allow-popups、allow-forms、allow-modals。浏览器行为
#   （脚本访问 parent/cookie 失败、外联被 CSP 阻断、相对 CSS/图片/JS 可加载）由
#   W06 验证。
#
# ── 状态码语义 ─────────────────────────────────────────────────────────────
#   * 过期/未知能力：由 Go 侧一律 404（绝不确认某个能力曾经存在）；
#   * 本源上 /p/ 之外的任何路径（含生成页面里的根绝对引用如 /style.css）404，
#     无法绕过版本前缀；
#   * 明文 HTTP 端口一律 410 Gone：预览 origin 必须是 https。
#
# ── 使用方式 ───────────────────────────────────────────────────────────────
#   本文件是可独立 nginx -t 验证的最小完整配置（含 events/http 包裹）。部署时替换
#   占位符 PREVIEW_HOSTNAME、证书路径、APP_UPSTREAM；若并入主 nginx.conf，把两个
#   server 块摘入其 http{} 内即可。
# =============================================================================

events {
}

http {
    # ---------------------------------------------------------------------
    # 预览 origin（HTTPS）
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name PREVIEW_HOSTNAME;               # 例：preview.example.com

        ssl_certificate     /etc/nginx/certs/preview/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/preview/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ticket 与 capability 是 bearer 秘密：绝不落访问日志（Go 侧同样不记）。
        access_log off;

        # --- 兜底安全头（CSP 由 Go 侧逐响应下发，见文件头注释）-------------
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, no-store" always;

        # --- 凭据硬边界：不接收、不转发、不设置任何主站凭据 -----------------
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;

        # --- 仅 /p/ 前缀存在，且只允许 GET/HEAD ----------------------------
        # 拒绝二次解码绕过：Go 侧已拒绝任何仍含百分号编码的文件路径；本层只转发
        # 原始路径，不做归一化改写。
        location /p/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://APP_UPSTREAM;          # 例：127.0.0.1:8080
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_request_body off;
        }

        # 版本前缀之外的任何路径（含根绝对引用与站点根 ServiceWorker 注册尝试）
        # 无路由：直接 404。
        location / {
            return 404;
        }
    }

    # ---------------------------------------------------------------------
    # 明文端口一律拒绝（410 Gone）：预览 origin 必须是 https，
    # PreviewOriginAllowed 只接受 https 的隔离 origin。
    # ---------------------------------------------------------------------
    server {
        listen 80;
        server_name PREVIEW_HOSTNAME;
        access_log off;
        return 410;
    }
}

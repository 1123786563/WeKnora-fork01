# MX-034 核心链编排（实测版 2026-09-18 第六轮：按 Android/iOS 真实 UI 文案重写）
# 链路：M01 登录（auth/LoginScreen，英文文案）→ 根 gate 索引重定向 → M03 产品壳（HomeScreen，中文）→ 四 Tab。
# 凭据经环境变量注入（E2E_EMAIL / E2E_PASSWORD / E2E_WEKNORA_ORIGIN，见 native-e2e.md），不写入本文件。
# 运行：Maestro test <此文件> --platform android（iOS 同 appId）
appId:
  ios: com.weknora.mobile
  android: com.weknora.mobile
name: core-chain
tags: [core-flow]
---
# 冷启动：已配置 host 时直达 M01；首次冷启动先连接 server（server.tsx 英文文案）
- runFlow:
    when:
      visible: "WeKnora server"
    commands:
      - tapOn:
          text: "WeKnora server address"
      - inputText: ${E2E_WEKNORA_ORIGIN}
      - hideKeyboard
      - tapOn: "Continue"

# M01 登录屏（auth/LoginScreen：标题 "Sign in"、输入框 label Email/Password、按钮 "Sign in"）
- assertVisible: "Sign in"
- screenshot: M01_login
- tapOn:
    text: "Email"
- inputText: ${E2E_EMAIL}
- tapOn:
    text: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
# 标题 Text "Sign in"（index 0）与按钮 Text "Sign in"（index 1）同名，按钮取 index 1
- tapOn:
    text: "Sign in"
    index: 1

# gate：认证成功 → 索引重定向 → /(app)/product（M03 HomeScreen，中文「工作台」）
- extendedRunUntil:
    commands:
      - screenshot: M01_after_login
    condition:
      visible: "工作台"
    timeout: 30000

# M03 工作台 + 四 Tab 壳（PRODUCT_TABS：工作台/会话/资源/我的）
- assertVisible: "会话"
- assertVisible: "资源"
- assertVisible: "我的"
- screenshot: M03_workbench

# 会话 Tab（当前诚实空态：「会话页面建设中」）
- tapOn: "会话"
- extendedRunUntil:
    commands:
      - screenshot: M04_sessions_tab
    condition:
      visible: ".*会话.*"
    timeout: 10000

# 资源 Tab（诚实空态）
- tapOn: "资源"
- extendedRunUntil:
    commands:
      - screenshot: M11_resources_tab
    condition:
      visible: ".*资源.*"
    timeout: 10000

# 我的 Tab（诚实空态）
- tapOn: "我的"
- extendedRunUntil:
    commands:
      - screenshot: M17_profile_tab
    condition:
      visible: ".*我的.*"
    timeout: 10000

# 回到工作台收尾（确认 Tab 切换稳定）
- tapOn: "工作台"
- extendedRunUntil:
    commands:
      - screenshot: M03_workbench_return
    condition:
      visible: "工作台"
    timeout: 10000

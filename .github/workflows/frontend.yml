name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build_frontend_dist.sh"
      - "scripts/build_react_web_bundle.sh"
      - "scripts/check-react-boundaries.mjs"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build_frontend_dist.sh"
      - "scripts/build_react_web_bundle.sh"
      - "scripts/check-react-boundaries.mjs"
      - ".dockerignore"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-image:
    name: Docker multi-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build UI image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_FRONTEND_COMMIT="${GITHUB_SHA::7}" \
            -t weknora-ui:ci \
            .

  react-workspace:
    name: React shared, Web, Embed, and Desktop checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: npm install --global pnpm@10.28.2

      - name: Install React workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check React boundaries
        run: node scripts/check-react-boundaries.mjs

      - name: Test shared packages
        run: pnpm test:shared

      - name: Type-check shared packages
        run: pnpm typecheck:shared

      - name: Test and build Web
        run: pnpm test:web && pnpm typecheck:web && pnpm build:web

      - name: Test, type-check, and build Embed
        run: pnpm test:embed && pnpm typecheck:embed && pnpm build:embed

      - name: Test, type-check, and build Desktop renderer
        run: pnpm test:desktop && pnpm typecheck:desktop && pnpm build:desktop-renderer

  miniprogram:
    name: WeChat miniprogram gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        run: npm install --global pnpm@10.28.2

      - name: Install React workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check design tokens
        run: pnpm --filter @weknora/miniprogram run tokens:check

      - name: Run miniprogram tests
        run: pnpm --filter @weknora/miniprogram run test

      - name: Type-check miniprogram
        run: pnpm --filter @weknora/miniprogram run typecheck

      # 占位 origin 仅作产物构建校验（config/index.ts 强制 HTTPS 形制）；
      # 真实联调构建由发布流程注入 WEKNORA_API_ORIGIN，不在 CI 存放。
      - name: Build weapp bundle (placeholder origin)
        run: pnpm --filter @weknora/miniprogram run build:weapp
        env:
          WEKNORA_API_ORIGIN: https://placeholder.invalid

      - name: Shared mini regression suite
        run: pnpm exec tsx --test packages/api-client/src/chat/mini-regression.test.ts
